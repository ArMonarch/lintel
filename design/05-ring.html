<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 05 Ring</title>
<link rel="stylesheet" href="shared/base.css">
<style>
/* TODO-UPDATE-COMMENT: busy is now a jade arc sweeping over a dimmed track, info
   turns the ring gold, success fills the disc jade and lifts the vignette; the
   state word inside the ring is picked by CSS from the stage classes
   --- */
/* 05 Ring: after swaylock-effects and i3lock-color. No visible text field;
   the ring is the input. Each key lights a random arc, Backspace a gold one,
   the whole ring turns jade while busy and red on failure. In GTK the ring is
   a custom-drawn widget (snapshot + cairo), the rest is plain labels. */

.vignette {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 50% 40%,
        rgba(10, 5, 5, 0.28) 0px,
        rgba(10, 5, 5, 0.58) 460px,
        rgba(10, 5, 5, 0.82) 1100px);
    transition: opacity 900ms ease;
}

form {
    position: absolute;
    left: 50%;
    top: 40%;
    width: 400px;
    height: 400px;
    margin: -200px 0 0 -200px;
}

.ring {
    position: absolute;
    inset: 0;
    overflow: visible;
    filter: drop-shadow(0 18px 36px rgba(0, 0, 0, 0.45));
}

.ring circle {
    fill: none;
    stroke-width: 12;
    transform-box: fill-box;
    transform-origin: center;
}

.ring .inner {
    fill: rgba(13, 7, 6, 0.58);
    stroke: rgba(242, 232, 216, 0.1);
    stroke-width: 1;
    transition: fill 300ms;
}

.ring .track {
    stroke: rgba(242, 232, 216, 0.24);
    transition: stroke 250ms;
}

.ring .sweep {
    stroke: var(--jade);
    stroke-linecap: round;
    stroke-dasharray: 26 74;
    opacity: 0;
}

.ring .highlight {
    stroke: var(--lacquer);
    stroke-linecap: round;
    stroke-dasharray: 12 88;
    opacity: 0;
}

.ring .highlight.clear { stroke: var(--gold); }
.ring .highlight.flash { animation: flash 420ms ease-out; }

@keyframes flash {
    0% { opacity: 1; }
    100% { opacity: 0; }
}

form:not(:has(input:placeholder-shown)) .ring .track { stroke: rgba(242, 232, 216, 0.5); }

.is-busy .ring .track { stroke: rgba(242, 232, 216, 0.14); }
.is-busy .ring .sweep { opacity: 1; animation: spin 1.2s linear infinite; }

.is-error .ring .track { stroke: var(--danger); }
.is-error .ring .inner { fill: rgba(70, 16, 12, 0.62); }
.is-error .ring { animation: shake 360ms ease-in-out; }

.is-info .ring .track { stroke: var(--gold); animation: breathe 2.4s ease-in-out infinite; }

.is-success .ring .track { stroke: var(--jade); }
.is-success .ring .inner { fill: rgba(16, 58, 50, 0.62); }
.is-success .vignette { opacity: 0.45; }
.is-success .corner { opacity: 0; }

@keyframes spin { to { transform: rotate(360deg); } }

@keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
}

.face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.clock { font-size: 84px; font-weight: 300; line-height: 1; letter-spacing: -1px; }
.date { margin-top: 12px; font-size: 16px; letter-spacing: 0.5px; color: rgba(242, 232, 216, 0.7); }

.state {
    margin-top: 22px;
    height: 16px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: rgba(242, 232, 216, 0.45);
}

.state span { display: none; }
.is-idle form:has(input:placeholder-shown) .state .idle { display: block; }
.is-idle form:not(:has(input:placeholder-shown)) .state .typing { display: block; color: rgba(242, 232, 216, 0.8); }
.is-busy .state .busy { display: block; color: var(--jade); }
.is-error .state .error { display: block; color: var(--danger); }
.is-info .state .info { display: block; color: var(--gold); }
.is-success .state .success { display: block; color: var(--parchment); }

/* Focusable but invisible: typing goes here, the ring shows it. */
.hidden-input {
    position: absolute;
    inset: 0;
    opacity: 0;
    border-radius: 50%;
    cursor: default;
}

.below {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(40% + 224px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 16px 5px 5px;
    border-radius: 22px;
    font-size: 18px;
    font-weight: 600;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6);
    transition: background 150ms;
}

.user:hover { background: rgba(13, 7, 6, 0.5); }

.avatar {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1.5px solid rgba(242, 232, 216, 0.5);
    background: linear-gradient(135deg, var(--lacquer), var(--lacquer-deep));
    font-size: 14px;
    font-weight: 700;
    text-shadow: none;
}

.notes { min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 15px; }

.message,
.capslock {
    padding: 7px 16px;
    border-radius: 17px;
    background: rgba(13, 7, 6, 0.62);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
}

.message { color: rgba(242, 232, 216, 0.85); }
.message:empty { display: none; }
.is-error .message { color: var(--danger); }
.is-info .message { color: var(--gold); }
.capslock { color: var(--gold); }

.corner {
    position: absolute;
    bottom: 40px;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: opacity 500ms;
}

.corner.left { left: 48px; }
.corner.right { right: 48px; }

.corner button {
    height: 44px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    border-radius: 22px;
    font-size: 15px;
    color: rgba(242, 232, 216, 0.75);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
    transition: background 150ms, color 150ms;
}

.corner button:hover { color: var(--parchment); background: rgba(13, 7, 6, 0.5); }
.corner b { color: var(--parchment); font-weight: 600; }
.corner [data-power] { width: 44px; padding: 0; justify-content: center; }
.corner i[data-icon] { width: 26px; height: 26px; filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.6)); }
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="vignette"></div>

    <form data-login>
        <svg class="ring" viewBox="0 0 400 400">
            <circle class="inner" cx="200" cy="200" r="174"></circle>
            <circle class="track" cx="200" cy="200" r="186" pathLength="100"></circle>
            <circle class="sweep" cx="200" cy="200" r="186" pathLength="100"></circle>
            <circle class="highlight" cx="200" cy="200" r="186" pathLength="100"></circle>
        </svg>
        <div class="face">
            <div class="clock tabular" data-clock="time"></div>
            <div class="date" data-clock="short"></div>
            <div class="state">
                <span class="idle">Type to unlock</span>
                <span class="typing">Enter to unlock</span>
                <span class="busy">Verifying</span>
                <span class="error">Wrong password</span>
                <span class="info">Notice</span>
                <span class="success">Welcome</span>
            </div>
        </div>
        <input class="hidden-input" data-field="password" type="password" placeholder=" " aria-label="Password">
    </form>

    <div class="below">
        <button type="button" class="user" data-action="switch-user" title="Switch user">
            <span class="avatar" data-user-initial></span><span data-user-name></span>
        </button>
        <div class="notes">
            <span class="message" data-message></span>
            <span class="capslock" data-capslock>Caps Lock is on</span>
        </div>
    </div>

    <div class="corner left">
        <button data-action="session">Session&nbsp;<b data-session-name></b></button>
    </div>
    <div class="corner right">
        <button data-power="suspend" title="Sleep"><i data-icon="system-suspend"></i></button>
        <button data-power="reboot" title="Restart"><i data-icon="system-reboot"></i></button>
        <button data-power="shutdown" title="Shut Down"><i data-icon="system-shutdown"></i></button>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
<script>
// Ring feedback: a random arc per key, the way swaylock hides the length.
const highlight = document.querySelector(".ring .highlight");

function ring_flash(clear) {
    highlight.classList.remove("flash");
    highlight.classList.toggle("clear", clear);
    highlight.style.strokeDashoffset = String(Math.floor(Math.random() * 100));
    void highlight.getBBox();
    highlight.classList.add("flash");
}

field_password.addEventListener("keydown", (event) => {
    if (event.key === "Backspace") ring_flash(true);
    else if (event.key.length === 1) ring_flash(false);
});
</script>
</body>
</html>
