<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 23 Ripple</title>
<link rel="stylesheet" href="shared/base.css">
<style>
.stage {
    --fg: #f3f6f5;
    --muted: rgba(243, 246, 245, 0.76);
    --faint: rgba(243, 246, 245, 0.6);
    --hair: rgba(243, 246, 245, 0.3);
    --crest: rgba(240, 250, 248, 0.9);
    --glow: rgba(200, 240, 232, 0.38);
    --busy: #f4fffc;
    --busy-glow: rgba(190, 245, 236, 0.45);
    --error: #ff7c6a;
    --error-text: #ffc2b8;
    --error-glow: rgba(255, 96, 76, 0.45);
    --info: #a6ecdf;
    --info-glow: rgba(120, 230, 210, 0.35);
    --success: #e6fff0;
    --success-glow: rgba(120, 242, 170, 0.6);
    --caps: #f2cf7a;
    --pill-w: 392px;
    --pill-h: 50px;
    color: var(--fg);
    background: #0e2a2f var(--wallpaper) center / cover no-repeat;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 18px rgba(0, 0, 0, 0.5);
}

.shade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(ellipse 560px 240px at 960px 540px, rgba(4, 16, 19, 0.42), rgba(4, 16, 19, 0) 100%),
        radial-gradient(ellipse 1300px 800px at 960px 540px, rgba(0, 0, 0, 0) 55%, rgba(2, 10, 12, 0.5) 100%);
    transition: opacity 900ms ease;
}

.rings,
.standing {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.ring {
    position: absolute;
    left: 960px;
    top: 540px;
    width: var(--pill-w);
    height: var(--pill-h);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 1.5px solid var(--crest);
    box-shadow:
        0 0 22px -4px var(--glow),
        inset 0 0 22px -4px var(--glow),
        0 0 0 5px rgba(2, 14, 16, 0.07);
    opacity: 0;
    animation:
        ripple-grow var(--dur) cubic-bezier(0.12, 0.6, 0.3, 1) forwards,
        ripple-fade var(--dur) linear forwards;
}

.ring-key { --dur: 1700ms; --peak: 0.8; }
.ring-idle { --dur: 5200ms; --peak: 0.24; border-width: 1px; }

.ring-back {
    --dur: 1100ms;
    --peak: 0.55;
    animation-name: ripple-shrink, ripple-fade-in;
    animation-timing-function: cubic-bezier(0.5, 0, 0.8, 0.6), linear;
}

.ring-busy {
    --dur: 2600ms;
    --peak: 1;
    border: 2px solid var(--busy);
    box-shadow:
        0 0 34px -2px var(--busy-glow),
        inset 0 0 34px -2px var(--busy-glow),
        0 0 0 8px rgba(2, 14, 16, 0.08);
}

.ring-error {
    --dur: 1500ms;
    --peak: 1;
    border: 2.5px solid var(--error);
    box-shadow:
        inset 0 0 0 1px rgba(255, 232, 226, 0.7),
        0 0 0 3px rgba(50, 4, 0, 0.35),
        0 0 40px 2px var(--error-glow),
        inset 0 0 40px 0 var(--error-glow);
}

.ring-error-soft {
    --dur: 1900ms;
    --peak: 0.6;
    border: 1.5px solid var(--error);
    box-shadow:
        0 0 0 2px rgba(50, 4, 0, 0.25),
        0 0 24px -2px var(--error-glow);
}

.ring-success {
    --dur: 1500ms;
    --peak: 1;
    border: 3px solid var(--success);
    background: radial-gradient(closest-side, rgba(220, 255, 232, 0) 70%, rgba(220, 255, 232, 0.2) 97%, rgba(220, 255, 232, 0) 100%);
    box-shadow:
        0 0 70px 6px var(--success-glow),
        inset 0 0 70px 6px var(--success-glow);
    animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95), linear;
}

@keyframes ripple-grow {
    100% { width: var(--size); height: var(--size); }
}

@keyframes ripple-fade {
    0% { opacity: 0; }
    8% { opacity: var(--peak); }
    100% { opacity: 0; }
}

@keyframes ripple-shrink {
    0% { width: var(--size); height: var(--size); }
}

@keyframes ripple-fade-in {
    0% { opacity: 0; }
    40% { opacity: var(--peak); }
    100% { opacity: 0; }
}

.standing {
    opacity: 0;
    transition: opacity 700ms ease;
}

.standing span {
    position: absolute;
    left: 960px;
    top: 540px;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid var(--info);
    box-shadow: 0 0 30px -2px var(--info-glow), inset 0 0 30px -2px var(--info-glow);
    opacity: 0;
}

.is-info .standing { opacity: 1; }
.is-info .standing span { animation: stand 5600ms cubic-bezier(0.2, 0.5, 0.4, 1) infinite; }
.is-info .standing span:nth-child(2) { animation-delay: 1400ms; }
.is-info .standing span:nth-child(3) { animation-delay: 2800ms; }
.is-info .standing span:nth-child(4) { animation-delay: 4200ms; }

@keyframes stand {
    0% { width: 96px; height: 96px; opacity: 0; }
    12% { opacity: 1; }
    100% { width: 720px; height: 720px; opacity: 0; }
}

.flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 960px 540px, rgba(226, 255, 236, 0.5), rgba(226, 255, 236, 0) 60%);
    opacity: 0;
}

.is-success .flash { animation: flash 1600ms ease-out forwards; }

@keyframes flash {
    0% { opacity: 0; }
    18% { opacity: 1; }
    100% { opacity: 0; }
}

.ui {
    position: absolute;
    inset: 0;
}

.corner {
    position: absolute;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform 700ms cubic-bezier(0.2, 0.7, 0.3, 1), opacity 600ms ease, filter 600ms ease;
}

.corner.tl { left: 72px; top: 60px; }
.corner.tr { right: 72px; top: 68px; align-items: flex-end; }
.corner.bl { left: 72px; bottom: 64px; }
.corner.br { right: 72px; bottom: 64px; align-items: flex-end; }

.label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--faint);
}

.time {
    font-size: 64px;
    font-weight: 250;
    line-height: 1;
    letter-spacing: -0.01em;
}

.date {
    font-size: 17px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.01em;
}

.link {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 2px 0;
    font-size: 19px;
    font-weight: 400;
    color: var(--fg);
}

.link::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -3px;
    height: 1px;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 220ms ease;
}

.corner.tr .link::after,
.corner.br .link::after { transform-origin: right; }
.link:hover::after { transform: scaleX(1); }
.link i[data-icon] { width: 18px; height: 18px; opacity: 0.7; }
.link .dim { color: var(--muted); }

.power {
    display: flex;
    gap: 34px;
}

.power .link { font-size: 18px; color: var(--muted); }
.power .link:hover { color: var(--fg); }

.centre {
    position: absolute;
    left: 0;
    right: 0;
    top: 540px;
    height: 0;
    transition: transform 700ms cubic-bezier(0.2, 0.7, 0.3, 1), opacity 600ms ease, filter 600ms ease;
}

.name {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 48px;
    text-align: center;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: bottom 500ms cubic-bezier(0.3, 0, 0.2, 1);
}

.pill {
    position: absolute;
    left: 960px;
    top: 0;
    width: var(--pill-w);
    height: var(--pill-h);
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    padding: 0 7px;
    border-radius: 9999px;
    border: 1px solid var(--hair);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.07));
    backdrop-filter: blur(16px) saturate(1.25);
    box-shadow: 0 10px 34px rgba(0, 8, 10, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    transition: width 520ms cubic-bezier(0.3, 0, 0.2, 1), height 520ms cubic-bezier(0.3, 0, 0.2, 1), border-color 300ms, background 300ms, box-shadow 300ms;
}

.pill:focus-within {
    border-color: rgba(243, 246, 245, 0.55);
    box-shadow: 0 10px 34px rgba(0, 8, 10, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 0 0 4px rgba(236, 248, 245, 0.08);
}

.pill input {
    flex: 1;
    min-width: 0;
    height: 100%;
    text-align: center;
    font-size: 18px;
    letter-spacing: 5px;
    caret-color: var(--fg);
    text-shadow: none;
    transition: opacity 250ms;
}

.pill input::placeholder { letter-spacing: 0.02em; font-size: 16px; opacity: 0.55; }
.pill input:placeholder-shown { caret-color: transparent; }

.pill button {
    width: 36px;
    height: 36px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--muted);
    transition: opacity 250ms, background 150ms, color 150ms;
}

.pill button:hover { color: var(--fg); background: rgba(255, 255, 255, 0.12); }
.pill button i[data-icon] { width: 22px; height: 22px; }
.pill .go { background: rgba(255, 255, 255, 0.12); color: var(--fg); }

.print {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 54px;
    height: 54px;
    transform: translate(-50%, -50%) scale(0.6);
    color: var(--info);
    opacity: 0;
    pointer-events: none;
    transition: opacity 350ms ease, transform 500ms cubic-bezier(0.3, 0, 0.2, 1);
}

.notes {
    position: absolute;
    left: 0;
    right: 0;
    top: 46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 16px;
    transition: top 500ms cubic-bezier(0.3, 0, 0.2, 1);
}

.message {
    padding: 4px 14px;
    border-radius: 9999px;
    color: var(--muted);
    letter-spacing: 0.01em;
    background: rgba(4, 16, 19, 0.42);
    text-shadow: none;
    transition: color 200ms, background 200ms;
}

.message:empty { display: none; }
.capslock {
    padding: 3px 12px;
    border-radius: 9999px;
    font-size: 14px;
    color: var(--caps);
    letter-spacing: 0.04em;
    background: rgba(4, 16, 19, 0.42);
    text-shadow: none;
}

.is-busy .pill {
    border-color: rgba(244, 255, 252, 0.7);
    animation: pill-breathe 1300ms ease-in-out infinite;
}

.is-busy .pill input,
.is-busy .pill button { opacity: 0.55; }
.is-busy .message { color: var(--busy); }
.is-success .message { background: rgba(4, 24, 14, 0.42); }

@keyframes pill-breathe {
    0%, 100% { box-shadow: 0 10px 34px rgba(0, 8, 10, 0.3), 0 0 0 0 rgba(236, 248, 245, 0.3); }
    50% { box-shadow: 0 10px 34px rgba(0, 8, 10, 0.3), 0 0 26px 4px rgba(236, 248, 245, 0.32); }
}

.is-error .centre { animation: shake 420ms ease-in-out; }

.is-error .pill {
    border-color: var(--error);
    background: linear-gradient(180deg, rgba(255, 110, 90, 0.22), rgba(255, 90, 70, 0.1));
    box-shadow: 0 10px 34px rgba(0, 8, 10, 0.3), 0 0 24px rgba(255, 96, 76, 0.35);
}

.is-error .message {
    color: var(--error-text);
    font-weight: 500;
    background: rgba(40, 6, 4, 0.55);
}

.is-info .pill {
    width: 96px;
    height: 96px;
    border-color: var(--info);
    background: radial-gradient(circle, rgba(120, 230, 210, 0.18), rgba(255, 255, 255, 0.06));
}

.is-info .pill input,
.is-info .pill button { opacity: 0; pointer-events: none; }
.is-info .print { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.is-info .name { bottom: 74px; }
.is-info .notes { top: 70px; }

.is-info .message {
    color: var(--info);
    background: rgba(2, 20, 22, 0.5);
}

.is-success .pill {
    border-color: var(--success);
    box-shadow: 0 0 40px rgba(120, 242, 170, 0.5);
}

.is-success .message { color: var(--success); }
.is-success .shade { opacity: 0.3; }

.is-success .centre {
    transition: transform 800ms cubic-bezier(0.3, 0, 0.2, 1) 120ms, opacity 600ms ease 160ms, filter 600ms ease 160ms;
    transform: scale(1.18);
    opacity: 0;
    filter: blur(10px);
}

.is-success .corner {
    transition: transform 900ms cubic-bezier(0.5, 0, 0.75, 0) 280ms, opacity 700ms ease 380ms, filter 700ms ease 380ms;
    opacity: 0;
    filter: blur(6px);
}
.is-success .corner.tl { transform: translate(-90px, -60px); }
.is-success .corner.tr { transform: translate(90px, -60px); }
.is-success .corner.bl { transform: translate(-90px, 60px); }
.is-success .corner.br { transform: translate(90px, 60px); }
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="shade"></div>
    <div class="rings"></div>
    <div class="standing"><span></span><span></span><span></span><span></span></div>
    <div class="flash"></div>

    <div class="ui">
        <div class="corner tl">
            <div class="time tabular" data-clock="time"></div>
            <div class="date" data-clock="long"></div>
        </div>

        <div class="corner tr">
            <div class="label">Not <span data-user-name></span>?</div>
            <button class="link" data-action="switch-user">Switch user <i data-icon="system-switch-user"></i></button>
        </div>

        <div class="corner bl">
            <div class="label">Session</div>
            <button class="link" data-action="session"><span data-session-name></span><i data-icon="go-next"></i></button>
        </div>

        <div class="corner br">
            <div class="label">Power</div>
            <div class="power">
                <button class="link" data-power="suspend">Sleep</button>
                <button class="link" data-power="reboot">Restart</button>
                <button class="link" data-power="shutdown">Power off</button>
            </div>
        </div>

        <div class="centre">
            <div class="name" data-user-name></div>
            <form data-login class="pill">
                <button type="button" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
                <input data-field="password" type="password" placeholder="Password" aria-label="Password">
                <button type="button" class="go" data-action="login" title="Log in"><i data-icon="go-next"></i></button>
                <svg class="print" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                    <path d="M11 17.5A15 15 0 0 1 37 17.5"/>
                    <path d="M8.5 27a16 16 0 0 1 1.2-7.5"/>
                    <path d="M14 38c-2-3.4-3-7.2-3-11a13 13 0 0 1 26 0v1.5"/>
                    <path d="M19.5 42c-2.4-4.4-3.5-9-3.5-14.5a8 8 0 0 1 16 0c0 4.3-.6 8.2-1.8 11.6"/>
                    <path d="M24 27.5c0 5.4 1.1 10 3.2 14"/>
                    <path d="M36.6 34.5c.3-1.7.4-3.4.4-5"/>
                    <path d="M16.2 8.8a19 19 0 0 1 15.6 0"/>
                </svg>
            </form>
            <div class="notes">
                <span class="message" data-message></span>
                <span class="capslock" data-capslock>Caps Lock is on</span>
            </div>
        </div>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>

<script>
const RINGS_MAX = 32;
const RING_BUSY_INTERVAL_MS = 1800;
const RING_BUSY_STAGGER_MS = 260;
const RING_IDLE_INTERVAL_MS = 7000;
const RING_KINDS = {
    key: { size: 760, spread: 240 },
    back: { size: 700, spread: 120 },
    idle: { size: 1400, spread: 200 },
    busy: { size: 2100, spread: 0 },
    error: { size: 1700, spread: 0 },
    "error-soft": { size: 2300, spread: 0 },
    success: { size: 4600, spread: 0 },
};

const ring_layer = document.querySelector(".rings");
let ring_busy_timer = 0;

function ring_spawn(kind, delay_ms) {
    console.assert(kind in RING_KINDS, `unknown ring ${kind}`);
    console.assert(delay_ms >= 0, delay_ms);
    while (ring_layer.childElementCount >= RINGS_MAX) ring_layer.firstElementChild.remove();
    const spec = RING_KINDS[kind];
    const ring = document.createElement("span");
    ring.className = `ring ring-${kind}`;
    ring.style.setProperty("--size", `${Math.round(spec.size + Math.random() * spec.spread)}px`);
    ring.style.animationDelay = `${delay_ms}ms`;
    ring.addEventListener("animationend", () => ring.remove());
    ring_layer.append(ring);
    console.assert(ring_layer.childElementCount <= RINGS_MAX);
}

function ring_busy_wave() {
    for (let index = 0; index < 3; index += 1) ring_spawn("busy", index * RING_BUSY_STAGGER_MS);
}

function ripple_state_enter(state) {
    clearInterval(ring_busy_timer);
    ring_busy_timer = 0;
    switch (state) {
        case "busy":
            ring_busy_wave();
            ring_busy_timer = setInterval(ring_busy_wave, RING_BUSY_INTERVAL_MS);
            break;
        case "error":
            ring_spawn("error", 0);
            ring_spawn("error-soft", 180);
            break;
        case "success":
            ring_spawn("success", 0);
            break;
        case "idle":
        case "info":
            break;
        default:
            console.assert(false, `unknown state ${state}`);
    }
}

const ripple_state_set_base = state_set;
state_set = function (state, text) {
    ripple_state_set_base(state, text);
    ripple_state_enter(state);
};

function on_password_input(event) {
    if (stage.classList.contains("is-info")) state_set("idle", "");
    const deleting = String(event.inputType ?? "").startsWith("delete");
    ring_spawn(deleting ? "back" : "key", 0);
}

function on_idle_tick() {
    if (!stage.classList.contains("is-idle")) return;
    if (field_password.value.length > 0) return;
    ring_spawn("idle", 0);
}

field_password.addEventListener("input", on_password_input);
setInterval(on_idle_tick, RING_IDLE_INTERVAL_MS);
ripple_state_enter(STATES.find((each) => stage.classList.contains(`is-${each}`)) ?? "idle");
</script>
