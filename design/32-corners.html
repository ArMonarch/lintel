<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 32 Corners</title>
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face {
    font-family: "Atkinson Hyperlegible Next";
    src: url("assets/fonts/AtkinsonHyperlegibleNext-Regular.otf") format("opentype");
    font-weight: 400;
}

@font-face {
    font-family: "Atkinson Hyperlegible Next";
    src: url("assets/fonts/AtkinsonHyperlegibleNext-Bold.otf") format("opentype");
    font-weight: 700;
}

@font-face {
    font-family: "Atkinson Hyperlegible Next";
    src: url("assets/fonts/AtkinsonHyperlegibleNext-ExtraBold.otf") format("opentype");
    font-weight: 800;
}

.stage {
    --peri: #b4b4f0;
    --peri-soft: rgba(180, 180, 240, 0.72);
    --peri-line: rgba(180, 180, 240, 0.42);
    --peri-wash: rgba(180, 180, 240, 0.1);
    --panel: #1e1d36;
    --glass: rgba(30, 29, 54, 0.78);
    --white: #ffffff;
    --red: #ff7d90;
    --red-text: #ffc2cb;
    --ease: cubic-bezier(0.3, 0.7, 0.2, 1);
    --edge: 96px;
    font-family: "Atkinson Hyperlegible Next", var(--font-sans);
    color: var(--peri);
}

.scrim {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(ellipse 1040px 640px at 100% 0%, rgba(14, 13, 30, 0.72), rgba(14, 13, 30, 0) 72%),
        radial-gradient(ellipse 760px 820px at 100% 100%, rgba(14, 13, 30, 0.66), rgba(14, 13, 30, 0) 72%),
        radial-gradient(ellipse 720px 520px at 0% 100%, rgba(14, 13, 30, 0.62), rgba(14, 13, 30, 0) 72%);
    transition: opacity 900ms var(--ease);
}

.corner { position: absolute; transition: opacity 500ms var(--ease), transform 700ms var(--ease); }

.tr {
    right: var(--edge);
    top: 76px;
    text-align: right;
    text-shadow: 0 2px 4px rgba(14, 13, 30, 0.35), 0 4px 36px rgba(14, 13, 30, 0.6);
}

.date { font-size: 40px; font-weight: 400; letter-spacing: 0.2px; }

.time {
    margin-top: 2px;
    margin-right: -6px;
    font-size: 184px;
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -5px;
}

.br {
    right: var(--edge);
    bottom: var(--edge);
    width: 460px;
}

.stack { display: flex; flex-direction: column; align-items: stretch; }

.avatar {
    align-self: center;
    width: 172px;
    height: 172px;
    margin-bottom: 30px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background:
        radial-gradient(circle at 32% 26%, #d6d6fa, var(--peri) 46%, #8e8ed6);
    box-shadow: 0 0 0 7px rgba(30, 29, 54, 0.55), 0 0 0 9px var(--peri-line), 0 24px 60px rgba(10, 9, 24, 0.5);
    color: var(--panel);
    font-size: 84px;
    font-weight: 800;
    line-height: 1;
    transition: opacity 500ms var(--ease), transform 600ms var(--ease);
}

.pill {
    position: relative;
    height: 68px;
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 22px 0 26px;
    border-radius: 999px;
    border: 2px solid var(--peri-line);
    background: var(--glass);
    font-size: 22px;
    overflow: hidden;
    transition:
        height 420ms var(--ease),
        margin 420ms var(--ease),
        opacity 320ms var(--ease),
        border-color 200ms,
        background 300ms,
        color 300ms;
}

.pill.user { margin-top: 0; }
.pill > i[data-icon], .pill > .glyph { width: 24px; height: 24px; flex: none; color: var(--peri-soft); }
.pill .glyph svg { width: 100%; height: 100%; display: block; }

.user { width: 100%; text-align: left; }
.user:hover { border-color: var(--peri); }
.user .name { flex: 1; font-weight: 700; }
.user .swap { width: 22px; height: 22px; opacity: 0.7; }

.password:focus-within { border-color: var(--peri); background: rgba(30, 29, 54, 0.8); }

.password input {
    flex: 1;
    min-width: 0;
    height: 100%;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--white);
    caret-color: var(--peri);
}

.password input[type="password"] { font-size: 26px; letter-spacing: 4px; }
.password input::placeholder { color: var(--peri); opacity: 0.55; font-size: 22px; letter-spacing: 0.2px; }

.caps {
    flex: none;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--peri);
    color: var(--panel);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.2px;
}

.reveal { display: inline-flex; color: var(--peri-soft); }
.reveal:hover { color: var(--peri); }

.login {
    justify-content: center;
    border-color: var(--peri);
    background: var(--peri);
    color: var(--panel);
    font-weight: 800;
    letter-spacing: 0.4px;
}

.login:hover { background: #c6c6f6; }
.login .label { transition: opacity 200ms; }
.login i[data-icon] { position: absolute; right: 24px; width: 24px; height: 24px; color: var(--panel); opacity: 0.85; transition: opacity 200ms; }

.login::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -40%;
    width: 40%;
    border-radius: 999px;
    background: var(--peri);
    opacity: 0;
}

.note {
    height: auto;
    max-height: 0;
    margin-top: 0;
    padding: 0 26px;
    border-width: 0;
    opacity: 0;
    align-items: center;
    font-size: 20px;
    line-height: 1.3;
    transition:
        max-height 420ms var(--ease),
        margin 420ms var(--ease),
        padding 420ms var(--ease),
        opacity 320ms var(--ease),
        border-color 200ms,
        background 300ms,
        color 300ms;
}

.note .glyph { display: none; width: 28px; height: 28px; }
.note .message { flex: 1; }

.is-busy .note,
.is-error .note,
.is-info .note,
.is-success .note {
    max-height: 120px;
    margin-bottom: 14px;
    padding: 18px 26px;
    border-width: 2px;
    opacity: 1;
}

.is-busy .note { border-color: var(--peri-line); background: var(--glass); color: var(--peri); }
.is-busy .note .busy { display: block; animation: spin 900ms linear infinite; }
.is-error .note { border-color: var(--red); background: rgba(30, 29, 54, 0.88); color: var(--red-text); }
.is-error .note .error { display: block; color: var(--red); }
.is-info .note { border-color: var(--peri); background: var(--peri); color: var(--panel); font-weight: 700; }
.is-info .note .info { display: block; color: var(--panel); }
.is-success .note { border-color: var(--peri); background: var(--peri); color: var(--panel); font-weight: 800; margin-bottom: 0; }
.is-success .note .success { display: block; color: var(--panel); }

.is-busy .login {
    height: 8px;
    margin-top: 30px;
    padding: 0;
    border-width: 0;
    background: rgba(180, 180, 240, 0.24);
    pointer-events: none;
}

.is-busy .login .label,
.is-busy .login i[data-icon] { opacity: 0; }
.is-busy .login::after { opacity: 1; animation: sweep 1100ms cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite; }
.is-busy .user, .is-busy .password { opacity: 0.6; }

.is-error .br { animation: shake 420ms ease-in-out; }
.is-error .password { border-color: var(--red); }
.is-error .password > .glyph { color: var(--red); }

.is-success .user,
.is-success .password,
.is-success .login {
    height: 0;
    margin-top: 0;
    border-width: 0;
    opacity: 0;
}

.is-success .avatar { opacity: 0; transform: translateY(40px) scale(0.8); }
.is-success .stack { animation: release 600ms var(--ease) 1500ms forwards; }

.is-busy .tr, .is-busy .bl { opacity: 0.32; }
.is-success .tr { opacity: 0; transform: translate(40px, -24px); }
.is-success .bl { opacity: 0; transform: translate(-40px, 24px); }
.is-success .scrim { opacity: 0; }

.bl {
    left: var(--edge);
    bottom: var(--edge);
    display: flex;
    align-items: center;
    gap: 18px;
}

.round {
    width: 76px;
    height: 76px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 2px solid var(--peri-line);
    background: var(--glass);
    color: var(--peri);
    transition: background 200ms, color 200ms, border-color 200ms;
}

.round:hover { border-color: var(--peri); }
.round i[data-icon], .round .glyph { width: 30px; height: 30px; }
.round .glyph svg { width: 100%; height: 100%; display: block; }
.is-power-open .round.power,
.is-session-open .round.sessions { background: var(--peri); border-color: var(--peri); color: var(--panel); }

.current {
    margin-left: 8px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    text-align: left;
    text-shadow: 0 1px 16px rgba(14, 13, 30, 0.6);
}

.current small { font-size: 15px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--peri-soft); }
.current b { font-size: 24px; font-weight: 700; }
.current:hover b { color: var(--white); }

.panel {
    position: absolute;
    left: 0;
    bottom: 100px;
    border-radius: 36px;
    background: var(--panel);
    box-shadow: 0 30px 80px rgba(6, 5, 16, 0.6), inset 0 0 0 1px rgba(180, 180, 240, 0.12);
    opacity: 0;
    transform: translateY(16px) scale(0.96);
    transform-origin: 0 100%;
    pointer-events: none;
    transition: opacity 220ms var(--ease), transform 320ms var(--ease);
}

.is-power-open .panel.power,
.is-session-open .panel.sessions { opacity: 1; transform: none; pointer-events: auto; }

.panel h2 {
    padding: 6px 10px 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--peri-soft);
}

.panel.power { padding: 22px 22px 22px; }
.tiles { display: flex; gap: 14px; }

.tile {
    width: 140px;
    height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    border-radius: 26px;
    background: var(--peri-wash);
    color: var(--peri);
    font-size: 19px;
    font-weight: 700;
    transition: background 160ms, color 160ms;
}

.tile i[data-icon] { width: 42px; height: 42px; }
.tile:hover { background: rgba(180, 180, 240, 0.2); }
.tile.off:hover { background: var(--red); color: var(--panel); }

.panel.sessions { width: 360px; padding: 22px 16px 16px; }
.list { display: flex; flex-direction: column; gap: 6px; }

.row {
    height: 84px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px 0 18px;
    border-radius: 999px;
    color: var(--peri);
    text-align: left;
    transition: background 160ms, color 160ms;
}

.row:hover { background: var(--peri-wash); }
.row .mark { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--peri-wash); font-size: 18px; font-weight: 800; }
.row .text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.row b { font-size: 21px; font-weight: 700; }
.row small { font-size: 15px; color: var(--peri-soft); }
.row .check { width: 22px; height: 22px; opacity: 0; }
.row.is-selected { background: var(--white); color: var(--panel); }
.row.is-selected small { color: rgba(30, 29, 54, 0.66); }
.row.is-selected .mark { background: var(--panel); color: var(--white); }
.row.is-selected .check { opacity: 1; }

button:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }

@keyframes sweep {
    from { left: -40%; }
    to { left: 100%; }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes release {
    to { opacity: 0; transform: translateY(12px) scale(0.98); }
}
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="scrim"></div>

    <div class="corner tr">
        <div class="date" data-clock="long"></div>
        <div class="time tabular" data-clock="time"></div>
    </div>

    <div class="corner br">
        <form class="stack" data-login>
            <div class="avatar" data-user-initial></div>
            <div class="pill note" role="status">
                <span class="glyph busy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9" /></svg></span>
                <span class="glyph error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5" /><path d="M12 7v6" /><path d="M12 16.6v.2" /></svg></span>
                <span class="glyph info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5.2 8.4a8 8 0 0 1 13.6 0" /><path d="M4 12.6c0-1 .2-2 .6-2.9" /><path d="M7.4 19.6A9.6 9.6 0 0 1 6.6 12a5.4 5.4 0 0 1 10.8 0v.8" /><path d="M10.6 21a12 12 0 0 1-1.4-9 2.8 2.8 0 0 1 5.6 0c0 2.6.4 4.8 1.2 6.6" /><path d="M12 12c0 3 .6 5.8 1.8 8.2" /><path d="M17.6 16.4c.2-1.2.3-2.4.3-3.6" /><path d="M20 12c0 1.4-.1 2.8-.4 4" /></svg></span>
                <span class="glyph success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l4.8 4.8L19.5 7" /></svg></span>
                <span class="message" data-message></span>
            </div>
            <button type="button" class="pill user" data-action="switch-user" title="Switch user">
                <i data-icon="user-identity"></i>
                <span class="name" data-user-name></span>
                <i data-icon="system-switch-user" class="swap"></i>
            </button>
            <label class="pill password">
                <span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="10" rx="3" /><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" /></svg></span>
                <input data-field="password" type="password" placeholder="Password" aria-label="Password">
                <span class="caps" data-capslock>CAPS</span>
                <button type="button" class="reveal" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
            </label>
            <button class="pill login" type="submit"><span class="label">Log in</span><i data-icon="go-next"></i></button>
        </form>
    </div>

    <div class="corner bl">
        <div class="panel power" role="menu">
            <h2>Power</h2>
            <div class="tiles">
                <button class="tile" data-power="suspend"><i data-icon="system-suspend"></i>Sleep</button>
                <button class="tile" data-power="reboot"><i data-icon="system-reboot"></i>Restart</button>
                <button class="tile off" data-power="shutdown"><i data-icon="system-shutdown"></i>Power off</button>
            </div>
        </div>
        <div class="panel sessions" role="listbox">
            <h2>Session</h2>
            <div class="list"></div>
        </div>
        <button type="button" class="round power" title="Power"><i data-icon="system-shutdown"></i></button>
        <button type="button" class="round sessions" title="Sessions"><span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="7" height="7" rx="2" /><rect x="13.5" y="3.5" width="7" height="7" rx="2" /><rect x="3.5" y="13.5" width="7" height="7" rx="2" /><rect x="13.5" y="13.5" width="7" height="7" rx="3.5" /></svg></span></button>
        <button type="button" class="current" data-action="session" title="Next session"><small>Session</small><b data-session-name></b></button>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
<script>
const SESSION_NOTES = {
    "niri": "Scrollable tiling",
    "Plasma (Wayland)": "KDE desktop",
    "Shell": "Text login shell",
};
const PANEL_CLOSE_DELAY_MS = 260;

const session_list = document.querySelector(".panel.sessions .list");
const session_label = document.querySelector(".current [data-session-name]");

function panel_set(name) {
    console.assert(name === "" || name === "power" || name === "session", name);
    stage.classList.toggle("is-power-open", name === "power");
    stage.classList.toggle("is-session-open", name === "session");
}

function panel_toggle(name) {
    const open = stage.classList.contains(`is-${name}-open`);
    panel_set(open ? "" : name);
}

function session_render() {
    console.assert(SESSIONS.length > 0 && SESSIONS.length <= 8, SESSIONS.length);
    session_list.innerHTML = "";
    for (let index = 0; index < SESSIONS.length; index += 1) {
        const name = SESSIONS[index];
        const row = document.createElement("button");
        row.type = "button";
        row.className = "row";
        row.classList.toggle("is-selected", index === session_index);
        row.dataset.sessionIndex = String(index);
        row.innerHTML = `<span class="mark">${name[0].toUpperCase()}</span><span class="text"><b></b><small></small></span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l4.8 4.8L19.5 7" /></svg>`;
        row.querySelector("b").textContent = name;
        row.querySelector("small").textContent = SESSION_NOTES[name] ?? "";
        session_list.append(row);
    }
}

function session_pick(index) {
    console.assert(index >= 0 && index < SESSIONS.length, index);
    let steps = 0;
    while (session_index !== index) {
        session_next();
        steps += 1;
        console.assert(steps <= SESSIONS.length);
    }
    session_render();
    setTimeout(() => panel_set(""), PANEL_CLOSE_DELAY_MS);
}

document.querySelector(".round.power").addEventListener("click", () => panel_toggle("power"));
document.querySelector(".round.sessions").addEventListener("click", () => panel_toggle("session"));

session_list.addEventListener("click", (event) => {
    const row = event.target.closest(".row");
    if (row === null) return;
    session_pick(Number(row.dataset.sessionIndex));
});

for (const tile of document.querySelectorAll(".tile")) {
    tile.addEventListener("click", () => panel_set(""));
}

document.addEventListener("click", (event) => {
    if (event.target.closest(".bl") !== null) return;
    panel_set("");
});

document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") panel_set("");
});

new MutationObserver(session_render).observe(session_label, { childList: true, characterData: true, subtree: true });

new MutationObserver(() => {
    if (stage.classList.contains("is-busy") || stage.classList.contains("is-success")) panel_set("");
}).observe(stage, { attributes: true, attributeFilter: ["class"] });

session_render();
</script>
</body>
</html>
