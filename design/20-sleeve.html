<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 20 Sleeve</title>
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/BarlowCondensed-Light.otf") format("opentype"); font-weight: 300; }
@font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/BarlowCondensed-Medium.otf") format("opentype"); font-weight: 500; }
@font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/BarlowCondensed-Bold.otf") format("opentype"); font-weight: 700; }
@font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/BarlowCondensed-Black.otf") format("opentype"); font-weight: 900; }

.stage {
    --paper: #f1ece2;
    --ink: #17161a;
    --muted: #6f685c;
    --indigo: #1f2a5a;
    --ochre: #e0a030;
    --ochre-deep: #946416;
    --print: var(--indigo);
    --vermilion: #d94a2b;
    --x0: 1144px;
    background: var(--paper);
    color: var(--ink);
    font-family: "Barlow Condensed", "DejaVu Sans Condensed", sans-serif;
    font-feature-settings: "tnum" 1, "lnum" 1;
}

.cover {
    position: absolute;
    left: 0;
    top: 0;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: var(--ochre);
}

.plate {
    position: absolute;
    inset: 0;
    background: var(--wallpaper) 46% 50% / auto 118% no-repeat;
    transition: opacity 900ms ease;
}

.plate.duo-a { filter: contrast(1.25) brightness(1.04) url(#duo-a); }
.plate.duo-b { filter: contrast(1.35) url(#duo-b); opacity: 0; }

.screen {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(23, 22, 26, 0.55) 0 1.1px, transparent 1.6px) 0 0 / 5px 5px;
    mix-blend-mode: multiply;
    opacity: 0.32;
    transition: opacity 900ms ease;
}

.cover-label {
    position: absolute;
    left: 64px;
    top: 58px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    color: var(--paper);
    text-transform: uppercase;
    transition: opacity 600ms;
}

.cover-label b { font-size: 46px; font-weight: 900; line-height: 0.9; letter-spacing: 0.01em; text-shadow: 2px 2px 0 var(--print); }
.cover-label span { font-size: 17px; font-weight: 500; letter-spacing: 0.34em; text-shadow: 1px 1px 0 var(--print); }

.cover-side {
    position: absolute;
    right: 56px;
    bottom: 50px;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--paper);
    text-shadow: 1px 1px 0 var(--print);
    transition: opacity 600ms;
}

.small {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
}

.slide { transition: transform 700ms cubic-bezier(0.6, 0, 0.3, 1), opacity 500ms ease; }

.header {
    position: absolute;
    left: var(--x0);
    right: 64px;
    top: 60px;
    display: flex;
    justify-content: space-between;
}

.header b { font-weight: 700; }

.clock {
    position: absolute;
    left: calc(var(--x0) - 12px);
    top: 118px;
    display: flex;
    align-items: center;
    font-size: 316px;
    font-weight: 900;
    line-height: 0.78;
    letter-spacing: -0.01em;
    transition-delay: 60ms;
}

.colon {
    display: flex;
    flex-direction: column;
    gap: 60px;
    margin: 0 18px 0 22px;
}

.colon::before,
.colon::after {
    content: "";
    width: 34px;
    height: 34px;
    background: var(--ochre);
    transition: background 600ms;
}

.who {
    position: absolute;
    left: var(--x0);
    top: 430px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 12px;
    transition-delay: 140ms;
}

.who i[data-icon] { width: 20px; height: 20px; }

.name {
    position: absolute;
    left: calc(var(--x0) - 6px);
    top: 462px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    font-size: 190px;
    line-height: 0.8;
    text-transform: uppercase;
    white-space: nowrap;
    text-align: left;
    transition-delay: 180ms;
}

.name .heavy { font-weight: 900; color: var(--ink); }
.name .light { font-weight: 300; color: var(--indigo); margin-left: 216px; }
.name:hover .heavy { color: var(--indigo); }

form {
    position: absolute;
    left: var(--x0);
    top: 800px;
    width: 448px;
}

.label {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
}

.capslock { color: var(--ochre-deep); font-weight: 700; }

.field {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 64px;
    margin-top: 2px;
    padding-right: 2px;
    border-bottom: 1px solid var(--ink);
    transition: border-color 200ms, color 200ms;
}

.field input {
    flex: 1;
    min-width: 0;
    height: 100%;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 0.18em;
    caret-color: var(--vermilion);
}

.field input[type="text"] { letter-spacing: 0.04em; }

.field button {
    display: inline-flex;
    padding: 4px;
    color: var(--muted);
}

.field button:hover { color: var(--ink); }
.field i[data-icon] { width: 20px; height: 20px; }

.field::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 100%;
    height: 3px;
    background: var(--vermilion);
    transform: scaleX(0);
    transform-origin: 0 50%;
}

.field:focus-within { border-bottom-color: var(--indigo); }

.notes {
    margin-top: 16px;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
}

.wrong {
    display: none;
    font-size: 56px;
    font-weight: 900;
    line-height: 0.9;
    text-transform: uppercase;
    color: var(--vermilion);
}

.message {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--muted);
}

.disc {
    display: none;
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background:
        radial-gradient(circle, var(--vermilion) 0 4px, var(--ink) 4.5px 5.5px, transparent 6px),
        repeating-radial-gradient(circle, #2a282e 0 1px, var(--ink) 1px 2.5px);
    position: relative;
}

.disc::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 20%, rgba(241, 236, 226, 0.35) 25%, transparent 30% 70%, rgba(241, 236, 226, 0.35) 75%, transparent 80%);
}

.tracks {
    position: absolute;
    left: 1636px;
    top: 800px;
    width: 220px;
    transition-delay: 260ms;
}

.tracks > button {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
}

.tracks > button:hover { color: var(--ink); }
.tracks i[data-icon] { width: 16px; height: 16px; }

.tracks ol {
    list-style: none;
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.tracks li button {
    display: flex;
    align-items: baseline;
    gap: 14px;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
}

.tracks li button:hover { color: var(--ink); }
.tracks li em { font-style: normal; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; color: var(--ochre-deep); width: 22px; }
.tracks li.is-on button { color: var(--ink); font-weight: 700; }
.tracks li.is-on em { color: var(--vermilion); }

.credits {
    position: absolute;
    left: var(--x0);
    right: 64px;
    bottom: 50px;
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    transition-delay: 300ms;
}

.credits .lead { margin-right: auto; }
.credits .lead b { font-weight: 700; color: var(--ink); }

.credits button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    letter-spacing: inherit;
    text-transform: inherit;
    color: var(--ink);
}

.credits button:hover { color: var(--vermilion); }
.credits i[data-icon] { width: 18px; height: 18px; }

.is-busy .duo-b { opacity: 1; animation: duo-breathe 1800ms ease-in-out 900ms infinite alternate; }
.is-busy .disc { display: block; animation: spin 1600ms linear infinite; }
.is-busy .message { color: var(--ink); font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; font-size: 18px; }
.is-busy .field::after { animation: rule-run 1400ms cubic-bezier(0.6, 0, 0.4, 1) infinite; }
.is-busy .colon::before,
.is-busy .colon::after { background: var(--vermilion); }
.is-busy .cover { --print: #121113; }

.is-error .field { border-bottom-color: var(--vermilion); color: var(--vermilion); animation: shake 360ms ease-in-out, field-flash 700ms ease-out; }
.is-error .field::after { transform: scaleX(1); height: 2px; }
.is-error .wrong { display: block; animation: wrong-in 260ms cubic-bezier(0.2, 0.8, 0.3, 1); }
.is-error .message { color: var(--ink); }
.is-error .label { color: var(--vermilion); }
.is-error .colon::before,
.is-error .colon::after { background: var(--vermilion); }

.is-info .message {
    max-width: 448px;
    padding: 4px 0 4px 20px;
    border-left: 6px solid var(--indigo);
    font-size: 26px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: 0.01em;
    color: var(--indigo);
    animation: wrong-in 320ms cubic-bezier(0.2, 0.8, 0.3, 1);
}

.is-success .duo-a,
.is-success .duo-b { opacity: 0; }
.is-success .screen { opacity: 0; }
.is-success .cover-label,
.is-success .cover-side { opacity: 0; }
.is-success .slide { transform: translateX(900px); opacity: 0; }
.is-success form { transform: none; opacity: 1; }
.is-success form .label,
.is-success form .field { transform: translateX(900px); opacity: 0; transition: transform 700ms cubic-bezier(0.6, 0, 0.3, 1) 220ms, opacity 500ms 220ms; }
.is-success .notes { position: absolute; left: -6px; top: -338px; width: 782px; margin: 0; min-height: 0; }
.is-success .message {
    font-size: 120px;
    font-weight: 900;
    letter-spacing: 0;
    line-height: 0.8;
    text-transform: uppercase;
    max-width: 100%;
    color: var(--ink);
    animation: wrong-in 500ms cubic-bezier(0.2, 0.8, 0.3, 1) 500ms backwards;
}

@keyframes duo-breathe { to { opacity: 0.55; } }
@keyframes spin { to { transform: rotate(360deg); } }

@keyframes rule-run {
    0% { transform: scaleX(0); transform-origin: 0 50%; }
    50% { transform: scaleX(1); transform-origin: 0 50%; }
    50.01% { transform: scaleX(1); transform-origin: 100% 50%; }
    100% { transform: scaleX(0); transform-origin: 100% 50%; }
}

@keyframes field-flash {
    0%, 30% { background: var(--vermilion); color: var(--paper); }
    100% { background: transparent; }
}

@keyframes wrong-in {
    from { transform: translateX(-24px); opacity: 0; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="duo-a" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
        <feComponentTransfer>
            <feFuncR type="table" tableValues="0.1216 0.8784"/>
            <feFuncG type="table" tableValues="0.1647 0.6275"/>
            <feFuncB type="table" tableValues="0.3529 0.1882"/>
        </feComponentTransfer>
    </filter>
    <filter id="duo-b" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
        <feComponentTransfer>
            <feFuncR type="table" tableValues="0.0706 0.8510"/>
            <feFuncG type="table" tableValues="0.0667 0.2902"/>
            <feFuncB type="table" tableValues="0.0745 0.1686"/>
        </feComponentTransfer>
    </filter>
</svg>
<div class="stage" data-stage>
    <div class="cover">
        <div class="plate"></div>
        <div class="plate duo-a"></div>
        <div class="plate duo-b"></div>
        <div class="screen"></div>
        <div class="cover-label"><b>seiren</b><span>High fidelity</span></div>
        <div class="cover-side">Side A · 33⅓</div>
    </div>

    <div class="header small slide">
        <span>Stereo · LP <b data-clock="day-of-year"></b></span>
        <span><b data-clock="weekday"></b> <span data-clock="day-month-year"></span></span>
    </div>

    <div class="clock slide">
        <span data-clock="hours"></span><span class="colon"></span><span data-clock="minutes"></span>
    </div>

    <div class="who small slide">Sign in as <i data-icon="system-switch-user"></i></div>

    <button type="button" class="name slide" data-action="switch-user" title="Switch user">
        <span class="heavy" data-user-name></span>
        <span class="light" data-user-name></span>
    </button>

    <form data-login>
        <div class="label small">
            <span>Password</span>
            <span class="capslock" data-capslock>Caps lock</span>
        </div>
        <label class="field">
            <input data-field="password" type="password" aria-label="Password">
            <button type="button" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
            <button type="button" data-action="login" title="Log in"><i data-icon="go-next"></i></button>
        </label>
        <div class="notes">
            <div class="wrong">Wrong password!</div>
            <div class="message"><span class="disc"></span><span data-message></span></div>
        </div>
    </form>

    <div class="tracks slide">
        <button type="button" class="small" data-action="session" title="Next session">Session <i data-icon="go-next"></i></button>
        <ol data-tracks></ol>
    </div>

    <div class="credits slide">
        <span class="lead">Recorded at <b>seiren</b> · <span data-session-name></span></span>
        <button data-power="suspend" title="Sleep"><i data-icon="system-suspend"></i>Sleep</button>
        <button data-power="reboot" title="Restart"><i data-icon="system-reboot"></i>Restart</button>
        <button data-power="shutdown" title="Power off"><i data-icon="system-shutdown"></i>Power off</button>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
<script>
const tracks = document.querySelector("[data-tracks]");

function tracks_render() {
    console.assert(SESSIONS.length <= 9, "track list is laid out for at most 9 sessions");
    tracks.innerHTML = "";
    SESSIONS.forEach((name, index) => {
        const item = document.createElement("li");
        item.classList.toggle("is-on", index === session_index);
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.track = String(index);
        const number = document.createElement("em");
        number.textContent = `A${index + 1}`;
        const title = document.createElement("span");
        title.textContent = name;
        button.append(number, title);
        item.append(button);
        tracks.append(item);
    });
}

function track_pick(index) {
    console.assert(index >= 0 && index < SESSIONS.length, index);
    for (let step = 0; step < SESSIONS.length && session_index !== index; step += 1) session_next();
    console.assert(session_index === index);
}

tracks.addEventListener("click", (event) => {
    const button = event.target.closest("[data-track]");
    if (button === null) return;
    track_pick(Number(button.dataset.track));
});

new MutationObserver(tracks_render).observe(document.querySelector("[data-session-name]"), { childList: true, characterData: true, subtree: true });
tracks_render();
</script>
</body>
</html>
