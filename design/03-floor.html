<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 03 Floor</title>
<link rel="stylesheet" href="shared/base.css">
<style>
/* 03 Floor: the painting is the screen. Everything sits in one strip along
   the dark floor at the bottom, so nothing covers the art: time on the left,
   the login in the middle, session and power on the right. */

.strip {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 208px;
    padding: 88px 72px 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    background-image: linear-gradient(180deg,
        rgba(8, 4, 4, 0) 0%,
        rgba(8, 4, 4, 0.08) 14%,
        rgba(8, 4, 4, 0.3) 32%,
        rgba(8, 4, 4, 0.62) 50%,
        rgba(8, 4, 4, 0.84) 68%,
        rgba(8, 4, 4, 0.93) 100%);
}

.time { display: flex; align-items: baseline; gap: 18px; }

.clock {
    font-size: 56px;
    font-weight: 300;
    line-height: 1;
    color: var(--parchment);
}

.date {
    font-size: 15px;
    font-weight: 500;
    color: rgba(242, 232, 216, 0.55);
}

form { position: relative; }

.bar {
    width: 560px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 8px 0 8px;
    border-radius: 28px;
    border: 1px solid rgba(242, 232, 216, 0.14);
    background: rgba(20, 12, 11, 0.72);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    transition: border-color 150ms, opacity 400ms;
}

.bar:focus-within { border-color: rgba(230, 179, 92, 0.6); }

.avatar {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--lacquer);
    font-weight: 700;
    font-size: 17px;
}

.name {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px 8px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
}

.name:hover { background: rgba(242, 232, 216, 0.08); }
.name i[data-icon] { width: 16px; height: 16px; opacity: 0.6; }

.divider { width: 1px; height: 24px; background: rgba(242, 232, 216, 0.18); }

.bar input {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    letter-spacing: 1px;
}

.reveal { display: inline-flex; color: rgba(242, 232, 216, 0.5); }
.reveal:hover { color: var(--parchment); }

.go {
    position: relative;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--parchment);
    color: var(--ink);
    transition: background 150ms;
}

.go:hover { background: #fff; }

/* Floats above the bar so the strip keeps its height when a message shows. */
.notes {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 76px;
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 15px;
    font-weight: 500;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
    transition: transform 400ms;
}

.message { color: var(--parchment); }
.is-error .message { color: var(--danger); }
.is-info .message { color: var(--jade); }
.capslock { color: var(--gold); }

.is-error .bar { animation: shake 360ms ease-in-out; border-color: var(--danger); }
.is-info .bar { border-color: rgba(63, 174, 154, 0.6); }
.is-busy .go i[data-icon] { opacity: 0; }

.is-busy .go::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 20px;
    height: 20px;
    margin: -10px 0 0 -10px;
    border-radius: 50%;
    border: 2px solid rgba(13, 7, 6, 0.18);
    border-top-color: var(--ink);
    animation: spin 800ms linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.is-success .bar { opacity: 0; }
.is-success .notes { transform: translateY(50px); }

.actions {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 4px;
}

.actions button {
    height: 44px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border-radius: 22px;
    font-size: 14px;
    color: rgba(242, 232, 216, 0.7);
    transition: background 150ms, color 150ms;
}

.actions button:hover { color: var(--parchment); background: rgba(242, 232, 216, 0.1); }
.actions .session { margin-right: 12px; }
.actions .session b { color: var(--parchment); font-weight: 600; }
.actions [data-power] { width: 44px; justify-content: center; padding: 0; }
.actions [data-power] i[data-icon] { width: 26px; height: 26px; }
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="strip">
        <div class="time">
            <span class="clock tabular" data-clock="time"></span>
            <span class="date" data-clock="long"></span>
        </div>

        <form data-login>
            <div class="notes">
                <span class="message" data-message></span>
                <span class="capslock" data-capslock>Caps Lock is on</span>
            </div>
            <div class="bar">
                <span class="avatar" data-user-initial></span>
                <button type="button" class="name" data-action="switch-user" title="Switch user">
                    <span data-user-name></span><i data-icon="go-next"></i>
                </button>
                <span class="divider"></span>
                <input data-field="password" type="password" placeholder="Password">
                <button type="button" class="reveal" data-action="reveal" title="Show password">
                    <i data-icon="view-visible"></i>
                </button>
                <button class="go" type="submit" title="Log in"><i data-icon="go-next"></i></button>
            </div>
        </form>

        <div class="actions">
            <button class="session" data-action="session">Session&nbsp;<b data-session-name></b></button>
            <button data-power="suspend" title="Sleep"><i data-icon="system-suspend"></i></button>
            <button data-power="reboot" title="Restart"><i data-icon="system-reboot"></i></button>
            <button data-power="shutdown" title="Shut Down"><i data-icon="system-shutdown"></i></button>
        </div>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
</body>
</html>
