<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 26 Pinpad</title>
<link rel="stylesheet" href="shared/base.css">
<style>
.stage {
    --charcoal: #212121;
    --text: #f2f2f0;
    --muted: rgba(255, 255, 255, 0.56);
    --faint: rgba(255, 255, 255, 0.32);
    --hair: #ffffff33;
    --crimson: #ff3b5c;
    --crimson-deep: #c8102e;
    --lime: #c4f23a;
    --mono: "Adwaita Mono", "DejaVu Sans Mono", monospace;
    --cell: 185px;
    --grid: 556px;
    color: var(--text);
    background:
        radial-gradient(ellipse 900px 760px at 50% 52%, rgba(33, 33, 33, 0.94), rgba(33, 33, 33, 0.84)),
        var(--charcoal) var(--wallpaper) center / cover no-repeat;
}

.corner {
    position: absolute;
    top: 52px;
    display: flex;
    align-items: baseline;
    gap: 14px;
}

.corner.left { left: 60px; }
.corner.right { right: 60px; top: 63px; }

.clock {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.5px;
    font-feature-settings: "tnum" 1;
}

.caption {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: var(--muted);
}

.caption b { font-weight: 400; color: var(--text); }

.column {
    position: absolute;
    left: 50%;
    top: 150px;
    width: var(--grid);
    margin-left: calc(var(--grid) / -2);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.name {
    height: 52px;
    font-size: 44px;
    font-weight: 300;
    line-height: 52px;
    letter-spacing: 0.5px;
}

.hint {
    position: relative;
    height: 30px;
    margin-top: 14px;
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: opacity 200ms;
}

.hint > * {
    grid-area: 1 / 1;
    white-space: nowrap;
    transition: opacity 200ms;
}

.prompt { color: var(--muted); }

.message {
    opacity: 0;
    color: var(--muted);
}

.is-busy .prompt,
.is-error .prompt,
.is-info .prompt,
.is-success .prompt { opacity: 0; }

.is-busy .message,
.is-error .message,
.is-info .message { opacity: 1; }

.is-busy .message { color: var(--text); }
.is-error .message { color: var(--crimson); font-weight: 700; }

.is-info .message {
    padding: 6px 16px;
    border: 1px solid rgba(255, 255, 255, 0.5);
    color: var(--text);
    background: rgba(255, 255, 255, 0.06);
}

.is-success .hint { opacity: 0; }

.pad {
    position: relative;
    width: var(--grid);
    height: 28px;
    margin-top: 30px;
}

.dots {
    display: flex;
    gap: 20px;
}

.slot {
    position: relative;
    width: 28px;
    height: 28px;
    flex: none;
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 24px;
    line-height: 1;
}

.slot::before,
.slot::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
}

.slot::before {
    border: 1.5px solid var(--faint);
    transition: background 160ms, border-color 160ms, transform 160ms;
}

.slot::after {
    border: 2px solid var(--crimson);
    opacity: 0;
}

.slot.is-caret::before { border-color: rgba(255, 255, 255, 0.7); }
.slot.is-on::before { background: var(--text); border-color: var(--text); }
.slot.is-shown::before { background: none; border-color: transparent; }

.field {
    position: absolute;
    inset: -12px 0;
    width: 100%;
    opacity: 0;
    cursor: default;
}

.tag {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1.5px;
    white-space: nowrap;
}

.tag.caps {
    right: calc(100% + 26px);
    padding: 4px 8px;
    border: 1px solid var(--hair);
    color: var(--text);
    text-transform: uppercase;
}

.tag.more {
    left: calc(100% + 26px);
    font-size: 15px;
    color: var(--muted);
}

.board {
    position: relative;
    width: var(--grid);
    height: var(--grid);
    margin-top: 58px;
}

.grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, var(--cell));
    grid-auto-rows: var(--cell);
    border-left: 1px solid var(--hair);
    border-top: 1px solid var(--hair);
    transition: opacity 360ms, transform 360ms;
}

.reach {
    position: absolute;
    pointer-events: none;
    transition: opacity 360ms;
}

.reach.top,
.reach.bottom {
    left: 0;
    width: var(--grid);
    height: 32px;
    background: repeating-linear-gradient(90deg, var(--hair) 0 1px, transparent 1px var(--cell));
}

.reach.top { bottom: 100%; -webkit-mask-image: linear-gradient(to top, #000, transparent); mask-image: linear-gradient(to top, #000, transparent); }
.reach.bottom { top: 100%; -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent); }

.reach.left,
.reach.right {
    top: 0;
    height: var(--grid);
    width: 32px;
    background: repeating-linear-gradient(180deg, var(--hair) 0 1px, transparent 1px var(--cell));
}

.reach.left { right: 100%; -webkit-mask-image: linear-gradient(to left, #000, transparent); mask-image: linear-gradient(to left, #000, transparent); }
.reach.right { left: 100%; -webkit-mask-image: linear-gradient(to right, #000, transparent); mask-image: linear-gradient(to right, #000, transparent); }

.cell {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    border-right: 1px solid var(--hair);
    border-bottom: 1px solid var(--hair);
    color: var(--text);
    transition: background 140ms, color 140ms;
}

.cell:hover,
.cell:focus-visible { background: rgba(255, 255, 255, 0.06); }
.cell:active { background: rgba(255, 255, 255, 0.12); }

.cell .glyph {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
}

.cell .glyph svg,
.cell .glyph i[data-icon] {
    width: 38px;
    height: 38px;
}

.cell .label {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 2.2px;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 140ms;
}

.cell .index {
    position: absolute;
    left: 14px;
    top: 12px;
    font-family: var(--mono);
    font-size: 11px;
    color: rgba(255, 255, 255, 0.38);
}

.cell .mark {
    position: absolute;
    right: 14px;
    top: 15px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--charcoal);
    opacity: 0;
}

.cell.is-selected {
    background: var(--text);
    color: var(--charcoal);
}

.cell.is-selected .label { color: var(--charcoal); }
.cell.is-selected .index { color: rgba(33, 33, 33, 0.5); }
.cell.is-selected .mark { opacity: 1; }

.cell.enter .label { color: var(--text); }
.cell.power .glyph { opacity: 0.86; }

.is-busy .grid { opacity: 0.3; pointer-events: none; }
.is-busy .reach { opacity: 0.3; }
.is-busy .cell.is-selected { background: transparent; color: var(--text); }
.is-busy .cell.is-selected .label { color: var(--muted); }
.is-busy .cell.is-selected .index { color: rgba(255, 255, 255, 0.38); }
.is-busy .cell.is-selected .mark { background: var(--text); }

.result {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--hair);
    opacity: 0;
    pointer-events: none;
    transition: opacity 400ms;
}

.result .check {
    width: 112px;
    height: 112px;
    color: var(--lime);
}

.result .check circle {
    stroke-dasharray: 330;
    stroke-dashoffset: 330;
}

.result .check path {
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
}

.result .kicker {
    margin-top: 40px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--lime);
}

.result .session {
    margin-top: 14px;
    font-size: 60px;
    font-weight: 300;
    line-height: 1;
    text-align: center;
}

.result .who {
    margin-top: 22px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 1.5px;
    color: var(--muted);
}

.result .bar {
    position: absolute;
    left: -1px;
    right: -1px;
    bottom: -1px;
    height: 2px;
    background: var(--lime);
    transform: scaleX(0);
    transform-origin: left;
}

.is-error .slot::before { border-color: rgba(255, 59, 92, 0.42); }
.is-error .slot.is-on::before { background: var(--crimson); border-color: var(--crimson); }
.is-error .slot.is-on::after { animation: ring 720ms cubic-bezier(0.2, 0.7, 0.3, 1) calc(var(--i) * 45ms) both; }
.is-error .dots { animation: shake 420ms ease-in-out 180ms; }

.is-busy .slot.is-on::before { animation: pulse 1320ms ease-in-out calc(var(--i) * 110ms) infinite both; }

.is-success .slot.is-on::before {
    background: var(--lime);
    border-color: var(--lime);
    animation: bounce 640ms cubic-bezier(0.3, 0, 0.3, 1) calc(var(--i) * 55ms) both;
}

.is-success .grid { opacity: 0; transform: scale(0.97); transition-delay: 620ms; pointer-events: none; }
.is-success .reach { opacity: 0; transition-delay: 620ms; }
.is-success .result { opacity: 1; transition-delay: 820ms; }
.is-success .result .check circle { animation: draw 600ms ease-out 900ms forwards; }
.is-success .result .check path { animation: draw 360ms ease-out 1300ms forwards; }
.is-success .result .bar { animation: fill 1400ms ease-in-out 1100ms forwards; }

@keyframes ring {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(2.5); border-width: 0.5px; }
}

@keyframes pulse {
    0%, 40%, 100% { transform: scale(1); opacity: 0.4; }
    14% { transform: scale(1.32); opacity: 1; }
}

@keyframes bounce {
    0% { transform: translateY(0); }
    32% { transform: translateY(-26px) scale(1.06); }
    62% { transform: translateY(0) scale(1, 0.9); }
    80% { transform: translateY(-7px); }
    100% { transform: translateY(0); }
}

@keyframes draw {
    to { stroke-dashoffset: 0; }
}

@keyframes fill {
    to { transform: scaleX(1); }
}
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="corner left">
        <span class="clock" data-clock="time"></span>
        <span class="caption" data-clock="short"></span>
    </div>
    <div class="corner right">
        <span class="caption">seiren · <b data-session-name></b></span>
    </div>

    <form class="column" data-login>
        <div class="name" data-user-name></div>
        <div class="hint">
            <span class="prompt">Enter password</span>
            <span class="message" data-message></span>
        </div>
        <div class="pad">
            <div class="dots" data-dots></div>
            <input class="field" data-field="password" type="password" autocomplete="off" aria-label="Password">
            <span class="tag caps" data-capslock>Caps lock</span>
            <span class="tag more" data-more></span>
        </div>

        <div class="board">
            <div class="reach top"></div>
            <div class="reach bottom"></div>
            <div class="reach left"></div>
            <div class="reach right"></div>
            <div class="grid">
                <button type="button" class="cell" data-action="session" data-session-cell="0">
                    <span class="index">1</span><span class="mark"></span>
                    <span class="glyph"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1"><rect x="1.5" y="5.5" width="4" height="11"/><rect x="7.5" y="3.5" width="7" height="15"/><rect x="16.5" y="5.5" width="4" height="11"/></svg></span>
                    <span class="label" data-session-label></span>
                </button>
                <button type="button" class="cell" data-action="session" data-session-cell="1">
                    <span class="index">2</span><span class="mark"></span>
                    <span class="glyph"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1"><rect x="1.5" y="3.5" width="19" height="15"/><path d="M1.5 15.5h19M4 17h2M5.5 6.5h7v5h-7z"/></svg></span>
                    <span class="label" data-session-label></span>
                </button>
                <button type="button" class="cell" data-action="session" data-session-cell="2">
                    <span class="index">3</span><span class="mark"></span>
                    <span class="glyph"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1"><path d="M3.5 6.5l5 4.5-5 4.5M11 16.5h7.5"/></svg></span>
                    <span class="label" data-session-label></span>
                </button>
                <button type="button" class="cell" data-action="switch-user">
                    <span class="index">4</span>
                    <span class="glyph"><i data-icon="system-switch-user"></i></span>
                    <span class="label">Switch user</span>
                </button>
                <button type="button" class="cell" data-action="reveal">
                    <span class="index">5</span>
                    <span class="glyph"><i data-icon="view-visible"></i></span>
                    <span class="label" data-reveal-label>Show</span>
                </button>
                <button type="button" class="cell enter" data-action="login">
                    <span class="index">6</span>
                    <span class="glyph"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1"><path d="M18.5 4.5v8h-14M8.5 8.5l-4 4 4 4"/></svg></span>
                    <span class="label">Log in</span>
                </button>
                <button type="button" class="cell power" data-power="suspend">
                    <span class="index">7</span>
                    <span class="glyph"><i data-icon="system-suspend"></i></span>
                    <span class="label">Suspend</span>
                </button>
                <button type="button" class="cell power" data-power="reboot">
                    <span class="index">8</span>
                    <span class="glyph"><i data-icon="system-reboot"></i></span>
                    <span class="label">Restart</span>
                </button>
                <button type="button" class="cell power" data-power="shutdown">
                    <span class="index">9</span>
                    <span class="glyph"><i data-icon="system-shutdown"></i></span>
                    <span class="label">Power off</span>
                </button>
            </div>

            <div class="result">
                <svg class="check" viewBox="0 0 112 112" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="56" cy="56" r="52" transform="rotate(-90 56 56)"/><path d="M36 57l13 13 27-28"/></svg>
                <div class="kicker">Signed in · starting</div>
                <div class="session" data-session-name></div>
                <div class="who"><span data-user-name></span>@seiren</div>
                <div class="bar"></div>
            </div>
        </div>
    </form>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
<script>
const DOTS_VISIBLE = 12;
const DOTS_DEMO = 8;
const TRIES_MAX = 3;

const pinpad_dots = document.querySelector("[data-dots]");
const pinpad_more = document.querySelector("[data-more]");
const pinpad_session_cells = document.querySelectorAll("[data-session-cell]");
console.assert(pinpad_session_cells.length === SESSIONS.length, "one cell per session");

let pinpad_held = 0;
let pinpad_failures = 0;
let pinpad_state = "idle";

for (let i = 0; i < DOTS_VISIBLE; i += 1) {
    const slot = document.createElement("span");
    slot.className = "slot";
    slot.style.setProperty("--i", i);
    pinpad_dots.append(slot);
}

pinpad_session_cells.forEach((cell, i) => {
    cell.querySelector("[data-session-label]").textContent = SESSIONS[i];
});

function pinpad_stage_state() {
    const found = STATES.find((state) => stage.classList.contains(`is-${state}`));
    return found === undefined ? "idle" : found;
}

function dots_render() {
    const holding = pinpad_state === "busy" || pinpad_state === "error" || pinpad_state === "success";
    const text = field_password.value;
    const length = holding ? pinpad_held : text.length;
    const shown = !holding && field_password.type === "text";
    pinpad_dots.querySelectorAll(".slot").forEach((slot, i) => {
        slot.classList.toggle("is-on", i < length);
        slot.classList.toggle("is-caret", !holding && i === length);
        slot.classList.toggle("is-shown", shown && i < length);
        slot.textContent = shown && i < length ? text[i] : "";
    });
    pinpad_more.textContent = length > DOTS_VISIBLE ? `+${length - DOTS_VISIBLE}` : "";
}

function sessions_render() {
    pinpad_session_cells.forEach((cell, i) => {
        cell.classList.toggle("is-selected", i === session_index);
    });
}

function reveal_render() {
    text_set("[data-reveal-label]", field_password.type === "text" ? "Hide" : "Show");
}

function error_text() {
    pinpad_failures += 1;
    let left = TRIES_MAX - pinpad_failures;
    if (left <= 0) {
        pinpad_failures = 1;
        left = TRIES_MAX - 1;
    }
    console.assert(left > 0 && left < TRIES_MAX, left);
    return `Incorrect password · ${left} ${left === 1 ? "try" : "tries"} left`;
}

new MutationObserver((records) => {
    const next = pinpad_stage_state();
    const fresh_error = next === "error" && records.some((record) => !record.oldValue.split(" ").includes("is-error"));
    if (next === pinpad_state && !fresh_error) return;
    if (next === "busy") {
        pinpad_held = field_password.value.length || pinpad_held || DOTS_DEMO;
    } else if (next === "error" || next === "success") {
        if (pinpad_held === 0) pinpad_held = field_password.value.length || DOTS_DEMO;
    } else {
        pinpad_held = 0;
    }
    if (next === "success") pinpad_failures = 0;
    if (fresh_error) message.textContent = error_text();
    pinpad_state = next;
    dots_render();
}).observe(stage, { attributes: true, attributeOldValue: true, attributeFilter: ["class"] });

new MutationObserver(sessions_render).observe(document.querySelector(".corner [data-session-name]"), { childList: true, characterData: true, subtree: true });

document.addEventListener("click", (event) => {
    const cell = event.target.closest("[data-session-cell]");
    if (cell !== null && event.isTrusted) {
        const wanted = Number(cell.dataset.sessionCell);
        session_index = (wanted - 1 + SESSIONS.length) % SESSIONS.length;
    }
}, true);

document.addEventListener("click", (event) => {
    reveal_render();
    dots_render();
    if (event.target.closest(".cell") !== null && !field_password.disabled) field_password.focus();
});

field_password.addEventListener("input", dots_render);

sessions_render();
reveal_render();
dots_render();
</script>
</body>
</html>
