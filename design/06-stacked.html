<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 06 Stacked</title>
<link rel="stylesheet" href="shared/base.css">
<style>
/* 06 Stacked: the hyprlock look. Hours stacked over minutes in heavy type on
   the dark wall, a greeting and small status chips, and hyprlock's single
   rounded input at the bottom whose placeholder turns into the error text. */

.shade {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(90deg, rgba(10, 5, 5, 0.7) 0%, rgba(10, 5, 5, 0) 45%),
        linear-gradient(0deg, rgba(10, 5, 5, 0.75) 0%, rgba(10, 5, 5, 0) 30%);
}

.stack {
    position: absolute;
    left: 120px;
    top: 120px;
    display: flex;
    flex-direction: column;
    font-size: 300px;
    font-weight: 800;
    line-height: 0.82;
    letter-spacing: -10px;
}

.stack .hours { color: var(--parchment); }
.stack .minutes { color: var(--lacquer); }

.greeting {
    position: absolute;
    left: 132px;
    top: 650px;
    font-size: 30px;
    font-weight: 500;
}

.greeting b { font-weight: 700; color: var(--gold); }

.chips {
    position: absolute;
    left: 132px;
    top: 706px;
    display: flex;
    gap: 10px;
}

.chip {
    height: 36px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 15px;
    border-radius: 18px;
    background: rgba(13, 7, 6, 0.62);
    border: 1px solid rgba(242, 232, 216, 0.14);
    font-size: 15px;
    color: rgba(242, 232, 216, 0.82);
    transition: color 150ms, background 150ms, border-color 150ms;
}

.chip i[data-icon] { width: 18px; height: 18px; }
.chip b { font-weight: 600; color: var(--parchment); }
.chip.round { width: 36px; padding: 0; justify-content: center; }
.chip.round i[data-icon] { width: 20px; height: 20px; }

button.chip:hover {
    color: var(--parchment);
    background: rgba(13, 7, 6, 0.85);
    border-color: rgba(242, 232, 216, 0.32);
}

form {
    position: absolute;
    left: 50%;
    bottom: 120px;
    width: 440px;
    margin-left: -220px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.input {
    position: relative;
    width: 100%;
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    border-radius: 30px;
    border: 3px solid rgba(242, 232, 216, 0.25);
    background: rgba(13, 7, 6, 0.75);
    transition: border-color 200ms, background 300ms;
}

.input:focus-within { border-color: var(--gold); }

.input input {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-size: 20px;
    letter-spacing: 6px;
    transition: opacity 150ms;
}

.input input::placeholder { letter-spacing: 0; font-size: 16px; font-style: italic; }
.input input:placeholder-shown { caret-color: transparent; }

.message {
    position: absolute;
    inset: 0;
    padding: 0 24px;
    line-height: 54px;
    text-align: center;
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
    opacity: 0;
    transition: opacity 150ms;
}

.is-busy .input input,
.is-error .input input,
.is-info .input input,
.is-success .input input { opacity: 0; }

.is-busy .message,
.is-error .message,
.is-info .message,
.is-success .message { opacity: 1; }

.is-busy .input { border-color: var(--jade); animation: busy-ring 1200ms ease-out infinite; }
.is-busy .message { color: var(--jade); }
.is-error .input { border-color: var(--danger); animation: shake 360ms ease-in-out; }
.is-error .message { color: var(--danger); }
.is-info .input { border-color: var(--gold); }
.is-info .message { color: var(--gold); }
.is-success .input { border-color: var(--jade); background: var(--jade); }
.is-success .message { color: var(--ink); font-weight: 600; }

@keyframes busy-ring {
    0% { box-shadow: 0 0 0 0 rgba(63, 174, 154, 0.55); }
    100% { box-shadow: 0 0 0 14px rgba(63, 174, 154, 0); }
}

.notes { margin-top: 12px; min-height: 24px; font-size: 14px; }
.capslock { color: var(--gold); }

.chips,
.top-right { transition: opacity 400ms; }

.is-success .chips,
.is-success .top-right { opacity: 0; }

.top-right {
    position: absolute;
    top: 40px;
    right: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
}
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="shade"></div>

    <div class="stack tabular">
        <span class="hours" data-clock="hours"></span>
        <span class="minutes" data-clock="minutes"></span>
    </div>
    <div class="greeting"><span data-clock="greeting"></span>, <b data-user-name></b></div>
    <div class="chips">
        <span class="chip" data-clock="long"></span>
        <span class="chip">seiren</span>
        <button type="button" class="chip" data-action="switch-user"><i data-icon="system-switch-user"></i>Switch user</button>
    </div>

    <form data-login>
        <label class="input">
            <input data-field="password" type="password" placeholder="Password…">
            <span class="message" data-message></span>
        </label>
        <div class="notes">
            <span class="capslock" data-capslock>Caps Lock is on</span>
        </div>
    </form>

    <div class="top-right">
        <button type="button" class="chip" data-action="session">Session <b data-session-name></b></button>
        <button type="button" class="chip round" data-power="suspend" title="Sleep"><i data-icon="system-suspend"></i></button>
        <button type="button" class="chip round" data-power="reboot" title="Restart"><i data-icon="system-reboot"></i></button>
        <button type="button" class="chip round" data-power="shutdown" title="Shut Down"><i data-icon="system-shutdown"></i></button>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
<script>
field_password.addEventListener("input", () => {
    if (stage.classList.contains("is-info")) state_set("idle", "");
});
</script>
</body>
</html>
