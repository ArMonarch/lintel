<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 39 E-Ink</title>
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face {
    font-family: "Literata";
    src: url("assets/fonts/Literata-Regular.ttf") format("truetype");
    font-style: normal;
    font-weight: 400;
}

@font-face {
    font-family: "Literata";
    src: url("assets/fonts/Literata-Italic.ttf") format("truetype");
    font-style: italic;
    font-weight: 400;
}

@font-face {
    font-family: "Literata Display";
    src: url("assets/fonts/Literata72pt-Light.ttf") format("truetype");
    font-style: normal;
    font-weight: 300;
}

.stage {
    --paper: #e8e6e1;
    --ink: #1a1a1a;
    --grey-dark: #4f4e4c;
    --grey: #7a7976;
    --grey-light: #a5a39f;
    --hair: #b9b7b2;
    background: var(--paper);
    color: var(--ink);
    font-family: "Literata", Georgia, serif;
    font-feature-settings: "lnum" 1, "kern" 1;
    -webkit-font-smoothing: auto;
}

.stage *, .stage *::before, .stage *::after { transition: none !important; animation: none !important; }

.sheet, .ghost { position: absolute; inset: 0; }
.ghost { opacity: 0.2; pointer-events: none; }
.ghost > .sheet { pointer-events: none; }
.ghost .caption, .ghost .prompt { visibility: hidden; }

.status, .footer {
    position: absolute;
    left: 144px;
    right: 144px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
}

.status {
    top: 30px;
    height: 46px;
    padding-left: 6px;
    border-bottom: 1px solid var(--ink);
    font-size: 19px;
    letter-spacing: 0.14em;
    font-variant-caps: all-small-caps;
    color: var(--grey-dark);
}

.status .mid { font-style: italic; font-variant-caps: normal; letter-spacing: 0; color: var(--grey); }

.footer {
    top: 1000px;
    height: 56px;
    padding-top: 18px;
    border-top: 1px solid var(--ink);
}

.plate {
    position: absolute;
    left: 1000px;
    top: 164px;
    width: 776px;
    height: 750px;
    padding: 12px;
    border: 1px solid var(--ink);
}

.plate-image {
    width: 100%;
    height: 100%;
    background: var(--paper) var(--wallpaper) center / cover no-repeat;
    filter: url(#eink-dither);
}

.plate-caption {
    position: absolute;
    left: 1000px;
    top: 928px;
    width: 776px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 19px;
    color: var(--grey-dark);
}

.plate-caption .fig { font-variant-caps: all-small-caps; letter-spacing: 0.14em; }
.plate-caption .name { font-style: italic; }

.kicker {
    position: absolute;
    left: 150px;
    top: 150px;
    font-size: 24px;
    letter-spacing: 0.22em;
    font-variant-caps: all-small-caps;
    color: var(--grey-dark);
}

.clock {
    position: absolute;
    left: 132px;
    top: 186px;
    font-family: "Literata Display", "Literata", serif;
    font-weight: 300;
    font-size: 268px;
    line-height: 1;
    letter-spacing: -0.01em;
    font-feature-settings: "lnum" 1, "tnum" 1;
}

.date {
    position: absolute;
    left: 150px;
    top: 478px;
    font-size: 44px;
    font-style: italic;
    color: var(--grey-dark);
}

.ornament {
    position: absolute;
    left: 150px;
    top: 582px;
    display: flex;
    align-items: center;
    gap: 14px;
}

.ornament::before, .ornament::after { content: ""; width: 56px; height: 1px; background: var(--ink); }
.ornament span { width: 7px; height: 7px; background: var(--ink); transform: rotate(45deg); }

.author {
    position: absolute;
    left: 150px;
    top: 604px;
    display: flex;
    align-items: baseline;
    gap: 16px;
}

.author .by { font-size: 26px; font-style: italic; color: var(--grey); }
.author .name { font-size: 54px; letter-spacing: 0.08em; font-variant-caps: all-small-caps; }

form {
    position: absolute;
    left: 150px;
    top: 720px;
    width: 620px;
}

.label-row {
    display: flex;
    align-items: baseline;
    gap: 18px;
    font-size: 21px;
}

.label-row .label { font-style: italic; color: var(--grey-dark); }
.capslock { font-variant-caps: all-small-caps; letter-spacing: 0.12em; color: var(--ink); }

.reveal {
    margin-left: auto;
    font-size: 19px;
    letter-spacing: 0.14em;
    font-variant-caps: all-small-caps;
    color: var(--grey-dark);
}

.reveal i[data-icon] { display: none; }
.reveal .hide-word { display: none; }
form:has(input[type="text"]) .reveal .show-word { display: none; }
form:has(input[type="text"]) .reveal .hide-word { display: inline; }

.field {
    position: relative;
    display: block;
    height: 54px;
    margin-top: 6px;
    border-bottom: 1px solid var(--ink);
}

.field input {
    position: absolute;
    inset: 0;
    width: 100%;
    font-family: "Literata", serif;
    font-size: 30px;
    letter-spacing: 0.06em;
    color: transparent;
    caret-color: transparent;
}

.field input[type="text"] { color: var(--ink); caret-color: var(--ink); }
form:has(input[type="text"]) .dots { display: none; }

.dots {
    position: absolute;
    left: 2px;
    bottom: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    height: 28px;
    pointer-events: none;
}

.dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); }

.dots::after {
    content: "";
    display: none;
    width: 2px;
    height: 30px;
    margin-left: -2px;
    background: var(--ink);
}

.field:focus-within .dots::after { display: block; }

.caption {
    position: absolute;
    left: 150px;
    top: 826px;
    width: 760px;
    min-height: 60px;
    display: flex;
    align-items: center;
    gap: 18px;
}

.caption .wrong {
    display: none;
    padding: 4px 16px 6px;
    background: var(--ink);
    color: var(--paper);
    font-size: 30px;
    font-style: italic;
    white-space: nowrap;
}

.caption .message { font-size: 26px; font-style: italic; color: var(--ink); }
.caption .finger { display: none; flex: none; }
.caption .finger svg { display: block; width: 48px; height: 51px; shape-rendering: crispEdges; }

.captions {
    position: absolute;
    left: 150px;
    top: 922px;
    display: flex;
    gap: 44px;
    font-size: 22px;
}

.captions button { padding: 2px 0; text-underline-offset: 7px; text-decoration-thickness: 1px; }
.captions .key { font-style: italic; color: var(--grey); }

.power {
    display: flex;
    gap: 40px;
    margin-left: 6px;
}

.power button {
    font-size: 21px;
    letter-spacing: 0.16em;
    font-variant-caps: all-small-caps;
    text-underline-offset: 7px;
    text-decoration-thickness: 1px;
}

.power button:hover, .power button:focus-visible,
.captions button:hover, .captions button:focus-visible,
.reveal:hover, .reveal:focus-visible { text-decoration-line: underline; }

.prompt {
    display: flex;
    align-items: baseline;
    gap: 18px;
    font-size: 21px;
    font-style: italic;
    color: var(--grey-dark);
}

.prompt::before { content: ""; width: 120px; height: 1px; align-self: center; background: var(--ink); }

.is-busy > .sheet .dots { display: none; }
.is-busy > .sheet .label { color: var(--grey-light); }
.is-busy > .sheet .reveal { visibility: hidden; }
.is-busy > .sheet .field input[type="text"] { color: transparent; caret-color: transparent; }
.is-busy > .sheet .field { border-bottom-style: dotted; }

.is-error > .sheet .wrong { display: block; }
.is-error > .sheet .caption .message { font-size: 20px; font-style: normal; color: var(--grey-dark); max-width: 560px; line-height: 1.3; }
.is-error > .sheet .field { border-bottom-width: 3px; }

.is-info > .sheet .caption.with-finger .finger { display: block; }

.blackout {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: var(--ink);
    color: var(--paper);
}

.blackout .host { font-size: 22px; letter-spacing: 0.3em; font-variant-caps: all-small-caps; color: var(--grey-light); }
.blackout .ornament { position: static; }
.blackout .ornament::before, .blackout .ornament::after, .blackout .ornament span { background: var(--grey-light); }
.blackout .text { font-size: 46px; font-style: italic; }
.is-success > .blackout { display: flex; }

.flash { position: absolute; inset: 0; display: none; pointer-events: none; }
.flash.invert { display: block; background: #fff; mix-blend-mode: difference; }
.flash.black { display: block; background: var(--ink); }
.flash.white { display: block; background: var(--paper); }

.filters { position: absolute; width: 0; height: 0; }
</style>
</head>
<body>
<div class="stage" data-stage>
    <svg class="filters" aria-hidden="true">
        <filter id="eink-dither" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
            <feColorMatrix type="saturate" values="0" result="grey"/>
            <feComponentTransfer in="grey" result="graded">
                <feFuncR type="gamma" amplitude="1.1" exponent="0.7" offset="0"/>
                <feFuncG type="gamma" amplitude="1.1" exponent="0.7" offset="0"/>
                <feFuncB type="gamma" amplitude="1.1" exponent="0.7" offset="0"/>
            </feComponentTransfer>
            <feImage class="bayer" x="0" y="0" width="8" height="8" result="bayer"/>
            <feTile in="bayer" result="bayer-tiled"/>
            <feComposite in="graded" in2="bayer-tiled" operator="arithmetic" k1="0" k2="1" k3="0.13" k4="-0.065" result="dithered"/>
            <feComponentTransfer in="dithered" class="levels">
                <feFuncR type="discrete"/>
                <feFuncG type="discrete"/>
                <feFuncB type="discrete"/>
            </feComponentTransfer>
        </filter>
    </svg>

    <div class="plate"><div class="plate-image"></div></div>
    <div class="plate-caption"><span class="fig">Plate i</span><span class="name" data-wallpaper-name></span></div>

    <div class="ghost"></div>

    <div class="sheet">
        <div class="status"><span>seiren</span><span class="mid">a greetd edition</span><span>lintel</span></div>

        <div class="kicker" data-clock="greeting"></div>
        <div class="clock" data-clock="time"></div>
        <div class="date" data-clock="long"></div>
        <div class="ornament"><span></span></div>

        <div class="author"><span class="by">by</span><span class="name" data-user-name></span></div>

        <form data-login>
            <div class="label-row">
                <span class="label">Password</span>
                <span class="capslock" data-capslock>Caps Lock is on</span>
                <button type="button" class="reveal" data-action="reveal" title="Show password"><i data-icon="view-visible"></i><span class="show-word">Show</span><span class="hide-word">Hide</span></button>
            </div>
            <label class="field">
                <input data-field="password" type="password" aria-label="Password" autocomplete="off">
                <span class="dots"></span>
            </label>
        </form>

        <div class="caption">
            <span class="finger"></span>
            <span class="wrong">Wrong password</span>
            <span class="message" data-message></span>
        </div>

        <div class="captions">
            <button type="button" data-action="session"><span class="key">Session:</span> <span data-session-name></span></button>
            <button type="button" data-action="switch-user"><span class="key">User:</span> <span data-user-name></span></button>
        </div>

        <div class="footer">
            <div class="power">
                <button type="button" data-power="suspend">Suspend</button>
                <button type="button" data-power="reboot">Restart</button>
                <button type="button" data-power="shutdown">Power off</button>
            </div>
            <div class="prompt">press any key</div>
        </div>
    </div>

    <div class="blackout"><span class="host">seiren</span><div class="ornament"><span></span></div><span class="text"></span></div>
    <div class="flash"></div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
<script>
const EINK_LEVELS = 16;
const EINK_DOTS_MAX = 24;
const EINK_CLOCK_LEFT = { "0": 137, "1": 115, "2": 129 };
const EINK_FLASH = {
    idle: [["invert", 70], ["black", 80]],
    busy: [["invert", 70], ["black", 80]],
    info: [["invert", 70], ["black", 80]],
    error: [["invert", 60], ["black", 50], ["invert", 60]],
    success: [["invert", 70], ["white", 140]],
};
const EINK_BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const EINK_FINGER = [
    "....#######....",
    "..##.......##..",
    ".#...#####...#.",
    "#..##.....##..#",
    "..#...###...#..",
    ".#..##...##..#.",
    ".#.#...#...#.#.",
    "#..#..#.#..#..#",
    "#.#..#...#..#.#",
    "#.#.#..#..#.#.#",
    "..#.#.#.#.#.#.#",
    "#.#.#.#.#.#...#",
    "#...#.#.#.#.#..",
    ".#.#..#.#..#.#.",
    "...#.#..#..#...",
    "..#..#.#..#..#.",
    "....#..#.#.....",
];

const eink_sheet = document.querySelector(".sheet");
const eink_ghost = document.querySelector(".ghost");
const eink_flash = document.querySelector(".flash");
const eink_dots = document.querySelector(".dots");
const eink_prompt = document.querySelector(".prompt");
const eink_caption = document.querySelector(".caption");
const eink_blackout_text = document.querySelector(".blackout .text");
const eink_clock = document.querySelector(".clock");
let eink_state = "idle";
let eink_snapshot = null;
let eink_snapshot_state = "idle";
let eink_timers = [];

function eink_filter_build() {
    const cell = 2;
    let rects = "";
    for (let index = 0; index < EINK_BAYER.length; index += 1) {
        const value = Math.round((EINK_BAYER[index] / EINK_BAYER.length) * 255);
        rects += `<rect x="${(index % 4) * cell}" y="${Math.floor(index / 4) * cell}" width="${cell}" height="${cell}" fill="rgb(${value},${value},${value})"/>`;
    }
    const tile = `<svg xmlns="http://www.w3.org/2000/svg" width="${cell * 4}" height="${cell * 4}" shape-rendering="crispEdges">${rects}</svg>`;
    document.querySelector("#eink-dither .bayer").setAttribute("href", `data:image/svg+xml,${encodeURIComponent(tile)}`);
    const ink = [0x1a, 0x1a, 0x1a];
    const paper = [0xe8, 0xe6, 0xe1];
    const funcs = document.querySelectorAll("#eink-dither .levels > *");
    console.assert(funcs.length === 3);
    funcs.forEach((func, channel) => {
        const values = [];
        for (let level = 0; level < EINK_LEVELS; level += 1) {
            const value = ink[channel] + ((paper[channel] - ink[channel]) * level) / (EINK_LEVELS - 1);
            values.push((value / 255).toFixed(4));
        }
        func.setAttribute("tableValues", values.join(" "));
    });
}

function eink_finger_build() {
    const width = EINK_FINGER[0].length;
    let rects = "";
    EINK_FINGER.forEach((row, y) => {
        console.assert(row.length === width, row);
        for (let x = 0; x < width; x += 1) {
            if (row[x] === "#") rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
        }
    });
    document.querySelector(".caption .finger").innerHTML =
        `<svg viewBox="0 0 ${width} ${EINK_FINGER.length}" fill="currentColor">${rects}</svg>`;
}

function eink_clock_align() {
    const first = eink_clock.textContent[0];
    console.assert(first in EINK_CLOCK_LEFT, first);
    eink_clock.style.left = `${EINK_CLOCK_LEFT[first]}px`;
}

function eink_state_current() {
    const state = STATES.find((each) => stage.classList.contains(`is-${each}`));
    return state === undefined ? "idle" : state;
}

function eink_render() {
    const count = Math.min(field_password.value.length, EINK_DOTS_MAX);
    console.assert(count >= 0 && count <= EINK_DOTS_MAX);
    while (eink_dots.children.length > count) eink_dots.lastElementChild.remove();
    while (eink_dots.children.length < count) eink_dots.append(document.createElement("span"));
    const state = eink_state_current();
    let prompt = "press any key";
    if (state === "busy") prompt = "please wait";
    else if (state === "success") prompt = "";
    else if (state === "error") prompt = "press any key to try again";
    else if (count > 0) prompt = "press Enter to sign in";
    eink_prompt.textContent = prompt;
    eink_prompt.hidden = prompt === "";
    const text = message.textContent;
    eink_caption.classList.toggle("with-finger", /finger|touch|reader/i.test(text));
    eink_blackout_text.textContent = state === "success" ? text : "";
}

function eink_capture() {
    const copy = eink_sheet.cloneNode(true);
    for (const node of copy.querySelectorAll("input, i[data-icon]")) node.remove();
    for (const node of [copy, ...copy.querySelectorAll("*")]) {
        for (const name of node.getAttributeNames()) {
            if (name.startsWith("data-") || name === "id") node.removeAttribute(name);
        }
    }
    copy.inert = true;
    copy.setAttribute("aria-hidden", "true");
    eink_snapshot = copy;
    eink_snapshot_state = eink_state_current();
}

function eink_ghost_show(visible) {
    if (!visible || eink_snapshot === null) {
        eink_ghost.className = "ghost";
        eink_ghost.replaceChildren();
        return;
    }
    eink_ghost.className = `ghost is-${eink_snapshot_state}`;
    eink_ghost.replaceChildren(eink_snapshot);
    eink_snapshot = null;
}

function eink_refresh(state) {
    console.assert(state in EINK_FLASH, state);
    for (const timer of eink_timers) clearTimeout(timer);
    eink_timers = [];
    eink_render();
    eink_ghost_show(state === "busy");
    const phases = EINK_FLASH[state];
    let at = 0;
    eink_flash.className = `flash ${phases[0][0]}`;
    phases.forEach(([phase, duration], index) => {
        at += duration;
        const next = index + 1 < phases.length ? `flash ${phases[index + 1][0]}` : "flash";
        eink_timers.push(setTimeout(() => {
            eink_flash.className = next;
            if (next === "flash") eink_capture();
        }, at));
    });
}

function eink_on_class(records) {
    if (records.length === 0) return;
    const state = eink_state_current();
    if (state === eink_state && state !== "error") return;
    eink_state = state;
    eink_refresh(state);
}

function eink_on_change() {
    eink_render();
    setTimeout(eink_capture, 0);
}

eink_filter_build();
eink_finger_build();
eink_clock_align();
eink_render();
eink_capture();
new MutationObserver(eink_on_class).observe(stage, { attributes: true, attributeFilter: ["class"] });
new MutationObserver(eink_clock_align).observe(eink_clock, { childList: true, characterData: true, subtree: true });
field_password.addEventListener("input", eink_on_change);
document.addEventListener("click", eink_on_change);
document.addEventListener("keydown", () => setTimeout(eink_on_change, 0));
</script>
</body>
</html>
