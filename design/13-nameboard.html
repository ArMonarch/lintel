<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 13 Nameboard</title>
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face {
    font-family: "Lexend Exa";
    src: url("assets/fonts/LexendExa-Variable.ttf") format("truetype");
    font-weight: 100 900;
}

.stage {
    --wall: #2b2b2b;
    --board: #f4f4f2;
    --frame: #1c1c1c;
    --ink: #1a1a1a;
    --grey: #6e6e6a;
    --pale: #a4a49f;
    --line: #00a95c;
    --error: #c8161e;
    --amber: #e0a100;
    --wide: "Lexend Exa", "Adwaita Sans", sans-serif;
    --kana: "Noto Sans CJK JP", sans-serif;
    background:
        linear-gradient(180deg, rgba(34, 34, 34, 0.76), rgba(22, 22, 22, 0.9)),
        var(--wallpaper-blur) center / cover no-repeat,
        var(--wall);
    font-family: var(--wide);
    color: var(--board);
}

.wall {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse 980px 420px at 50% 210px, rgba(255, 250, 236, 0.09), transparent 70%),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 120px),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 240px);
    pointer-events: none;
}

.lamp {
    position: absolute;
    left: 50%;
    top: 0;
    width: 900px;
    height: 14px;
    margin-left: -450px;
    border-radius: 0 0 6px 6px;
    background: linear-gradient(180deg, #3a3a38, #fffdf4 70%, #e9e6da);
    box-shadow: 0 6px 60px rgba(255, 250, 230, 0.35);
}

.platform-clock {
    position: absolute;
    left: 64px;
    top: 64px;
    display: flex;
    align-items: center;
    gap: 22px;
}

.dial {
    width: 92px;
    height: 92px;
    flex: none;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
}

.readout { display: flex; flex-direction: column; gap: 6px; }
.readout .time { font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: 0.02em; font-feature-settings: "tnum" 1; }
.readout .date { display: flex; gap: 12px; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: #a5a5a0; }
.readout .date span:last-child { font-family: var(--kana); letter-spacing: 0.1em; }

.track {
    position: absolute;
    left: 160px;
    top: 246px;
    width: 1600px;
    height: 600px;
}

.board {
    position: absolute;
    inset: 0;
    border: 7px solid var(--frame);
    border-radius: 5px;
    background: linear-gradient(180deg, #fbfbf9 0%, var(--board) 40%, #ebebe7 100%);
    color: var(--ink);
    box-shadow:
        0 0 0 1px #3b3b39,
        0 40px 90px rgba(0, 0, 0, 0.55),
        0 0 160px rgba(255, 252, 238, 0.07);
    transition: transform 760ms cubic-bezier(0.7, 0, 0.25, 1);
}

.board::before,
.board::after {
    content: "";
    position: absolute;
    top: -260px;
    width: 8px;
    height: 253px;
    background: linear-gradient(90deg, #121212, #3c3c3a 50%, #161616);
}

.board::before { left: 300px; }
.board::after { right: 300px; }

.corner {
    position: absolute;
    top: 30px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 17px;
    letter-spacing: 0.08em;
    color: var(--grey);
}

.corner.left { left: 38px; padding: 6px 10px 6px 6px; margin: -6px 0 0 -6px; border-radius: 6px; }
.corner.left:hover { background: rgba(0, 0, 0, 0.05); }
.corner.right { right: 38px; }
.corner b { font-weight: 600; color: var(--ink); }
.corner .jp { font-family: var(--kana); font-size: 15px; letter-spacing: 0.12em; }

.swatch {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    background: var(--line);
    transition: background 400ms;
}

.station {
    position: absolute;
    left: 0;
    right: 0;
    top: 64px;
    display: flex;
    justify-content: center;
}

.name-line {
    position: relative;
    height: 164px;
    display: flex;
    align-items: center;
}

.board.next .name-line { height: 180px; }

.code {
    position: absolute;
    right: calc(100% + 52px);
    top: 50%;
    width: 132px;
    height: 132px;
    margin-top: -60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 9px solid var(--line);
    border-radius: 16px;
    background: #fff;
    color: var(--ink);
    line-height: 1;
    transition: border-color 400ms;
}

.code .letters { font-size: 26px; font-weight: 700; letter-spacing: 0.06em; }
.code .number { margin-top: 4px; font-size: 50px; font-weight: 700; font-feature-settings: "tnum" 1; }

.name-block {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.kana {
    height: 40px;
    font-family: var(--kana);
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 0.42em;
    margin-right: -0.42em;
    color: #3d3d3b;
}

.display {
    font-size: 154px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.01em;
    white-space: nowrap;
}

.field {
    position: relative;
    width: 640px;
    height: 58px;
    margin-top: 14px;
    display: flex;
    align-items: center;
}

.field::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: var(--line);
    transition: background 300ms, height 200ms;
}

.field::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 12px;
    border: 2px solid var(--line);
    border-top: none;
    border-bottom: none;
    transition: border-color 300ms;
}

.field:focus-within::before { height: 3px; }

.field input {
    width: 100%;
    height: 100%;
    padding: 0 48px;
    text-align: center;
    font-family: var(--wide);
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.32em;
    color: var(--ink);
    caret-color: var(--line);
}

.field input::placeholder {
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.3em;
    color: var(--pale);
    opacity: 1;
}

.reveal {
    position: absolute;
    right: 8px;
    top: 50%;
    margin-top: -18px;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    color: #85857f;
}

.reveal i[data-icon] { width: 24px; height: 24px; }
.reveal:hover { color: var(--ink); background: rgba(0, 0, 0, 0.05); }

.capslock {
    position: absolute;
    left: 100%;
    margin-left: 18px;
    bottom: 12px;
    padding: 4px 9px;
    border-radius: 4px;
    background: var(--amber);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    white-space: nowrap;
}

.status {
    position: relative;
    height: 36px;
    margin-top: 16px;
    width: 100%;
    text-align: center;
}

.status > * {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
    transition: opacity 200ms;
}

.romaji {
    font-size: 21px;
    font-weight: 500;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--grey);
}

.message {
    opacity: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--error);
}

.message::before {
    content: "×";
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border-radius: 4px;
    background: var(--error);
    color: #fff;
    font-size: 22px;
    line-height: 1;
}

.band {
    position: absolute;
    left: 0;
    right: 0;
    top: 432px;
    height: 62px;
    background: var(--line);
    overflow: hidden;
    transition: background 400ms;
}

.band .arrow {
    position: absolute;
    top: 11px;
    width: 92px;
    height: 40px;
    color: #fff;
}

.band .arrow.left { left: 30px; }
.band .arrow.right { right: 30px; transform: scaleX(-1); }

.notch {
    position: absolute;
    left: 50%;
    top: 0;
    margin-left: -24px;
    width: 0;
    height: 0;
    border-left: 24px solid transparent;
    border-right: 24px solid transparent;
    border-top: 22px solid #f2f2ef;
}

.trail {
    position: absolute;
    left: 6%;
    top: 0;
    bottom: 0;
    width: 320px;
    margin-left: -344px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.34));
    opacity: 0;
}

.band-text {
    position: absolute;
    left: 160px;
    right: 160px;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #fff;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.08em;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 260ms, transform 260ms;
}

.band-text::before {
    content: "i";
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border: 2px solid #fff;
    border-radius: 50%;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0;
}

.neighbours {
    position: absolute;
    left: 0;
    right: 0;
    top: 494px;
    bottom: 0;
}

.neighbour {
    position: absolute;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    padding: 0 48px;
    color: var(--ink);
    border-radius: 4px;
}

.neighbour.prev { left: 0; align-items: flex-start; }
.neighbour.next { right: 0; align-items: flex-end; }
button.neighbour:hover { background: rgba(0, 0, 0, 0.04); }
button.neighbour:disabled { cursor: default; background: none; }

.neighbour .n-kana { font-family: var(--kana); font-size: 16px; letter-spacing: 0.3em; color: var(--grey); }
.neighbour .n-row { display: flex; align-items: center; gap: 16px; }
.neighbour .n-name { font-size: 36px; font-weight: 600; line-height: 1; }

.chip {
    display: inline-flex;
    align-items: center;
    height: 30px;
    padding: 0 7px;
    border: 3px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    font-feature-settings: "tnum" 1;
    background: #fff;
    transition: border-color 400ms;
}

.neighbour.terminus .n-name { color: var(--pale); }
.neighbour.terminus .chip { border-color: var(--pale); color: var(--grey); }

.board.next { transform: translateX(2000px); visibility: hidden; transition: transform 760ms cubic-bezier(0.7, 0, 0.25, 1), visibility 0s 900ms; }
.board.next .display { font-size: 168px; }
.board.next .rule { width: 640px; height: 3px; margin-top: 30px; background: var(--line); }
.board.next .status .romaji { color: var(--ink); letter-spacing: 0.2em; }

.power {
    position: absolute;
    right: 64px;
    bottom: 56px;
    display: flex;
    gap: 4px;
    padding: 8px;
    border-radius: 10px;
    background: #141414;
    border: 1px solid #3a3a38;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
}

.power button {
    min-width: 92px;
    height: 84px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 9px;
    border-radius: 6px;
    color: #cfcfca;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    white-space: nowrap;
}

.power button:hover { background: #262624; color: #fff; }
.power i[data-icon] { width: 30px; height: 30px; }

.tactile {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 18px;
    background:
        radial-gradient(circle at 9px 9px, rgba(0, 0, 0, 0.28) 0 3px, transparent 3.5px) 0 0 / 18px 18px,
        #b8961f;
    opacity: 0.55;
}

.is-busy .board.main .notch,
.is-busy .board.main .trail { animation: notch-run 1400ms cubic-bezier(0.45, 0, 0.55, 1) infinite; }
.is-busy .board.main .field::before { background: var(--pale); }
.is-busy .board.main .field::after { border-color: var(--pale); }
.is-busy .board.main .romaji { opacity: 0; }
.is-busy .board.main .message {
    opacity: 1;
    gap: 12px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--grey);
}

.is-busy .board.main .message::before {
    content: "";
    width: 16px;
    height: 16px;
    border: 3px solid var(--pale);
    border-top-color: var(--grey);
    border-radius: 50%;
    background: none;
    animation: spin 900ms linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes notch-run {
    0% { left: 6%; opacity: 0; }
    12% { opacity: 1; }
    88% { opacity: 1; }
    100% { left: 94%; opacity: 0; }
}

.is-error .board.main .band {
    background:
        repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.16) 0 14px, transparent 14px 28px),
        var(--error);
    animation: band-flash 900ms steps(1, end);
}

.is-error .board.main .field::before { background: var(--error); }
.is-error .board.main .field::after { border-color: var(--error); }
.is-error .board.main .romaji { opacity: 0; }
.is-error .board.main .message { opacity: 1; }
.is-error .board.main .notch { border-top-color: #fff; }

@keyframes band-flash {
    0% { background: var(--error); }
    16% { background: var(--frame); }
    33% { background: var(--error); }
    50% { background: var(--frame); }
    66% { background: var(--error); }
}

.is-info .board.main .band-text { opacity: 1; transform: none; }
.is-info .board.main .notch { opacity: 0; }

.is-success .board.main { transform: translateX(-2000px); }
.is-success .board.next { transform: none; visibility: visible; transition: transform 760ms cubic-bezier(0.7, 0, 0.25, 1) 140ms, visibility 0s; }
.is-success .board.next .notch,
.is-success .board.next .trail { animation: notch-run 1400ms cubic-bezier(0.45, 0, 0.55, 1) 900ms infinite; }
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="wall"></div>
    <div class="lamp"></div>

    <div class="platform-clock">
        <svg class="dial" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="48" fill="#141414"/>
            <circle cx="50" cy="50" r="43" fill="#f4f4f2"/>
            <g class="ticks" stroke="#1a1a1a" stroke-linecap="butt"></g>
            <line class="hand-hour" x1="50" y1="56" x2="50" y2="27" stroke="#1a1a1a" stroke-width="4.4" stroke-linecap="round"/>
            <line class="hand-minute" x1="50" y1="58" x2="50" y2="15" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
            <line class="hand-second" x1="50" y1="62" x2="50" y2="13" stroke="#d81e1e" stroke-width="1.4"/>
            <circle cx="50" cy="50" r="2.6" fill="#d81e1e"/>
        </svg>
        <div class="readout">
            <div class="time" data-clock="time"></div>
            <div class="date"><span data-clock="short"></span><span data-clock="cjk-weekday"></span></div>
        </div>
    </div>

    <div class="track">
        <form class="board main" data-login>
            <button type="button" class="corner left" data-action="session" title="Change session">
                <span class="swatch"></span><b><span data-session-name></span> Line</b><span class="jp line-kana"></span>
            </button>
            <div class="corner right">
                <span class="jp">セイレン</span><span>seiren</span>
            </div>

            <div class="station">
                <div class="name-block">
                    <div class="kana user-kana"></div>
                    <div class="name-line">
                        <button type="button" class="code" data-action="session" title="Change session">
                            <span class="letters line-code"></span>
                            <span class="number user-number"></span>
                        </button>
                        <div class="display user-display"></div>
                    </div>
                    <label class="field">
                        <input data-field="password" type="password" placeholder="PASSWORD · パスワード" aria-label="Password" maxlength="128">
                        <button type="button" class="reveal" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
                        <span class="capslock" data-capslock>CAPS LOCK</span>
                    </label>
                    <div class="status">
                        <span class="romaji" data-user-name></span>
                        <span class="message" data-message></span>
                    </div>
                </div>
            </div>

            <div class="band">
                <svg class="arrow left prev-arrow" viewBox="0 0 92 40" aria-hidden="true"><path d="M2 20 L26 4 V14 H90 V26 H26 V36 Z" fill="currentColor"/></svg>
                <svg class="arrow right next-arrow" viewBox="0 0 92 40" aria-hidden="true"><path d="M2 20 L26 4 V14 H90 V26 H26 V36 Z" fill="currentColor"/></svg>
                <span class="trail"></span>
                <span class="notch"></span>
                <span class="band-text"></span>
            </div>

            <div class="neighbours">
                <button type="button" class="neighbour prev">
                    <span class="n-kana"></span>
                    <span class="n-row"><span class="chip"></span><span class="n-name"></span></span>
                </button>
                <button type="button" class="neighbour next" data-action="switch-user" title="Switch user">
                    <span class="n-kana"></span>
                    <span class="n-row"><span class="n-name"></span><span class="chip"></span></span>
                </button>
            </div>
        </form>

        <div class="board next" aria-hidden="true">
            <div class="corner left">
                <span class="swatch"></span><b><span data-session-name></span> Line</b><span class="jp line-kana"></span>
            </div>
            <div class="corner right">
                <span class="jp">セイレン</span><span>seiren</span>
            </div>
            <div class="station">
                <div class="name-block">
                    <div class="kana line-kana"></div>
                    <div class="name-line">
                        <div class="code">
                            <span class="letters line-code"></span>
                            <span class="number terminus-number"></span>
                        </div>
                        <div class="display" data-session-name></div>
                    </div>
                    <div class="rule"></div>
                    <div class="status"><span class="romaji band-mirror"></span></div>
                </div>
            </div>
            <div class="band">
                <svg class="arrow left" viewBox="0 0 92 40" aria-hidden="true"><path d="M2 20 L26 4 V14 H90 V26 H26 V36 Z" fill="currentColor"/></svg>
                <span class="trail"></span>
                <span class="notch"></span>
            </div>
            <div class="neighbours">
                <div class="neighbour prev">
                    <span class="n-kana user-kana"></span>
                    <span class="n-row"><span class="chip from-chip"></span><span class="n-name user-display"></span></span>
                </div>
                <div class="neighbour next terminus">
                    <span class="n-kana">シュウテン</span>
                    <span class="n-row"><span class="n-name">Terminus</span><span class="chip">END</span></span>
                </div>
            </div>
        </div>
    </div>

    <div class="power">
        <button data-power="suspend" title="Sleep"><i data-icon="system-suspend"></i>Sleep</button>
        <button data-power="reboot" title="Restart"><i data-icon="system-reboot"></i>Restart</button>
        <button data-power="shutdown" title="Power off"><i data-icon="system-shutdown"></i>Power off</button>
    </div>

    <div class="tactile"></div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
<script>
const LINES = {
    "niri": { code: "NI", color: "#00a95c", kana: "ニリ" },
    "Plasma (Wayland)": { code: "PL", color: "#0072bc", kana: "プラズマ" },
    "Shell": { code: "SH", color: "#e8402a", kana: "シェル" },
};
const PEOPLE = {
    frenzfries: { display: "Frenzfries", kana: "フレンズフライズ" },
    guest: { display: "Guest", kana: "ゲスト" },
};
const HOST = { name: "seiren", display: "Seiren", kana: "セイレン" };
const DIAL_TICKS = 60;
const DISPLAY_WIDTH_MAX = 1080;

const board_main = document.querySelector(".board.main");
const neighbour_prev = board_main.querySelector(".neighbour.prev");
const neighbour_next = board_main.querySelector(".neighbour.next");
const band_text = board_main.querySelector(".band-text");

function line_current() {
    const line = LINES[SESSIONS[session_index]];
    console.assert(line !== undefined, `no line for session ${SESSIONS[session_index]}`);
    return line;
}

function person(name) {
    if (name === HOST.name) return HOST;
    const known = PEOPLE[name];
    if (known !== undefined) return known;
    return { display: name[0].toUpperCase() + name.slice(1), kana: "" };
}

function station_code(index) {
    console.assert(index >= 0 && index < 100, index);
    return `${line_current().code} ${String(index).padStart(2, "0")}`;
}

function neighbour_fill(node, name, index, terminus) {
    const who = terminus ? { display: "Terminus", kana: "シュウテン" } : person(name);
    node.querySelector(".n-kana").textContent = who.kana;
    node.querySelector(".n-name").textContent = who.display;
    node.querySelector(".chip").textContent = terminus ? "END" : station_code(index);
    node.classList.toggle("terminus", terminus);
}

function board_refresh() {
    const line = line_current();
    const name = USERS[user_index];
    const who = person(name);
    stage.style.setProperty("--line", line.color);
    text_set(".line-code", line.code);
    text_set(".line-kana", line.kana);
    text_set(".user-number", String(user_index + 1).padStart(2, "0"));
    text_set(".user-kana", who.kana);
    text_set(".user-display", who.display);
    text_set(".from-chip", station_code(user_index + 1));
    text_set(".terminus-number", String(USERS.length + 1).padStart(2, "0"));

    const stations = [HOST.name, ...USERS];
    const here = user_index + 1;
    const prev_is_host = here - 1 === 0;
    neighbour_fill(neighbour_prev, stations[here - 1], here - 1, false);
    neighbour_prev.disabled = prev_is_host;
    neighbour_prev.classList.toggle("terminus", prev_is_host);
    const at_end = here + 1 >= stations.length;
    neighbour_fill(neighbour_next, stations[here + 1], here + 1, at_end);
    neighbour_next.title = at_end ? `Back to ${USERS[0]}` : "Switch user";
    display_fit();
}

function display_fit() {
    for (const node of document.querySelectorAll(".display")) {
        node.style.fontSize = "";
        const width = node.offsetWidth;
        if (width <= DISPLAY_WIDTH_MAX) continue;
        const size = parseFloat(getComputedStyle(node).fontSize);
        node.style.fontSize = `${Math.floor(size * DISPLAY_WIDTH_MAX / width)}px`;
    }
}

function user_previous() {
    console.assert(USERS.length > 1);
    for (let step = 0; step < USERS.length - 1; step += 1) user_next();
}

function dial_build() {
    const ticks = document.querySelector(".dial .ticks");
    let markup = "";
    for (let tick = 0; tick < DIAL_TICKS; tick += 1) {
        const hour = tick % 5 === 0;
        const length = hour ? 7 : 2.6;
        markup += `<line x1="50" y1="9" x2="50" y2="${9 + length}" stroke-width="${hour ? 2.6 : 1}" transform="rotate(${tick * 6} 50 50)"/>`;
    }
    ticks.innerHTML = markup;
}

function dial_tick() {
    const now = new Date();
    const seconds = now.getSeconds();
    const minutes = now.getMinutes() + seconds / 60;
    const hours = (now.getHours() % 12) + minutes / 60;
    document.querySelector(".hand-hour").setAttribute("transform", `rotate(${hours * 30} 50 50)`);
    document.querySelector(".hand-minute").setAttribute("transform", `rotate(${minutes * 6} 50 50)`);
    document.querySelector(".hand-second").setAttribute("transform", `rotate(${seconds * 6} 50 50)`);
}

function message_mirror() {
    const text = message.textContent;
    band_text.textContent = text;
    if (text.length > 0) text_set(".band-mirror", text);
}

document.addEventListener("click", (event) => {
    if (event.target.closest('[data-action="session"], [data-action="switch-user"]') !== null) board_refresh();
});
neighbour_prev.addEventListener("click", () => {
    if (neighbour_prev.disabled) return;
    user_previous();
    board_refresh();
});
new MutationObserver(message_mirror).observe(message, { childList: true, characterData: true, subtree: true });

dial_build();
dial_tick();
setInterval(dial_tick, 1000);
board_refresh();
message_mirror();
document.fonts.ready.then(display_fit);
</script>
</body>
</html>
