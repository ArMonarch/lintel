<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 04 Plasma</title>
<link rel="stylesheet" href="shared/base.css?v=20261122c">
<style>
/* 04 Plasma: the Plasma lock screen's centred layout and its big labelled
   action buttons. The wallpaper is pre-blurred and dimmed (a second image,
   since GTK has no backdrop blur), and sharpens after a successful login. */

.stage { background-image: var(--wallpaper-blur, url("assets/wallpapers/qi-blur.jpg")); }

.sharp {
    position: absolute;
    inset: 0;
    background: var(--wallpaper, url("assets/wallpapers/qi.jpg")) center / cover no-repeat;
    opacity: 0;
    transition: opacity 600ms;
}

.dim {
    position: absolute;
    inset: 0;
    background: rgba(10, 6, 6, 0.45);
    transition: opacity 600ms;
}

.is-success .sharp { opacity: 1; }
.is-success .dim { opacity: 0; }

.center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
}

.clock {
    margin-top: 150px;
    font-size: 104px;
    font-weight: 300;
    line-height: 1;
    color: #fff;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
    transition: opacity 500ms 300ms;
}

.date {
    margin-top: 10px;
    font-size: 24px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.85);
    transition: opacity 500ms 300ms;
}

form {
    margin-top: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.avatar, .name, .entry { transition: opacity 400ms; }

.avatar {
    width: 112px;
    height: 112px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.85);
    background: linear-gradient(135deg, var(--lacquer), var(--lacquer-deep));
    font-size: 48px;
    font-weight: 600;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
}

.name {
    margin-top: 16px;
    font-size: 24px;
    font-weight: 500;
    color: #fff;
}

.entry {
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.field {
    width: 340px;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px 0 14px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    text-shadow: none;
    transition: border-color 150ms, background 150ms;
}

.field:focus-within {
    border-color: #3daee9;
    background: rgba(255, 255, 255, 0.16);
}

.field input { flex: 1; min-width: 0; font-size: 16px; letter-spacing: 2px; color: #fff; }
.field input::placeholder { letter-spacing: 0; }

.reveal { display: inline-flex; color: rgba(255, 255, 255, 0.65); }
.reveal:hover { color: #fff; }

.go {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    color: #fff;
}

.go:hover { background: rgba(255, 255, 255, 0.22); }

.spinner {
    display: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2.5px solid rgba(255, 255, 255, 0.25);
    border-top-color: #fff;
    animation: spin 800ms linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.notes {
    margin-top: 14px;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.92);
}

.message {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(12, 8, 8, 0.48);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    text-shadow: none;
}

.message:empty { display: none; }
.capslock { color: var(--gold); }

.is-busy .field { border-color: #3daee9; }
.is-busy .go i[data-icon] { display: none; }
.is-busy .spinner { display: block; }

.is-error .entry { animation: shake 360ms ease-in-out; }
.is-error .field { border-color: var(--danger); }
.is-error .message { color: var(--danger); border-color: rgba(255, 122, 107, 0.55); }

.is-info .field { border-color: #3daee9; }
.is-info .message { color: #9ad9f5; border-color: rgba(61, 174, 233, 0.55); }

.is-success .message {
    padding: 10px 22px;
    font-size: 18px;
    color: #fff;
    border-color: rgba(39, 174, 96, 0.6);
    transition: font-size 400ms, padding 400ms;
}
.is-success .avatar, .is-success .name, .is-success .entry { opacity: 0; }
.is-success .clock, .is-success .date,
.is-success .actions, .is-success .session, .is-success .user-switch { opacity: 0; }

.actions {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 64px;
    display: flex;
    justify-content: center;
    gap: 20px;
    transition: opacity 400ms;
}

.actions button {
    width: 112px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
}

.actions button:hover { color: #fff; }

.actions .ring {
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    transition: background 150ms;
}

.actions button:hover .ring { background: rgba(255, 255, 255, 0.16); }
.actions i[data-icon] { width: 32px; height: 32px; }

.session {
    position: absolute;
    left: 48px;
    bottom: 48px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
    transition: opacity 400ms, background 150ms;
}

.session:hover { background: rgba(255, 255, 255, 0.12); }
.session b { color: #fff; font-weight: 600; }

.user-switch {
    position: absolute;
    right: 48px;
    bottom: 48px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
    transition: opacity 400ms, background 150ms;
}

.user-switch:hover { background: rgba(255, 255, 255, 0.12); }
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="sharp"></div>
    <div class="dim"></div>

    <div class="center">
        <div class="clock tabular" data-clock="time"></div>
        <div class="date" data-clock="long"></div>

        <form data-login>
            <div class="avatar" data-user-initial></div>
            <div class="name" data-user-name></div>
            <div class="entry">
                <label class="field">
                    <input data-field="password" type="password" placeholder="Password">
                    <button type="button" class="reveal" data-action="reveal" title="Show password">
                        <i data-icon="view-visible"></i>
                    </button>
                </label>
                <button class="go" type="submit" title="Log in"><i data-icon="go-next"></i><span class="spinner"></span></button>
            </div>
            <div class="notes">
                <span class="message" data-message></span>
                <span class="capslock" data-capslock>Caps Lock is on</span>
            </div>
        </form>
    </div>

    <div class="actions">
        <button data-power="suspend"><span class="ring"><i data-icon="system-suspend"></i></span>Sleep</button>
        <button data-power="reboot"><span class="ring"><i data-icon="system-reboot"></i></span>Restart</button>
        <button data-power="shutdown"><span class="ring"><i data-icon="system-shutdown"></i></span>Shut Down</button>
    </div>

    <button class="session" data-action="session">Session:&nbsp;<b data-session-name></b></button>
    <button class="user-switch" data-action="switch-user"><i data-icon="system-switch-user"></i>Other user</button>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js?v=20261122c"></script>

</body>
</html>
