<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 11 Paper</title>
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face {
    font-family: "EB Garamond";
    src: url("assets/fonts/EBGaramond12-Regular.otf") format("opentype");
    font-style: normal;
}

@font-face {
    font-family: "EB Garamond";
    src: url("assets/fonts/EBGaramond12-Italic.otf") format("opentype");
    font-style: italic;
}

.stage {
    --paper: #eeeae1;
    --ink: #1d1c1a;
    --muted: #7d7669;
    --rule: #c8c0b1;
    --red: #c0402b;
    --red-pale: #e0a99e;
    --ochre: #8f6116;
    --cover-text: #eeeae1;
    background: var(--paper);
    color: var(--ink);
    font-family: "EB Garamond", Georgia, serif;
    font-feature-settings: "lnum" 1;
    transition: background 500ms, color 500ms;
}

.stage.is-ink {
    --paper: #171619;
    --ink: #eeeae1;
    --muted: #8d867c;
    --rule: #3a3636;
    --red: #d4553e;
    --red-pale: #7a3a30;
    --ochre: #d0a050;
    --cover-text: #171619;
}

.cover {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 652px;
    background: var(--red);
    color: var(--cover-text);
    z-index: 1;
    transition: width 700ms cubic-bezier(0.7, 0, 0.2, 1), background 500ms, color 500ms;
}

.verse {
    position: absolute;
    left: 80px;
    top: 94px;
    writing-mode: vertical-rl;
    font-size: 50px;
    line-height: 1;
    white-space: nowrap;
}

.number {
    position: absolute;
    left: 88px;
    bottom: 68px;
    font-size: 24px;
}

.year {
    position: absolute;
    right: 64px;
    bottom: 68px;
    font-size: 24px;
    letter-spacing: 1px;
}

.mark {
    position: absolute;
    width: 28px;
    height: 28px;
    border-color: var(--muted);
    border-style: solid;
    border-width: 0;
    transition: border-color 500ms;
}

.mark.top { left: 732px; top: 96px; border-left-width: 1px; border-top-width: 1px; }
.mark.bottom { right: 72px; bottom: 132px; border-right-width: 1px; border-bottom-width: 1px; }

.clock {
    position: absolute;
    left: 836px;
    top: 300px;
    display: flex;
    align-items: center;
    font-size: 212px;
    line-height: 1;
    font-feature-settings: "lnum" 1, "tnum" 1;
}

.colon {
    display: flex;
    flex-direction: column;
    gap: 30px;
    margin: 12px 26px 0;
}

.colon::before,
.colon::after {
    content: "";
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--red-pale);
    transition: background 500ms;
}

.date {
    position: absolute;
    left: 842px;
    top: 584px;
    font-size: 40px;
}

form {
    position: absolute;
    left: 842px;
    top: 690px;
    width: 460px;
}

.who {
    display: flex;
    align-items: baseline;
    gap: 14px;
    font-size: 22px;
    color: var(--muted);
    transition: opacity 400ms, color 500ms;
}

.field {
    position: relative;
    display: block;
    margin-top: 10px;
    border-bottom: 1.5px solid var(--ink);
    transition: border-color 150ms, opacity 400ms;
}

.field input {
    width: 100%;
    height: 60px;
    font-family: inherit;
    font-size: 30px;
    letter-spacing: 6px;
    caret-color: var(--red);
}

.field::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -1.5px;
    width: 0;
    height: 1.5px;
    background: var(--red);
}

.notes {
    min-height: 64px;
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 22px;
    font-style: italic;
}

.message { color: var(--muted); transition: color 200ms; }
.capslock { color: var(--ochre); transition: color 500ms; }

.is-error .field { border-color: var(--red); animation: shake 360ms ease-in-out; }
.is-error .message { color: var(--red); }
.is-info .message { color: var(--ochre); }
.is-busy .field::after { animation: rule-sweep 1400ms cubic-bezier(0.65, 0, 0.35, 1) infinite; }
.is-success .cover { width: 1920px; }
.is-success form { z-index: 2; }
.is-success .who,
.is-success .field { opacity: 0; }
.is-success .message { color: var(--cover-text); }

@keyframes rule-sweep {
    0% { left: 0; width: 0; }
    50% { left: 0; width: 100%; }
    100% { left: 100%; width: 0; }
}

.bracket {
    position: relative;
    padding: 2px 6px;
    color: var(--muted);
    transition: color 500ms;
}

.bracket::before,
.bracket::after {
    content: "";
    position: absolute;
    width: 5px;
    height: 5px;
    border: 0 solid var(--ink);
    opacity: 0;
    transition: opacity 120ms;
}

.bracket::before { left: 0; top: 0; border-left-width: 1px; border-top-width: 1px; }
.bracket::after { right: 0; bottom: 0; border-right-width: 1px; border-bottom-width: 1px; }
.bracket:hover { color: var(--ink); transition-duration: 120ms; }
.bracket:hover::before,
.bracket:hover::after { opacity: 1; }

.who .bracket { color: var(--ink); font-size: 26px; }

.leaves {
    position: absolute;
    left: 836px;
    bottom: 66px;
    display: flex;
    gap: 30px;
    font-size: 24px;
}

.colophon {
    position: absolute;
    right: 66px;
    bottom: 66px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 22px;
    color: var(--muted);
    transition: color 500ms;
}

.colophon b { font-weight: 400; color: var(--ink); transition: color 500ms; }

</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="cover">
        <div class="verse" data-clock="greeting"></div>
        <div class="number">No. <span data-clock="day-of-year"></span></div>
        <div class="year" data-clock="roman-year"></div>
    </div>

    <span class="mark top"></span>
    <span class="mark bottom"></span>

    <div class="clock">
        <span data-clock="hours"></span><span class="colon"></span><span data-clock="minutes"></span>
    </div>
    <div class="date" data-clock="long"></div>

    <form data-login>
        <div class="who">
            Sign in as
            <button type="button" class="bracket" data-action="switch-user" title="Other user"><span data-user-name></span></button>
        </div>
        <label class="field">
            <input data-field="password" type="password" aria-label="Password">
        </label>
        <div class="notes">
            <span class="message" data-message></span>
            <span class="capslock" data-capslock>Caps Lock is on</span>
        </div>
    </form>

    <div class="leaves">
        <button class="bracket" data-power="suspend">Suspend</button>
        <button class="bracket" data-power="reboot">Restart</button>
        <button class="bracket" data-power="shutdown">Power off</button>
    </div>

    <div class="colophon">
        <button class="bracket" data-action="session">session · <b data-session-name></b></button>
        <button class="bracket" data-action="theme" data-theme-name>Ink</button>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
</body>
</html>
