<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 51 Unlock</title>
<link rel="stylesheet" href="shared/base.css?v=20261123c">
<style>
.stage {
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --lift: 520ms;
    --breeze: #3daee9;
    --negative: #ff8a80;
    background: #0b0d10;
    color: #fff;
}

.bg {
    position: absolute;
    inset: -40px;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    transition: opacity var(--lift) var(--ease), transform var(--lift) var(--ease);
}

.bg.sharp { background-image: var(--wallpaper, url("assets/wallpapers/qi.jpg")); }

.bg.soft {
    background-image: var(--wallpaper-blur, url("assets/wallpapers/qi-blur.jpg"));
    opacity: 1;
    transform: scale(1.04);
}

.dim {
    position: absolute;
    inset: 0;
    background: rgba(8, 10, 14, 0.42);
    transition: opacity var(--lift) var(--ease);
}

.shade {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0) 38%),
        linear-gradient(0deg, rgba(0, 0, 0, 0.32) 0%, rgba(0, 0, 0, 0) 30%);
    opacity: 0;
    transition: opacity var(--lift) var(--ease);
}

.is-locked .bg.soft { opacity: 0; transform: scale(1); }
.is-locked .dim { opacity: 0; }
.is-locked .shade { opacity: 1; }

.lock {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 150px;
    opacity: 0;
    transform: translateY(-140px);
    pointer-events: none;
    transition: opacity 360ms var(--ease), transform var(--lift) var(--ease);
}

.is-locked .lock {
    opacity: 1;
    transform: none;
    pointer-events: auto;
    cursor: pointer;
}

.lock-time {
    font-size: 148px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -2px;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
}

.lock-date {
    margin-top: 14px;
    font-size: 30px;
    font-weight: 500;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.4);
}

.lock-hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 64px;
    text-align: center;
    font-size: 16px;
    color: rgba(255, 255, 255, 0.72);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    animation: hint-breathe 3200ms ease-in-out infinite;
}

@keyframes hint-breathe {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
}

.login {
    position: absolute;
    inset: 0;
    opacity: 1;
    transform: none;
    transition: opacity 420ms var(--ease) 140ms, transform var(--lift) var(--ease) 80ms;
}

.is-locked .login {
    opacity: 0;
    transform: translateY(48px) scale(0.98);
    pointer-events: none;
    transition: opacity 220ms var(--ease), transform 300ms var(--ease);
}

.center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 128px;
}

.clock {
    font-size: 92px;
    font-weight: 300;
    line-height: 1;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
}

.date {
    margin-top: 10px;
    font-size: 22px;
    color: rgba(255, 255, 255, 0.86);
}

form {
    margin-top: 92px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 400ms var(--ease);
}

.avatar {
    width: 128px;
    height: 128px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.9);
    background: rgba(255, 255, 255, 0.14);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
}

.avatar i[data-icon] { width: 72px; height: 72px; }

.name {
    margin-top: 16px;
    font-size: 24px;
    font-weight: 500;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
}

.entry {
    position: relative;
    margin-top: 22px;
    display: flex;
}

.field {
    width: 300px;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px 0 12px;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.24);
    background: rgba(255, 255, 255, 0.12);
    transition: border-color 150ms, background 150ms;
}

.field:focus-within {
    border-color: var(--breeze);
    background: rgba(255, 255, 255, 0.16);
}

.field input { flex: 1; min-width: 0; font-size: 15px; }

.reveal { display: inline-flex; color: rgba(255, 255, 255, 0.62); }
.reveal:hover { color: #fff; }

.go {
    position: absolute;
    top: 0;
    left: calc(100% + 6px);
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.24);
    background: rgba(255, 255, 255, 0.12);
}

.go:hover { background: rgba(255, 255, 255, 0.22); }

.spinner {
    display: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-top-color: #fff;
    animation: spin 800ms linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.is-busy .go i[data-icon] { display: none; }
.is-busy .spinner { display: block; }
.is-busy .field { opacity: 0.7; }

.notes {
    margin-top: 14px;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 15px;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
}

.message { color: rgba(255, 255, 255, 0.88); }
.capslock { color: #fdbc4b; }

.is-error .entry { animation: shake 360ms ease-in-out; }
.is-error .field { border-color: var(--negative); }
.is-error .message { color: var(--negative); font-weight: 500; }
.is-info .message { color: #9fdcff; }

.actions {
    margin-top: 56px;
    display: flex;
    gap: 12px;
    transition: opacity 400ms var(--ease);
}

.actions button {
    width: 104px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
}

.actions .ring {
    width: 56px;
    height: 56px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    transition: background 150ms;
}

.actions button:hover .ring { background: rgba(255, 255, 255, 0.16); }
.actions i[data-icon] { width: 32px; height: 32px; }

.corner {
    position: absolute;
    bottom: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.82);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    transition: opacity 400ms var(--ease);
}

.corner:hover { background: rgba(255, 255, 255, 0.12); }
.corner b { color: #fff; font-weight: 600; }
.corner.left { left: 40px; }
.corner.right { right: 40px; cursor: default; }
.corner.right:hover { background: none; }

.is-success .bg.soft { opacity: 0; transform: scale(1); }
.is-success .dim { opacity: 0.2; }
.is-success .actions,
.is-success .corner,
.is-success .clock,
.is-success .date,
.is-success .avatar,
.is-success .name,
.is-success .entry { opacity: 0; }
.is-success .avatar,
.is-success .name,
.is-success .entry,
.is-success .clock,
.is-success .date { transition: opacity 400ms var(--ease); }
.is-success .message { font-size: 20px; color: #fff; }
</style>
</head>
<body>
<div class="stage is-locked" data-stage>
    <div class="bg sharp"></div>
    <div class="bg soft"></div>
    <div class="dim"></div>
    <div class="shade"></div>

    <div class="lock" data-lock>
        <div class="lock-time tabular" data-clock="time"></div>
        <div class="lock-date" data-clock="long"></div>
        <div class="lock-hint">Press any key or click to sign in</div>
    </div>

    <div class="login">
        <div class="center">
            <div class="clock tabular" data-clock="time"></div>
            <div class="date" data-clock="long"></div>

            <form data-login>
                <div class="avatar"><i data-icon="user-identity"></i></div>
                <div class="name" data-user-name></div>
                <div class="entry">
                    <label class="field">
                        <input data-field="password" data-masked type="text" placeholder="Password" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off">
                        <button type="button" class="reveal" data-action="reveal" title="Show password">
                            <i data-icon="view-visible"></i>
                        </button>
                    </label>
                    <button class="go" type="submit" title="Log in"><i data-icon="go-next"></i><span class="spinner"></span></button>
                </div>
                <div class="notes">
                    <span class="message" data-message></span>
                    <span class="capslock" data-capslock>Caps Lock is on</span>
                </div>
            </form>

            <div class="actions">
                <button data-power="suspend"><span class="ring"><i data-icon="system-suspend"></i></span>Sleep</button>
                <button data-power="reboot"><span class="ring"><i data-icon="system-reboot"></i></span>Restart</button>
                <button data-power="shutdown"><span class="ring"><i data-icon="system-shutdown"></i></span>Shut Down</button>
                <button data-action="switch-user"><span class="ring"><i data-icon="system-switch-user"></i></span>Other User</button>
            </div>
        </div>

        <button class="corner left" data-action="session">Desktop Session:&nbsp;<b data-session-name></b></button>
        <div class="corner right">Keyboard Layout:&nbsp;<b>English (US)</b></div>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · any key / click unlocks · <b>Esc</b> lock · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
