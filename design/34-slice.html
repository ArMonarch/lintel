<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 34 Slice</title>
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face {
    font-family: "Roboto";
    src: url("assets/fonts/Roboto-Regular.ttf") format("truetype");
    font-weight: 400;
}

@font-face {
    font-family: "Roboto";
    src: url("assets/fonts/Roboto-Bold.ttf") format("truetype");
    font-weight: 700;
}

@font-face {
    font-family: "Roboto";
    src: url("assets/fonts/Roboto-Black.ttf") format("truetype");
    font-weight: 900;
}

.stage {
    --main: #dddddd;
    --dim: #888888;
    --faint: #6c6c6c;
    --bg: #222222;
    --box: #1f1f1f;
    --chip: #303030;
    --chip-hover: #3e3e3e;
    --chip-dark: #171717;
    --solid-ink: #1a1a1a;
    --red: #d8463a;
    --yellow: #e9c447;
    --shear: -15deg;
    background: var(--bg);
    color: var(--main);
    font-family: "Roboto", var(--font-sans);
}

.backdrop {
    position: absolute;
    top: -30px;
    bottom: -30px;
    left: -40px;
    right: -260px;
    background: var(--wallpaper) center / cover no-repeat;
    transition: transform 1400ms cubic-bezier(0.2, 0.7, 0.2, 1), opacity 600ms;
}

.shade {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(180deg, rgba(34, 34, 34, 0.55) 0%, rgba(34, 34, 34, 0) 22%, rgba(34, 34, 34, 0) 76%, rgba(34, 34, 34, 0.6) 100%),
        rgba(34, 34, 34, 0.74);
    transition: background 700ms, opacity 900ms;
}

.is-ink .backdrop { opacity: 0; }
.is-ink .shade { background: var(--bg); }

.numeral {
    position: absolute;
    right: 120px;
    top: 120px;
    font-size: 560px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.04em;
    color: transparent;
    -webkit-text-stroke: 2px rgba(221, 221, 221, 0.09);
    transform: skewX(var(--shear));
    transition: transform 1400ms cubic-bezier(0.2, 0.7, 0.2, 1), opacity 500ms;
    pointer-events: none;
}

.numeral span { display: none; }
.numeral .n2 { display: inline; }
.is-busy .numeral .n2 { display: none; }
.is-busy .numeral .n3 { display: inline; }

.is-busy .backdrop { transform: translateX(-90px); }
.is-busy .numeral { transform: translateX(-240px) skewX(var(--shear)); }
.is-success .backdrop { transform: translateX(-200px); }
.is-success .numeral { transform: translateX(-900px) skewX(var(--shear)); opacity: 0; }
.is-success .shade { opacity: 0.55; }
.is-ink.is-success .shade { opacity: 1; }

.chip {
    --shape: skewX(var(--shear));
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    padding: 0 20px;
    background: var(--chip);
    color: var(--main);
    font-family: "Roboto", var(--font-sans);
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    transform: var(--shape);
}

.chip > span {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    transform: skewX(calc(var(--shear) * -1));
}

.chip i[data-icon] { width: 16px; height: 16px; }

button.chip { transition: background 140ms, color 140ms; }
button.chip:hover { background: var(--chip-hover); }

.chip.is-dim { color: var(--dim); }
.chip.is-solid { background: var(--main); color: var(--solid-ink); }
button.chip.is-solid:hover { background: #ffffff; }
.chip.is-dark { background: var(--chip-dark); }

.slide {
    transform: translateX(var(--off, 0px)) var(--shape,);
    transition:
        transform 620ms cubic-bezier(0.16, 0.8, 0.3, 1) calc(var(--i, 0) * 28ms),
        background 140ms,
        color 140ms;
}

.is-success .slide {
    --off: -2500px;
    transition:
        transform 640ms cubic-bezier(0.7, 0, 0.9, 0.45) calc(var(--i, 0) * 32ms),
        background 140ms,
        color 140ms;
}

.crumbs {
    position: absolute;
    left: 88px;
    top: 72px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.mark {
    width: 52px;
    padding: 0;
    background: var(--main);
    color: var(--solid-ink);
}

.mark svg { width: 22px; height: 22px; display: block; }

.sep {
    display: inline-block;
    padding: 0 4px;
    font-size: 18px;
    font-weight: 700;
    color: var(--dim);
}

.alert {
    display: flex;
    gap: 6px;
    margin-left: 22px;
    visibility: hidden;
}

.is-error .alert,
.is-info .alert {
    visibility: visible;
    animation: alert-in 420ms cubic-bezier(0.2, 0.9, 0.25, 1.08) both;
}

@keyframes alert-in {
    from { opacity: 0; transform: translateX(-90px); }
    to { opacity: 1; transform: translateX(0); }
}

.alert-head { background: var(--red); color: #ffffff; padding: 0 22px; }
.alert-head b { display: inline-block; width: 8px; height: 8px; background: #ffffff; }
.alert-body { max-width: 760px; background: var(--chip-dark); color: var(--main); padding: 0 22px; }
.alert-body > span { display: block; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.is-info .alert-head { display: none; }
.is-info .alert-body { background: var(--yellow); color: var(--solid-ink); }

.corner {
    position: absolute;
    right: 88px;
    top: 72px;
    display: flex;
    gap: 6px;
}

.theme-flat { display: none; }
.is-ink .theme-flat { display: inline; }
.is-ink .theme-wall { display: none; }

form {
    --shape: ;
    position: absolute;
    left: 572px;
    top: 356px;
    width: 776px;
    height: 352px;
}

.is-error form { animation: shake 360ms ease-in-out; }

.box {
    position: absolute;
    inset: 0;
    background: var(--box);
    transform: skewX(var(--shear));
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.42), inset 0 0 0 1px rgba(221, 221, 221, 0.07);
}

.box::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: var(--main);
    transition: background 200ms;
}

.is-error .box::before { background: var(--red); }
.is-info .box::before { background: var(--yellow); }

.box .chip { transform: none; }

.steps {
    position: absolute;
    left: 56px;
    top: -18px;
    display: flex;
    gap: 6px;
}

.steps .chip { background: var(--chip); color: var(--faint); transition: background 200ms, color 200ms; }
.steps .chip em { font-style: normal; color: inherit; opacity: 0.6; }
.steps .s1 { color: var(--dim); }
.steps .s2 { background: var(--main); color: var(--solid-ink); }
.is-error .steps .s2 { background: var(--red); color: #ffffff; }
.is-busy .steps .s2 { background: var(--chip); color: var(--dim); }
.is-busy .steps .s3 { background: var(--main); color: var(--solid-ink); }
.tick { display: none; width: 12px; height: 12px; }
.steps .s1 .tick,
.is-busy .steps .s2 .tick { display: block; }

.rows {
    position: absolute;
    left: 66px;
    right: 66px;
    top: 66px;
    transform: skewX(calc(var(--shear) * -1));
}

.caption {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
}

.caption b { font-weight: 700; color: var(--faint); }

.name {
    margin-top: 12px;
    font-size: 88px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--main);
    white-space: nowrap;
}

.label {
    margin-top: 40px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
}

.field {
    position: relative;
    display: flex;
    align-items: center;
    height: 56px;
    border-bottom: 1px solid rgba(221, 221, 221, 0.45);
    transition: border-color 160ms;
}

.field::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 2px;
    background: var(--main);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1), background 160ms;
}

.field:focus-within::after { transform: scaleX(1); }
.is-error .field::after { transform: scaleX(1); background: var(--red); }

.field input {
    flex: 1;
    min-width: 0;
    height: 100%;
    font-family: "Roboto", var(--font-sans);
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 8px;
    color: var(--main);
    caret-color: var(--main);
}

.field input:disabled { color: var(--dim); }

.reveal { display: inline-flex; padding: 6px; color: var(--dim); }
.reveal:hover { color: var(--main); }

.actions {
    position: absolute;
    right: -34px;
    bottom: -26px;
    display: flex;
    gap: 8px;
}

.actions .chip { height: 52px; padding: 0 30px; font-size: 14px; }
.back { background: #2e2e2e; color: var(--dim); }
.back:hover { color: var(--main); }
.is-busy .back { color: var(--faint); pointer-events: none; }

.login {
    width: 220px;
    overflow: hidden;
    background: var(--main);
    color: var(--solid-ink);
}

.login .fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0;
    overflow: hidden;
    display: block;
    background: var(--main);
    color: var(--solid-ink);
    transform: none;
}

.login .fill > span {
    position: absolute;
    left: 0;
    top: 0;
    width: 220px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    transform: skewX(calc(var(--shear) * -1));
}

.busy-text { display: none; }
.is-busy .busy-text { display: inline; }
.is-busy .idle-text { display: none; }
.is-busy .login { background: #2e2e2e; color: var(--main); pointer-events: none; }
.is-busy .login .fill { width: 64%; animation: login-progress 1100ms cubic-bezier(0.45, 0, 0.25, 1) infinite; }

@keyframes login-progress {
    from { width: 0; }
    to { width: 100%; }
}

.status {
    position: absolute;
    left: 88px;
    bottom: 72px;
    display: flex;
    gap: 6px;
}

.led {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #4a4a4a;
}

.status .chip { color: var(--dim); }
.status .chip.is-on { color: var(--main); }
.status .chip.is-on .led { background: var(--main); }
.caps [data-capslock] { display: inline-block; width: 8px; height: 8px; background: var(--solid-ink); }
.caps .led { display: none; }
.caps:has([data-capslock][hidden]) .led { display: inline-block; }
.caps:has([data-capslock]:not([hidden])) { background: var(--yellow); color: var(--solid-ink); }

.dock {
    position: absolute;
    right: 88px;
    bottom: 72px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.dock .gap { width: 30px; }
.dock [data-power] { color: var(--dim); }
.dock [data-power]:hover { color: var(--main); }
.dock [data-power="shutdown"]:hover { background: var(--red); color: #ffffff; }
.dock .time { min-width: 104px; font-feature-settings: "tnum" 1; }

.launch {
    position: absolute;
    left: 0;
    right: 0;
    top: 452px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transform: translateX(2200px);
    opacity: 0;
    transition: transform 420ms cubic-bezier(0.7, 0, 0.9, 0.45), opacity 200ms 220ms;
    pointer-events: none;
}

.is-success .launch {
    transform: translateX(0);
    opacity: 1;
    transition: transform 720ms cubic-bezier(0.16, 0.8, 0.3, 1) 560ms, opacity 1ms 560ms;
}

.launch .chip.big {
    height: 92px;
    padding: 0 56px;
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 0.02em;
}

.launch .bar {
    width: 420px;
    height: 10px;
    padding: 0;
    overflow: hidden;
    background: rgba(221, 221, 221, 0.18);
}

.launch .bar::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0;
    background: var(--main);
}

.is-success .launch .bar::after { width: 38%; animation: launch-fill 1500ms cubic-bezier(0.4, 0, 0.2, 1) 900ms both; }

@keyframes launch-fill {
    from { width: 0; }
    to { width: 100%; }
}
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="backdrop"></div>
    <div class="shade"></div>
    <div class="numeral"><span class="n2">02</span><span class="n3">03</span></div>

    <nav class="crumbs">
        <span class="chip mark slide"><span><svg viewBox="0 0 22 22" fill="currentColor"><rect x="2" y="3" width="18" height="4"/><rect x="4" y="9" width="3" height="11"/><rect x="15" y="9" width="3" height="11"/></svg></span></span>
        <span class="chip is-dim slide"><span>seiren</span></span>
        <span class="sep slide">/</span>
        <button class="chip slide" data-action="session" title="Next session"><span data-session-name></span></button>
        <span class="sep slide">/</span>
        <button class="chip is-solid slide" data-action="switch-user" title="Switch user"><span data-user-name></span></button>
        <div class="alert">
            <span class="chip alert-head"><span><b></b>Wrong password</span></span>
            <span class="chip alert-body"><span data-message></span></span>
        </div>
    </nav>

    <div class="corner">
        <span class="chip is-dim slide"><span>Backdrop</span></span>
        <button class="chip slide" data-action="theme" title="Wallpaper or flat"><span><span class="theme-wall">Wallpaper</span><span class="theme-flat">Flat</span></span></button>
    </div>

    <form class="slide" data-login>
        <div class="box">
            <div class="steps">
                <span class="chip s1"><span><em>01</em>User<svg class="tick" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M2 6.5l2.6 2.6L10 3.5"/></svg></span></span>
                <span class="chip s2"><span><em>02</em>Password<svg class="tick" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M2 6.5l2.6 2.6L10 3.5"/></svg></span></span>
                <span class="chip s3"><span><em>03</em>Start</span></span>
            </div>

            <div class="rows">
                <div class="caption"><span>Signing in as</span><b>seiren · tty1</b></div>
                <div class="name" data-user-name></div>
                <div class="label">Password</div>
                <label class="field">
                    <input data-field="password" type="password" aria-label="Password" autocomplete="off">
                    <button type="button" class="reveal" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
                </label>
            </div>

            <div class="actions">
                <button type="button" class="chip back" data-action="switch-user" title="Back to user"><span>Back</span></button>
                <button type="submit" class="chip login">
                    <span><span class="idle-text">Login</span><span class="busy-text">Verifying</span><i data-icon="go-next"></i></span>
                    <span class="fill"><span><span class="busy-text">Verifying</span><i data-icon="go-next"></i></span></span>
                </button>
            </div>
        </div>
    </form>

    <div class="status">
        <span class="chip caps slide"><span><b class="led"></b><b data-capslock hidden></b>Caps lock</span></span>
        <span class="chip is-on slide" data-numlock><span><b class="led"></b>Num lock</span></span>
        <span class="chip is-on slide"><span>English (US)</span></span>
    </div>

    <div class="dock">
        <button class="chip slide" data-power="suspend" title="Suspend"><span><i data-icon="system-suspend"></i>Suspend</span></button>
        <button class="chip slide" data-power="reboot" title="Restart"><span><i data-icon="system-reboot"></i>Restart</span></button>
        <button class="chip slide" data-power="shutdown" title="Power off"><span><i data-icon="system-shutdown"></i>Power off</span></button>
        <span class="gap"></span>
        <span class="chip is-dim slide"><span data-clock="weekday"></span></span>
        <span class="chip slide"><span data-clock="day-month-year"></span></span>
        <span class="chip is-solid time slide"><span data-clock="time"></span></span>
    </div>

    <div class="launch">
        <span class="chip is-dim"><span>Starting</span></span>
        <span class="chip is-solid big"><span data-session-name></span></span>
        <span class="chip bar"></span>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>

<script>
const slices = [...stage.querySelectorAll(".slide")];
const slice_lefts = slices.map((node) => node.getBoundingClientRect().left);
const slice_order = slices.map((node, index) => index).sort((a, b) => slice_lefts[a] - slice_lefts[b]);
slice_order.forEach((index, rank) => slices[index].style.setProperty("--i", rank));

const numlock = stage.querySelector("[data-numlock]");
console.assert(numlock !== null);

function numlock_update(event) {
    if (typeof event.getModifierState !== "function") return;
    if (!event.isTrusted) return;
    numlock.classList.toggle("is-on", event.getModifierState("NumLock"));
}

document.addEventListener("keydown", numlock_update);
document.addEventListener("keyup", numlock_update);
</script>
