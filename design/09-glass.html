<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 09 Glass</title>
<link rel="stylesheet" href="shared/base.css">
<style>
/* 09 Glass: the frosted card of Sugar Candy, astronaut and the Catppuccin
   themes. GTK cannot blur what is behind a widget, so the card paints the
   pre-blurred wallpaper itself, offset by its own position. The greeter would
   generate that offset in CSS at startup for the monitor's real size. */

.card {
    position: absolute;
    left: 160px;
    top: 224px;
    width: 480px;
    padding: 38px 40px 22px;
    border-radius: 26px;
    border: 1px solid rgba(255, 240, 225, 0.24);
    background:
        linear-gradient(180deg, rgba(255, 240, 225, 0.12), rgba(255, 240, 225, 0) 34%),
        linear-gradient(170deg, rgba(28, 14, 12, 0.46), rgba(16, 7, 6, 0.66)),
        var(--wallpaper-blur) -160px -224px / 1920px 1080px no-repeat;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 240, 225, 0.28);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 300ms;
}

.clock { font-size: 72px; font-weight: 300; line-height: 1; letter-spacing: -1px; }
.date { margin-top: 8px; font-size: 16px; color: rgba(242, 232, 216, 0.72); }

form { width: 100%; margin-top: 28px; display: flex; flex-direction: column; align-items: center; }

.avatar {
    width: 88px;
    height: 88px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: linear-gradient(135deg, #d64a34, var(--lacquer-deep));
    border: 2px solid rgba(255, 240, 225, 0.55);
    box-shadow: 0 10px 28px rgba(142, 42, 31, 0.45);
    font-size: 38px;
    font-weight: 600;
    transition: border-color 300ms, box-shadow 300ms;
}

.welcome { margin-top: 14px; font-size: 14px; color: rgba(242, 232, 216, 0.68); }

.name {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
    padding: 2px 8px 2px 10px;
    border-radius: 8px;
    font-size: 22px;
    font-weight: 600;
    transition: background 120ms;
}

.name:hover { background: rgba(255, 240, 225, 0.1); }
.name i[data-icon] { width: 20px; height: 20px; opacity: 0.7; }
.name:hover i[data-icon] { opacity: 1; }

.field {
    width: 100%;
    height: 48px;
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px 0 18px;
    border-radius: 14px;
    border: 1px solid rgba(255, 240, 225, 0.2);
    background: rgba(16, 8, 7, 0.5);
    transition: border-color 150ms, background 150ms, opacity 300ms;
}

.field:focus-within { border-color: rgba(230, 179, 92, 0.8); }
.field input { flex: 1; min-width: 0; font-size: 16px; caret-color: var(--gold); }
.field input[type="password"] { font-size: 20px; letter-spacing: 3px; }
.field input::placeholder { font-size: 16px; letter-spacing: 0; }

.reveal { display: inline-flex; padding: 4px; border-radius: 8px; color: rgba(242, 232, 216, 0.55); }
.reveal:hover { color: var(--parchment); background: rgba(255, 240, 225, 0.1); }

.login {
    position: relative;
    overflow: hidden;
    width: 100%;
    height: 48px;
    margin-top: 12px;
    border-radius: 14px;
    background: linear-gradient(180deg, #d64a34, var(--lacquer-deep));
    font-size: 16px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(142, 42, 31, 0.45);
    transition: background 300ms, box-shadow 300ms, color 300ms;
}

.login:hover { background: linear-gradient(180deg, #e3563f, #9c3124); }

.login::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255, 240, 225, 0.32) 50%, transparent 70%);
    transform: translateX(-100%);
    opacity: 0;
}

.notes {
    width: 100%;
    min-height: 40px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 14px;
}

.message {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    max-width: 100%;
    padding: 7px 14px 7px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 240, 225, 0.16);
    background: rgba(255, 240, 225, 0.08);
    line-height: 1.3;
    text-align: left;
    color: rgba(242, 232, 216, 0.9);
}

.message:empty { display: none; }

.message::before {
    content: "";
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
}

.capslock { color: var(--gold); }

.is-busy .field { opacity: 0.55; }
.is-busy .login { color: rgba(242, 232, 216, 0.6); box-shadow: none; }
.is-busy .login::after { opacity: 1; animation: sheen 1100ms ease-in-out infinite; }
.is-busy .message::before {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(242, 232, 216, 0.22);
    border-top-color: var(--parchment);
    background: none;
    animation: spin 800ms linear infinite;
}

.is-error .field {
    border-color: var(--danger);
    background: rgba(142, 42, 31, 0.3);
    animation: shake 360ms ease-in-out;
}

.is-error .message {
    color: #ffc1b8;
    border-color: rgba(255, 122, 107, 0.6);
    background: rgba(200, 64, 44, 0.32);
}

.is-error .message::before { background: var(--danger); }

.is-info .message {
    color: #b7ece2;
    border-color: rgba(63, 174, 154, 0.6);
    background: rgba(63, 174, 154, 0.16);
}

.is-info .message::before { background: var(--jade); animation: pulse 1600ms ease-in-out infinite; }

.is-success .field, .is-success .bar { opacity: 0.4; }
.is-success .avatar { border-color: var(--jade); box-shadow: 0 0 0 6px rgba(63, 174, 154, 0.25), 0 10px 28px rgba(20, 90, 78, 0.45); }
.is-success .login { background: linear-gradient(180deg, #4dc3ad, #2d8d7c); box-shadow: 0 8px 24px rgba(63, 174, 154, 0.4); }
.is-success .message { color: var(--ink); font-weight: 600; border-color: transparent; background: var(--jade); }

.is-success .message::before {
    width: 6px;
    height: 11px;
    margin: -3px 2px 0 2px;
    border-radius: 0;
    border-right: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    background: none;
    transform: rotate(45deg);
}

.is-success .card { animation: card-away 700ms ease-in 1500ms forwards; }

@keyframes sheen {
    to { transform: translateX(100%); }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(63, 174, 154, 0.5); }
    50% { box-shadow: 0 0 0 6px rgba(63, 174, 154, 0); }
}

@keyframes card-away {
    to { opacity: 0; transform: translateY(-16px); }
}

.bar {
    width: 100%;
    margin-top: 6px;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 240, 225, 0.14);
    display: flex;
    align-items: center;
    gap: 2px;
    transition: opacity 300ms;
}

.bar button {
    height: 38px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    border-radius: 10px;
    font-size: 14px;
    color: rgba(242, 232, 216, 0.75);
    transition: color 120ms, background 120ms;
}

.bar button:hover { color: var(--parchment); background: rgba(255, 240, 225, 0.1); }
.bar .session { margin-right: auto; padding: 0 8px 0 10px; gap: 4px; }
.bar .session i[data-icon] { width: 16px; height: 16px; opacity: 0.55; transform: rotate(90deg); }
.bar .session:hover i[data-icon] { opacity: 1; }
.bar b { color: var(--parchment); font-weight: 600; }
.bar [data-power] { width: 38px; padding: 0; justify-content: center; }
.bar [data-power] i[data-icon] { width: 24px; height: 24px; }
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="card">
        <div class="clock tabular" data-clock="time"></div>
        <div class="date" data-clock="long"></div>

        <form data-login>
            <div class="avatar" data-user-initial></div>
            <div class="welcome">Welcome back</div>
            <button type="button" class="name" data-action="switch-user" title="Switch user">
                <span data-user-name></span><i data-icon="system-switch-user"></i>
            </button>
            <label class="field">
                <input data-field="password" type="password" placeholder="Password">
                <button type="button" class="reveal" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
            </label>
            <button class="login" type="submit">Log in</button>
            <div class="notes">
                <span class="message" data-message></span>
                <span class="capslock" data-capslock>Caps Lock is on</span>
            </div>
        </form>

        <div class="bar">
            <button class="session" data-action="session">Session&nbsp;<b data-session-name></b><i data-icon="go-next"></i></button>
            <button data-power="suspend" title="Sleep"><i data-icon="system-suspend"></i></button>
            <button data-power="reboot" title="Restart"><i data-icon="system-reboot"></i></button>
            <button data-power="shutdown" title="Shut Down"><i data-icon="system-shutdown"></i></button>
        </div>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
</body>
</html>
