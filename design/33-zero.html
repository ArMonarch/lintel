<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 33 Zero</title>
<link rel="stylesheet" href="shared/base.css">
<style>
.stage {
    --mono: "Iosevka Nerd Font Mono", "Iosevka NFM", "Iosevka Nerd Font", "Adwaita Mono", "DejaVu Sans Mono", monospace;
    --text: #f4f1ec;
    --love: #eb6f92;
    --leaf: #8fd6a4;
    --gold: #f6c177;
    background: #000 var(--wallpaper) center / cover no-repeat;
    color: var(--text);
    font-family: var(--mono);
    cursor: none;
}

.stage.is-ink { background: #000; }

.shade {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse 1100px 560px at 50% 50%, rgba(0, 0, 0, 0.46), rgba(0, 0, 0, 0.18) 55%, rgba(0, 0, 0, 0) 100%),
        rgba(0, 0, 0, 0.26);
    opacity: 0;
    transition: opacity 900ms ease;
    pointer-events: none;
}

.is-awake .shade,
.is-info .shade,
.is-busy .shade { opacity: 1; }
.is-ink .shade { display: none; }

.entry {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
}

.sink {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: 2px;
    opacity: 0;
    pointer-events: none;
}

.line {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 0;
}

.row {
    --size: 96px;
    position: absolute;
    left: 50%;
    top: 0;
    display: flex;
    align-items: center;
    height: var(--size);
    transform: translate(-50%, -50%);
    font-size: var(--size);
    font-weight: 500;
    line-height: 1;
    white-space: pre;
    opacity: 0;
    transition: opacity 260ms ease, transform 320ms cubic-bezier(0.5, 0, 0.2, 1);
}

.row.is-clipped {
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%);
    mask-image: linear-gradient(90deg, transparent, #000 18%);
}

.is-awake .row { opacity: 1; }

.cell {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 0.78em;
    height: 1em;
    text-shadow: 0 0 36px rgba(0, 0, 0, 0.45);
}

.cell.is-dot::after {
    content: "";
    width: 0.42em;
    height: 0.42em;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 34px rgba(0, 0, 0, 0.35);
}

.cell.is-cursor::before,
.cell.is-under::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 0.5em;
    height: 1em;
    margin-left: -0.25em;
    background: var(--text);
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
    animation: blink 1060ms steps(1) infinite;
}

.cell.is-under { color: #111; z-index: 0; }
.cell.is-under::before { z-index: -1; }
.cell.is-under.is-dot::after { background: #111; box-shadow: none; }

@keyframes blink {
    0%, 55% { opacity: 1; }
    56%, 100% { opacity: 0; }
}

.is-error .cell.is-cursor::before,
.is-error .cell.is-under::before {
    background: var(--love);
    animation: none;
}

.is-error .line { animation: shake 360ms ease-in-out; }

.beam {
    position: absolute;
    left: 50%;
    top: -2px;
    width: var(--beam, 240px);
    height: 4px;
    margin-left: calc(var(--beam, 240px) / -2);
    border-radius: 2px;
    background: var(--text);
    box-shadow: 0 0 24px rgba(255, 255, 255, 0.35), 0 0 2px rgba(0, 0, 0, 0.6);
    opacity: 0;
    transform: scaleX(0.02);
    transition: opacity 200ms ease, transform 420ms cubic-bezier(0.5, 0, 0.2, 1);
    pointer-events: none;
}

.is-busy .row {
    opacity: 0;
    transform: translate(-50%, -50%) scaleY(0.04);
}

.is-success .row { opacity: 0; transition: none; }

.is-busy .beam {
    opacity: 1;
    transform: scaleX(1);
    animation: beam-pulse 1300ms 420ms ease-in-out infinite;
}

@keyframes beam-pulse {
    0%, 100% { opacity: 1; transform: scaleX(1); }
    50% { opacity: 0.28; transform: scaleX(0.86); }
}

.caps {
    position: absolute;
    left: 50%;
    top: -112px;
    width: 30px;
    height: 30px;
    margin-left: -15px;
    color: var(--gold);
    filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.5));
}

.caps svg { width: 100%; height: 100%; }

.message {
    position: absolute;
    left: 0;
    right: 0;
    top: 92px;
    text-align: center;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text);
    text-shadow: 0 0 22px rgba(0, 0, 0, 0.85), 0 0 6px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.6);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 300ms ease, transform 300ms ease;
}

.is-info .message { opacity: 1; transform: none; }

.clock {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 92px;
    text-align: center;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.14em;
    color: #fff;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.7);
    opacity: 0;
    transition: opacity 400ms ease;
    pointer-events: none;
}

.is-still .clock {
    opacity: 0.2;
    transition: opacity 1800ms ease;
}

.toast {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 34px;
    display: flex;
    justify-content: center;
    gap: 0.9em;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: var(--text);
    text-shadow: 0 0 14px rgba(0, 0, 0, 0.8);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 260ms ease, transform 260ms ease;
    pointer-events: none;
}

.toast.is-shown { opacity: 0.85; transform: none; }
.toast .chevron { opacity: 0.45; }
.toast [data-user-name] { display: none; }
.toast.is-user [data-user-name] { display: inline; }
.toast.is-user [data-session-name] { display: none; }

.edge {
    position: absolute;
    inset: 0;
    border: 6px solid transparent;
    pointer-events: none;
}

.is-error .edge {
    border-color: var(--love);
    box-shadow: inset 0 0 160px rgba(235, 111, 146, 0.3);
    animation: edge-flash 820ms linear forwards;
}

@keyframes edge-flash {
    0% { opacity: 1; }
    16% { opacity: 0; }
    32% { opacity: 1; }
    48% { opacity: 0; }
    64%, 100% { opacity: 1; }
}

.is-success .edge { border-color: var(--leaf); }

.blackout {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
}

.is-success .blackout { animation: cut 1ms 300ms steps(1) forwards; }

@keyframes cut {
    to { opacity: 1; }
}
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="shade"></div>

    <form class="entry" data-login>
        <input class="sink" data-field="password" type="password" autocomplete="off" spellcheck="false" aria-label="Password">
        <div class="line">
            <span class="caps" data-capslock><svg viewBox="0 0 26 26"><path d="M13 3 L23 13.5 H17.5 V18.5 H8.5 V13.5 H3 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8.5 23 H17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
            <div class="row" aria-hidden="true"></div>
            <span class="beam"></span>
            <p class="message" data-message></p>
        </div>
    </form>

    <div class="clock tabular" data-clock="time"></div>

    <div class="toast"><span class="chevron">&lt;</span><span data-session-name></span><span data-user-name></span><span class="chevron">&gt;</span></div>

    <div class="edge"></div>
    <div class="blackout"></div>

    <div hidden>
        <button type="button" data-action="session"></button>
        <button type="button" data-action="switch-user"></button>
        <button type="button" data-action="reveal"><i data-icon="view-visible"></i></button>
        <button type="button" data-action="theme"></button>
        <button type="button" data-power="suspend"></button>
        <button type="button" data-power="reboot"></button>
        <button type="button" data-power="shutdown"></button>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
<script>
const ZERO_DOT_SIZE_MAX = 96;
const ZERO_DOT_SIZE_MIN = 44;
const ZERO_ROW_WIDTH_MAX = 1560;
const ZERO_CELL_EM = 0.78;
const ZERO_CELLS_VISIBLE_MAX = 44;
const ZERO_BEAM_WIDTH_MIN = 240;
const ZERO_WAKE_MS = 5000;
const ZERO_STILL_MS = 4000;
const ZERO_TOAST_MS = 2000;

const zero_row = stage.querySelector(".row");
const zero_beam = stage.querySelector(".beam");
const zero_toast = stage.querySelector(".toast");
console.assert(zero_row !== null && zero_beam !== null && zero_toast !== null);

let zero_key_last = -ZERO_WAKE_MS;
let zero_quiet_since = performance.now();
let zero_row_signature = "";
let zero_toast_timer = 0;

function zero_row_render() {
    const value = field_password.value;
    const shown = field_password.type === "text";
    const caret = field_password.selectionStart === null ? value.length : field_password.selectionStart;
    const signature = `${value.length}:${caret}:${shown ? value : ""}`;
    if (signature === zero_row_signature) return;
    zero_row_signature = signature;

    const count = value.length;
    const first = Math.max(0, count + 1 - ZERO_CELLS_VISIBLE_MAX);
    const cells = count - first + 1;
    console.assert(cells >= 1 && cells <= ZERO_CELLS_VISIBLE_MAX, cells);
    const fit = ZERO_ROW_WIDTH_MAX / (cells * ZERO_CELL_EM);
    const size = Math.max(ZERO_DOT_SIZE_MIN, Math.min(ZERO_DOT_SIZE_MAX, fit));
    zero_row.style.setProperty("--size", `${size}px`);
    zero_row.classList.toggle("is-clipped", first > 0);

    const nodes = [];
    for (let index = first; index < count; index += 1) {
        const cell = document.createElement("span");
        cell.className = "cell";
        if (shown) cell.textContent = value[index] === " " ? " " : value[index];
        else cell.classList.add("is-dot");
        if (index === caret) cell.classList.add("is-under");
        nodes.push(cell);
    }
    if (caret >= count) {
        const cursor = document.createElement("span");
        cursor.className = "cell is-cursor";
        nodes.push(cursor);
    }
    zero_row.replaceChildren(...nodes);

    if (!stage.classList.contains("is-busy")) {
        const width = Math.max(ZERO_BEAM_WIDTH_MIN, count * size * ZERO_CELL_EM);
        zero_beam.style.setProperty("--beam", `${Math.round(width)}px`);
    }
}

function zero_wake() {
    zero_key_last = performance.now();
    zero_quiet_since = zero_key_last;
}

function zero_tick() {
    const now = performance.now();
    const error = stage.classList.contains("is-error");
    if (error && field_password.value.length > 0) field_password.value = "";
    const awake = field_password.value.length > 0 || now - zero_key_last < ZERO_WAKE_MS || error || stage.classList.contains("is-info");
    stage.classList.toggle("is-awake", awake);
    stage.classList.toggle("is-still", now - zero_quiet_since > ZERO_STILL_MS);
    zero_row_render();
    requestAnimationFrame(zero_tick);
}

function zero_toast_show(kind) {
    console.assert(kind === "session" || kind === "switch-user", kind);
    zero_toast.classList.toggle("is-user", kind === "switch-user");
    zero_toast.classList.remove("is-shown");
    void zero_toast.offsetWidth;
    zero_toast.classList.add("is-shown");
    clearTimeout(zero_toast_timer);
    zero_toast_timer = setTimeout(() => zero_toast.classList.remove("is-shown"), ZERO_TOAST_MS);
}

document.addEventListener("click", (event) => {
    const target = event.target.closest("[data-action]");
    if (target !== null && (target.dataset.action === "session" || target.dataset.action === "switch-user")) {
        zero_toast_show(target.dataset.action);
    }
    if (!field_password.disabled) field_password.focus();
});

document.addEventListener("keydown", (event) => {
    zero_wake();
    if (document.activeElement !== field_password && !field_password.disabled) field_password.focus();
});

field_password.addEventListener("input", zero_wake);
field_password.addEventListener("blur", () => {
    if (!field_password.disabled) requestAnimationFrame(() => field_password.focus());
});

requestAnimationFrame(zero_tick);
</script>
</body>
</html>
