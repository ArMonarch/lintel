<h1>lintel — archived designs</h1>
<p>Set aside while 01 Revival, 04 Plasma and 51 Unlock are refined. Back to the <a href="index.html" style="color:#f2e8d8">current designs</a>.</p>
<div class="list">
    <figure class="entry">
        <figcaption><a href="02-lacquer.html">02 Lacquer</a>
            <span>Ink panel fading from the left, colours from the painting, red seal avatar, underline fields.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="03-floor.html">03 Floor</a>
            <span>One strip along the dark floor; the painting stays fully uncovered.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="04-plasma.html">04 Plasma</a>
            <span>Plasma lock-screen layout on a pre-blurred wallpaper that sharpens on login. Folded into 51 Unlock.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="05-ring.html">05 Ring</a>
            <span>swaylock-effects / i3lock-color: no text field, a ring flashes an arc per keystroke around the clock.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="06-stacked.html">06 Stacked</a>
            <span>hyprlock: giant stacked hours over minutes, greeting, chips, single rounded input at the bottom.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="07-terminal.html">07 Terminal</a>
            <span>agreety / terminal-style SDDM: a monospace console with getty wording and a key bar.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="08-scroll.html">08 Scroll</a>
            <span>Specific to this painting: a vertical kanji clock with jade marks, echoing its inscription.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="09-glass.html">09 Glass</a>
            <span>Sugar Candy / astronaut / Catppuccin: a frosted card holding clock, avatar, form and power bar.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="10-dashboard.html">10 Dashboard</a>
            <span>Quickshell shells (end-4, caelestia, DMS): widget cards for clock, calendar and system facts.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="11-paper.html">11 Paper</a>
            <span>"Paper &amp; ink" niri rice: red cover block, Garamond clock, one rule for a field, paper and ink themes. Ignores the wallpaper.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="12-flap.html">12 Flap</a>
            <span>A full-screen split-flap departure board: double-height HH:MM, STATION/DATE/GATE, amber user and session rows, READY/CHECKING/DENIED/SEE REMARKS/BOARDING status flaps, a 30-cell password row, a Remarks row and word-flap power buttons.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="13-nameboard.html">13 Nameboard</a>
            <span>A white railway nameboard hung on a tiled platform wall: the user&#x27;s name huge in wide gothic over a session-coloured line band, neighbours as the next stations, the password a hairline rule under the name.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="14-onebit.html">14 One Bit</a>
            <span>A 1-bit desktop: the wallpaper Bayer-dithered to ink and paper behind a striped-titlebar Log In window with a user list box, session pop-up, block-character password field and double-bordered default button, a menubar clock top-right, a Power palette bottom-right, and modal alert boxes for errors and info.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="15-console.html">15 Console</a>
            <span>A 1960s hi-fi front panel: a 24-hour tuning scale with a red needle at the current time, a perforated speaker grille that shows the wallpaper as dot brightness, round session keys, a user knob, a dark password aperture with a status lamp and one honey Enter button.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="16-readout.html">16 Readout</a>
            <span>A 3x2 wall of black readout tiles with colour-banded three-letter codes (CLK, USR, PWD, PWR, SES, MSG) in extended Orbitron caps, stepwise motion only, and a status tile that turns yellow, red or blue per state.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="17-signage.html">17 Signage</a>
            <span>A bone-coloured industrial signage panel with black label plates, a heavy white clock, a recessed access-code slot with an amber/red/green lamp strip, colour-field session tiles, hazard-striped power-off, and the wallpaper framed in a bolted porthole.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="18-decay.html">18 Decay</a>
            <span>Amber-tinted, ghosted and scanlined specimen with a bracket-cursor user roster, burn-in password dots and a vertical clock; the image warps magenta on error and decays to the true wallpaper on success.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="19-bauhaus.html">19 Bauhaus</a>
            <span>Bauhaus poster geometry on cream: a blue disc masking the wallpaper, a red diamond holding the password, a black diagonal band and rule carrying the greeting and a 200px Jost clock, the user name set vertically, three shape markers for sessions and a red power block.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="20-sleeve.html">20 Sleeve</a>
            <span>A 1950s jazz sleeve: a duotone indigo-and-ochre halftone square beside an off-white field with a catalogue-number clock, the user name in two weights running off the edge, a hairline password rule and a small-caps track list.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="21-slide.html">21 Slide</a>
            <span>A conference title slide: diagonal red panel with a 168px Geist greeting, clock subtitle and hairline password, wallpaper as the figure, footer meta line and a black page-number plate; every state is a wiped or pushed slide.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="22-mascot.html">22 Mascot</a>
            <span>A round blue owl on a cream halo breathes, blinks and tracks the caret, covers its eyes when the password is shown, shakes its head with a red bubble on failure, points at the fingerprint reader, and cheers on success.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="23-ripple.html">23 Ripple</a>
            <span>Nothing but a slim translucent pill and plain text in the four corners; every keystroke, submit, error and success is a ring rippling out across the wallpaper from the field.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="24-fingerprint.html">24 Fingerprint</a>
            <span>A 320px white fingerprint of stroked arcs on a dark plum stage, the user name beneath with session and switch-user as quiet side labels, a slim password line that shows typed characters as small dots, and the print itself as the state language: it fills pink in order while busy, drains red on error, pulses in a dotted halo on info, and one arc straightens into a progress bar above the session name on success.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="25-circuit.html">25 Circuit</a>
            <span>A top-down PCB: the user name is the part number on a black QFP, 24 blue DIP switches flip on per typed character, a jumper header picks the session, tactile buttons are power, and copper traces pulse, light green or stamp ERR with the status LED.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="26-pinpad.html">26 Pinpad</a>
            <span>Twelve big passcode dots over a 3x3 hairline grid of session, user and power cells on charcoal, the chosen session filled white; dots pulse when busy, ring crimson on error and bounce lime into a result card on success.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="27-acid.html">27 Acid</a>
            <span>Neo-brutalist paper sheet with an outlined hostname and a 264px Archivo Black clock on the left, a hard-shadowed &#x27;/ login&#x27; card with an acid-yellow button on the right, mono tabs, and a WRONG PASSWORD sticker that slaps onto the card on error.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="28-spotlight.html">28 Spotlight</a>
            <span>A dark command palette: one translucent 720x64 pill with a user chip and password, grouped rows with keycap hints dropping below it, a tiny clock pill at the bottom; busy sweeps the pill border, error tints the first row red, success stretches the pill into a full-width bar.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="29-dial.html">29 Dial</a>
            <span>A brushed-rim combination dial half-sunk into the bottom edge carries users, sessions and power actions around its rim under a single orange pointer, with a light Plex clock and a plain password field above.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="30-dotmatrix.html">30 Dot Matrix</a>
            <span>A black 8px dot grid with the wallpaper halftoned through it, a 300px 5x7 dot-matrix clock, the user name, password slots and every message drawn in dots, one red dot marking power off.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="31-quiet.html">31 Quiet</a>
            <span>Midnight field with a large Fraunces greeting at the left third, a small gold clock line above it, a recessed password well whose gold halo breathes while busy, cools to rose on error with &quot;That&#x27;s not it. Take your time.&quot;, and expands as a ring to the screen edges on success.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="32-corners.html">32 Corners</a>
            <span>Every control pushed to a screen corner: a heavy periwinkle clock top-right, a round avatar over a stack of full-radius pills bottom-right, and two round buttons bottom-left that open dark panels, leaving the centre to the wallpaper.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="33-zero.html">33 Zero</a>
            <span>Nothing but the wallpaper until you type: huge monospace dots and a thick block cursor dead centre, a 20% clock whispering at the bottom, and a red edge flash as the only word for a wrong password.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="34-slice.html">34 Slice</a>
            <span>A wizard of 15-degree sheared chips in bold uppercase Roboto: breadcrumb host/session/user top-left, status chips bottom-left, power and date chips bottom-right, and a dark parallelogram box with the user name huge, a thin underline field, step tabs on its top edge and BACK/LOGIN hanging off its corner; busy fills LOGIN as a progress bar, error and info slide a red or yellow chip into the breadcrumb row, success sweeps every chip off the left edge.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="35-crt.html">35 CRT</a>
            <span>A dimmed wallpaper behind scanlines, a rolling bar and a tube vignette, a dithered pink-and-tan sigil above a glitch-sliced Bodoni headline, black mono fields with a flat pink Log in, and a VCR-style OSD; errors tear the frame and stamp ACCESS DENIED, success collapses the picture to a line, a dot, then black.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="36-arcade.html">36 Arcade</a>
            <span>A pixel arcade attract screen: the wallpaper ordered-dithered into off-white, slate and blossom pink under a chunky Pixel Code clock, a blinking PRESS ANY KEY that becomes a pixel-bordered box of block dots, PLAYER 1 and STAGE readouts, and a slate cabinet bar with pixel power icons.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="37-shader.html">37 Shader</a>
            <span>A dark generated field of slow violet-to-pink neon rings drawn on a low-res canvas, with a full-width translucent strip holding a thin Lexend Giga clock, the user name and a pill password field, session/user picks on the left and power words on the right; the greeter state drives the shader&#x27;s speed, hue, blur and brightness, snapping red on error, amber on info and blowing out to white on success.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="38-profiles.html">38 Profiles</a>
            <span>A console-style &#x27;Who&#x27;s signing in?&#x27; gate: blurred wallpaper above a flat grey sheet of big colour-block profile tiles with a cyan selection frame that becomes a progress ring, a password step beside the chosen tile, and footer key hints.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="39-eink.html">39 E-Ink</a>
            <span>An e-paper book cover: the Literata Light clock as the title, the user as the author line, a hairline password rule with ink dots, small-caps power words along the bottom edge and the wallpaper as a 16-grey dithered plate, every state change a 150ms inversion flash.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="40-bevel.html">40 Bevel</a>
            <span>A late-90s grey bevelled logon dialog with a navy banner clock, pixel user picture and combo box over a desktop with a Power taskbar; wrong passwords pop a modal message box, info arrives as a tray balloon, and success closes the window and fades through black.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="41-handheld.html">41 Handheld</a>
            <span>Handheld-console two-column screen: square avatar, name and password circles on the left, a controller-glyph menu of session, user and power rows on the right, button hints and clock in a footer bar.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="42-material.html">42 Material</a>
            <span>Material-You tonal greeter: a palette sampled from the wallpaper tints a rounded surface card with floating-label field, segmented sessions, a wavy busy bar and a quiet power FAB under a big Rubik clock, and the scrim darkens itself on bright images.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="43-hud.html">43 Light HUD</a>
            <span>A bright sci-fi HUD: the wallpaper washed to white under hairline brackets and tick rulers, a thin clock inside a cyan seconds-arc gauge, a bracketed passphrase slot, a vertical session ruler with a pointer, and three hexagonal power buttons; busy clamps the slot, error flashes the lines orange-red with an AUTH FAILED stamp, info draws a callout from the slot, success retracts the lines and reveals the full wallpaper.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="44-blueprint.html">44 Blueprint</a>
            <span>A blueprint sheet where the password slot is a dimensioned part with drilled-hole dots, the clock is a stroked-numeral detail callout, sessions are a parts table, power sits in a revision table inside a full title block, and the states are drawn as a construction-line sweep, a red revision cloud, a numbered note and an APPROVED stamp.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="45-boarding.html">45 Boarding</a>
            <span>An off-white boarding pass with a punched perforation: SRN to NIR in giant condensed caps, the clock as boarding time, a security-code field whose barcode grows as you type, and power actions as gate tiles on the tear-off stub.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="46-neon.html">46 Neon</a>
            <span>A pink Beon tube clock and cyan script greeting on a glass plate hung over a dark brick wall tinted by the wallpaper, with a cyan neon outline for the password, unlit tube session labels, a red WRONG PASSWORD sign that buzzes on when the main sign sputters, and three neon power glyphs.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="47-polaroid.html">47 Polaroid</a>
            <span>Two instant photos on a plank table: the wallpaper in a tilted white frame with the user&#x27;s name in pen and the password as a handwritten line of ink dots, beside a kraft clock tag on twine, a yellow session sticky with a red tick, and three round power stickers.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="48-letter.html">48 Letter</a>
            <span>A typewritten letter on a dark wood desk: Courier Prime letterhead and body, x&#x27;s struck for each password character, a red margin rule, P.S. lines for power, red-pen &#x27;wrong password&#x27; with XXXX overtype on error, and a signed letter that folds into an addressed envelope on success.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="49-scope.html">49 Scope</a>
            <span>A phosphor oscilloscope: green graticule with the password as a glowing pulse train and ASCII bus cells, the clock drawn by the beam as vector numerals, CH1/CH2 channel readouts for user and session, and soft-key power labels on the bezel.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="50-topo.html">50 Topo</a>
            <span>A topographic sheet on cream paper: the user is a map pin whose label card holds the password, sessions are coloured routes to a summit, lake shore and hut, and the clock is written as coordinates in a legend with scale bar, north arrow and map-symbol power keys.</span></figcaption>
    </figure>
    <figure class="entry">
        <figcaption><a href="53-unlock-steady.html">53 Unlock Steady</a>
            <span>51 Unlock with one clock: the lock screen's 148px time and date stay put on both screens while the hint fades and the Breeze login rises in beneath them. Set aside for 54 Unlock Glide.</span></figcaption>
    </figure>
