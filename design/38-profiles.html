<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 38 Profiles</title>
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face {
    font-family: "Nunito";
    src: url("assets/fonts/Nunito-Variable.ttf") format("truetype");
    font-weight: 200 1000;
    font-style: normal;
}

.stage {
    --sheet: #ebebeb;
    --surface: #ffffff;
    --ink: #24262b;
    --ink-soft: #4a4d55;
    --muted: #7a7d85;
    --line: #d2d2d2;
    --select: #3fe0e8;
    --error: #e5413a;
    --error-text: #c9241f;
    --amber: #f2a516;
    background: #101215;
    color: var(--ink);
    font-family: "Nunito", var(--font-sans);
    font-feature-settings: "tnum" 1;
}

.wall,
.wall-blur {
    position: absolute;
    inset: 0;
}

.wall { background: var(--wallpaper) center / cover no-repeat; }

.wall-blur {
    background:
        linear-gradient(180deg, rgba(10, 12, 16, 0.42), rgba(10, 12, 16, 0.22) 46%, rgba(10, 12, 16, 0.42)),
        var(--wallpaper-blur) center / cover no-repeat;
    transition: opacity 1100ms ease 200ms;
}

.status {
    position: absolute;
    left: 160px;
    right: 160px;
    top: 52px;
    display: flex;
    align-items: center;
    color: #ffffff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 2px 14px rgba(0, 0, 0, 0.45);
}

.host {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.2px;
}

.host-mark {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.16);
    border: 1.5px solid rgba(255, 255, 255, 0.35);
}

.host-mark::before {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 4px;
    background: var(--select);
}

.when {
    margin-left: auto;
    display: flex;
    align-items: baseline;
    gap: 22px;
}

.when .date { font-size: 21px; font-weight: 600; color: rgba(255, 255, 255, 0.86); }
.when .time { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: 0.5px; }

.launch {
    position: absolute;
    left: 160px;
    bottom: 76px;
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 400ms ease, transform 400ms ease;
    pointer-events: none;
}

.launch::before {
    content: "";
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-top-color: var(--select);
    animation: spin 900ms linear infinite;
}

.sheet {
    position: absolute;
    left: 0;
    right: 0;
    top: 486px;
    bottom: 0;
    background: var(--sheet);
    transition: top 520ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 760ms cubic-bezier(0.6, 0, 0.8, 0.4);
}

.step-password .sheet { top: 446px; }

.head {
    position: absolute;
    left: 160px;
    right: 160px;
    top: 44px;
    display: flex;
    align-items: baseline;
}

.head h1 {
    font-size: 48px;
    line-height: 58px;
    font-weight: 800;
    letter-spacing: -0.6px;
    white-space: nowrap;
}

.head h1.is-new { animation: heading-in 260ms ease-out; }

.is-info .head h1::before {
    content: "";
    display: inline-block;
    width: 18px;
    height: 18px;
    margin: 0 20px 6px 4px;
    border-radius: 50%;
    background: var(--select);
    box-shadow: 0 0 0 6px rgba(63, 224, 232, 0.25);
    vertical-align: middle;
    animation: info-pulse 1600ms ease-in-out infinite;
}

.is-info .head h1 { color: #0f5f66; }

.head .count {
    margin-left: auto;
    font-size: 20px;
    font-weight: 700;
    color: var(--muted);
    transition: opacity 240ms;
}

.step-password .head .count { opacity: 0; }

.sub {
    position: absolute;
    left: 160px;
    right: 160px;
    top: 106px;
    height: 30px;
    display: flex;
    align-items: center;
    font-size: 21px;
    font-weight: 600;
    color: var(--muted);
}

.message:not(:empty) + .hint { display: none; }
.is-info .message { display: none; }
.is-info .message + .hint { display: inline; }

.is-error .sub { color: var(--error-text); font-weight: 800; }

.is-error .sub::before {
    content: "!";
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--error);
    color: #ffffff;
    font-size: 17px;
    font-weight: 900;
    margin-right: 10px;
}

.is-busy .sub { color: var(--ink-soft); }

.is-busy .sub::before {
    content: "";
    width: 18px;
    height: 18px;
    margin-right: 12px;
    border-radius: 50%;
    border: 3px solid rgba(36, 38, 43, 0.14);
    border-top-color: #12a9b1;
    animation: spin 900ms linear infinite;
}

.rule {
    position: absolute;
    left: 160px;
    right: 160px;
    top: 152px;
    height: 1px;
    background: var(--line);
}

.picker,
.unlock {
    position: absolute;
    left: 160px;
    right: 160px;
    top: 196px;
    transition: opacity 320ms ease, transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.picker { display: flex; gap: 44px; }

.step-password .picker {
    opacity: 0;
    transform: translateX(-40px);
    pointer-events: none;
}

.unlock {
    top: 208px;
    height: 262px;
    opacity: 0;
    transform: translateY(18px);
    pointer-events: none;
}

.step-password .unlock {
    opacity: 1;
    transform: none;
    pointer-events: auto;
}

.tile {
    position: relative;
    width: 224px;
    flex: none;
    text-align: left;
    transition: transform 200ms ease;
}

.tile-card {
    display: block;
    border-radius: 18px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06), 0 12px 28px rgba(30, 32, 40, 0.1);
}

.tile-face {
    position: relative;
    display: grid;
    place-items: center;
    height: 224px;
    overflow: hidden;
    background:
        radial-gradient(circle at 26% 18%, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 52%),
        var(--tile);
    color: #ffffff;
}

.tile-face::after {
    content: "";
    position: absolute;
    right: -70px;
    bottom: -90px;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    border: 30px solid rgba(255, 255, 255, 0.13);
}

.tile-initial {
    position: relative;
    z-index: 1;
    font-size: 132px;
    font-weight: 900;
    line-height: 1;
    margin-top: -8px;
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
}

.tile-name {
    display: block;
    height: 52px;
    padding: 0 18px;
    font-size: 22px;
    font-weight: 800;
    line-height: 52px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.tile.is-selected { transform: translateY(-4px); }
.tile:not(.is-selected) .tile-card { opacity: 0.86; }
.tile:not(.is-selected):hover .tile-card { opacity: 1; }

.frame {
    position: absolute;
    inset: -9px;
    width: calc(100% + 18px);
    height: calc(100% + 18px);
    overflow: visible;
    pointer-events: none;
    opacity: 0;
    filter: drop-shadow(0 0 6px rgba(63, 224, 232, 0.55));
    transition: opacity 160ms;
}

.frame rect {
    x: 1px;
    y: 1px;
    width: calc(100% - 2px);
    height: calc(100% - 2px);
    rx: 25px;
    fill: none;
    stroke: var(--select);
    stroke-width: 2px;
    transition: stroke 160ms;
}

.frame .run { stroke-dasharray: 100 0; stroke-linecap: round; }
.frame .track { opacity: 0; }
.tile.is-selected .frame,
.focus .frame { opacity: 1; }

.is-busy .focus .frame .track { opacity: 0.38; }
.is-busy .focus .frame .run {
    stroke-width: 4px;
    stroke-dasharray: 34 66;
    animation: ring-run 1100ms linear infinite;
}

.is-error .focus .frame { filter: drop-shadow(0 0 6px rgba(229, 65, 58, 0.45)); }
.is-error .focus .frame rect { stroke: var(--error); }
.is-error .focus .frame .run { stroke-width: 3px; }

.focus {
    position: absolute;
    left: 0;
    top: 0;
    width: 212px;
    transform-origin: 0 0;
    transform: scale(1.06);
    transition: transform 460ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.step-password .focus { transform: none; }

.focus .tile-face { height: 212px; }
.focus .tile-initial { font-size: 120px; }
.focus .tile-name { height: 50px; line-height: 50px; font-size: 21px; }
.focus .frame rect { rx: 24px; }

.entry {
    position: absolute;
    left: 260px;
    top: 0;
    bottom: 0;
    width: 680px;
}

.who {
    display: flex;
    align-items: center;
    gap: 18px;
    height: 48px;
}

.who-name {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: -0.4px;
    line-height: 1;
}

.chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 14px 0 10px;
    border-radius: 18px;
    background: rgba(36, 38, 43, 0.07);
    font-size: 17px;
    font-weight: 700;
    color: var(--ink-soft);
}

.chip i[data-icon] { width: 20px; height: 20px; }
.chip:hover { background: rgba(36, 38, 43, 0.12); color: var(--ink); }

.field-row {
    display: flex;
    gap: 14px;
    margin-top: 18px;
}

.field {
    flex: 1;
    height: 76px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 18px 0 26px;
    border-radius: 18px;
    background: var(--surface);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06), 0 10px 24px rgba(30, 32, 40, 0.07);
    outline: 2px solid transparent;
    outline-offset: 6px;
    transition: outline-color 160ms;
}

.field:focus-within { outline-color: var(--select); }
.is-error .field { outline-color: var(--error); }
.is-busy .field { outline-color: transparent; opacity: 0.7; }

.field input {
    flex: 1;
    min-width: 0;
    height: 100%;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--ink);
    caret-color: #12a9b1;
}

.field input[type="password"] { letter-spacing: 8px; }
.field input::placeholder { letter-spacing: 0; color: var(--muted); opacity: 0.8; font-weight: 600; }

.reveal {
    display: inline-flex;
    padding: 8px;
    border-radius: 10px;
    color: var(--muted);
}

.reveal:hover { color: var(--ink); background: rgba(36, 38, 43, 0.06); }

.ok {
    width: 76px;
    height: 76px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 18px;
    background: var(--ink);
    color: #ffffff;
    outline: 2px solid transparent;
    outline-offset: 6px;
}

.ok i[data-icon] { width: 30px; height: 30px; }
.ok:hover { outline-color: var(--select); }
.is-busy .ok { opacity: 0.45; }

.notes {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 24px;
    height: 34px;
    font-size: 18px;
    font-weight: 600;
    color: var(--muted);
    transition: opacity 200ms;
}

.capslock {
    display: inline-flex;
    align-items: center;
    height: 30px;
    padding: 0 12px;
    border-radius: 15px;
    background: var(--amber);
    color: #2a1d00;
    font-size: 16px;
    font-weight: 800;
}

.divider {
    position: absolute;
    left: 990px;
    top: 4px;
    bottom: 4px;
    width: 1px;
    background: var(--line);
}

.sessions {
    position: absolute;
    right: 0;
    top: 0;
    width: 580px;
}

.sessions-head {
    display: flex;
    align-items: center;
    height: 36px;
    font-size: 18px;
    font-weight: 700;
    color: var(--muted);
}

.sessions-head .chip { margin-left: auto; }
.sessions-head b { color: var(--ink); font-weight: 800; }

.session-row {
    display: flex;
    gap: 20px;
    margin-top: 16px;
}

.session-tile {
    width: 180px;
    height: 210px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    border-radius: 18px;
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06), 0 10px 24px rgba(30, 32, 40, 0.07);
    outline: 2px solid transparent;
    outline-offset: 6px;
    transition: outline-color 160ms, transform 200ms;
}

.session-tile svg {
    width: 64px;
    height: 64px;
    fill: none;
    stroke: currentColor;
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.session-tile span {
    font-size: 20px;
    font-weight: 800;
    white-space: nowrap;
}

.session-tile:not(.is-selected) { color: var(--ink-soft); }
.session-tile:not(.is-selected) svg { opacity: 0.7; }
.session-tile:hover { transform: translateY(-2px); }

.session-tile.is-selected {
    outline-color: var(--select);
    transform: translateY(-4px);
}

.footer {
    position: absolute;
    left: 160px;
    right: 160px;
    bottom: 0;
    height: 80px;
    display: flex;
    align-items: center;
    border-top: 1px solid var(--line);
}

.keys {
    display: flex;
    align-items: center;
    gap: 40px;
}

.key {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink-soft);
    transition: opacity 200ms;
}

.key kbd {
    font: inherit;
    min-width: 40px;
    height: 32px;
    padding: 0 10px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: var(--ink);
    color: #ffffff;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.3px;
}

.key.back { opacity: 0.38; }
.step-password .key.back { opacity: 1; }
.key.move { transition: opacity 200ms; }
.step-password .key.move { display: none; }

.power {
    margin-left: auto;
    display: flex;
    gap: 12px;
}

.power button {
    width: 50px;
    height: 50px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: var(--surface);
    color: var(--ink-soft);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06), 0 6px 14px rgba(30, 32, 40, 0.06);
    outline: 2px solid transparent;
    outline-offset: 4px;
}

.power button:hover { outline-color: var(--select); color: var(--ink); }
.power i[data-icon] { width: 26px; height: 26px; }

.is-busy .keys,
.is-busy .chip,
.is-busy .notes,
.is-busy .session-tile:not(.is-selected) {
    opacity: 0.4;
    pointer-events: none;
}

.is-busy .session-row,
.is-busy .picker { pointer-events: none; }

.is-error .sheet { animation: shake 380ms ease-in-out; }
.is-success .sheet { transform: translateY(105%); }
.is-success .wall-blur { opacity: 0; }
.is-success .launch { opacity: 1; transform: none; transition-delay: 600ms; }

@keyframes ring-run {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -100; }
}

@keyframes heading-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
}

@keyframes info-pulse {
    50% { box-shadow: 0 0 0 12px rgba(63, 224, 232, 0); }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="wall"></div>
    <div class="wall-blur"></div>

    <div class="status">
        <div class="host"><span class="host-mark"></span>seiren</div>
        <div class="when">
            <span class="date" data-clock="long"></span>
            <span class="time" data-clock="time"></span>
        </div>
    </div>

    <div class="launch" data-launch></div>

    <form class="sheet" data-login>
        <div class="head">
            <h1 data-heading>Who's signing in?</h1>
            <span class="count" data-count></span>
        </div>
        <p class="sub"><span class="message" data-message></span><span class="hint" data-hint></span></p>
        <div class="rule"></div>

        <div class="picker" data-picker></div>

        <div class="unlock">
            <div class="tile focus">
                <span class="tile-card">
                    <span class="tile-face" data-focus-face><span class="tile-initial" data-user-initial></span></span>
                    <span class="tile-name" data-user-name></span>
                </span>
                <svg class="frame"><rect class="track" pathLength="100"></rect><rect class="run" pathLength="100"></rect></svg>
            </div>

            <div class="entry">
                <div class="who">
                    <span class="who-name" data-user-name></span>
                    <button type="button" class="chip" data-action="switch-user" title="Switch user"><i data-icon="system-switch-user"></i>Switch</button>
                </div>
                <div class="field-row">
                    <label class="field">
                        <input data-field="password" type="password" placeholder="Password" autocomplete="off" aria-label="Password">
                        <button type="button" class="reveal" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
                    </label>
                    <button type="submit" class="ok" title="OK"><i data-icon="go-next"></i></button>
                </div>
                <div class="notes">
                    <span class="capslock" data-capslock>Caps Lock is on</span>
                </div>
            </div>

            <div class="divider"></div>

            <div class="sessions">
                <div class="sessions-head">
                    <span>Session&nbsp; <b data-session-name></b></span>
                    <button type="button" class="chip" data-action="session" title="Next session"><i data-icon="go-next"></i>Change</button>
                </div>
                <div class="session-row" data-session-row></div>
            </div>
        </div>

        <div class="footer">
            <div class="keys">
                <button type="button" class="key move" data-move><kbd>← →</kbd>Select</button>
                <button type="button" class="key back" data-back><kbd>Esc</kbd>Back</button>
                <button type="button" class="key" data-action="login"><kbd>Enter</kbd>OK</button>
            </div>
            <div class="power">
                <button type="button" data-power="suspend" title="Sleep"><i data-icon="system-suspend"></i></button>
                <button type="button" data-power="reboot" title="Restart"><i data-icon="system-reboot"></i></button>
                <button type="button" data-power="shutdown" title="Power off"><i data-icon="system-shutdown"></i></button>
            </div>
        </div>
    </form>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
<script>
const PROFILE_COLOURS = ["#ff5b3a", "#2e6bff", "#12b886", "#a855f7"];
const SESSION_GLYPHS = [
    '<svg viewBox="0 0 64 64"><rect x="6" y="14" width="12" height="36" rx="4"/><rect x="24" y="10" width="20" height="44" rx="5"/><rect x="50" y="14" width="12" height="36" rx="4"/></svg>',
    '<svg viewBox="0 0 64 64"><rect x="8" y="8" width="21" height="21" rx="5"/><rect x="35" y="8" width="21" height="21" rx="5"/><rect x="8" y="35" width="21" height="21" rx="5"/><rect x="35" y="35" width="21" height="21" rx="5"/></svg>',
    '<svg viewBox="0 0 64 64"><rect x="6" y="10" width="52" height="44" rx="8"/><path d="M18 26l8 6-8 6M32 40h14"/></svg>',
];
const HEADING_PICK = "Who's signing in?";
const HEADING_PASSWORD = "Enter your password";
const HINT_PICK = "Choose a profile to continue";
const HINT_PASSWORD = "Signing in to seiren";
const HINT_INFO_PICK = "Or choose a profile and use its password";
const HINT_INFO_PASSWORD = "Or type your password";
const ERROR_TEXT = "Wrong password.";

console.assert(USERS.length <= PROFILE_COLOURS.length, "more users than profile colours");
console.assert(SESSIONS.length === SESSION_GLYPHS.length, "one glyph per session");

const picker = document.querySelector("[data-picker]");
const session_row = document.querySelector("[data-session-row]");
const heading = document.querySelector("[data-heading]");
const hint = document.querySelector("[data-hint]");
const launch = document.querySelector("[data-launch]");
const focus_face = document.querySelector("[data-focus-face]");
let step = "pick";

function profiles_build() {
    picker.innerHTML = USERS.map((name, index) => `
        <button type="button" class="tile" data-tile="${index}" style="--tile:${PROFILE_COLOURS[index]}">
            <span class="tile-card">
                <span class="tile-face"><span class="tile-initial">${name[0].toUpperCase()}</span></span>
                <span class="tile-name">${name}</span>
            </span>
            <svg class="frame"><rect class="track" pathLength="100"></rect><rect class="run" pathLength="100"></rect></svg>
        </button>`).join("");
    session_row.innerHTML = SESSIONS.map((name, index) => `
        <button type="button" class="session-tile" data-session-tile="${index}">${SESSION_GLYPHS[index]}<span>${name.split(" ")[0]}</span></button>`).join("");
    text_set("[data-count]", `${USERS.length} profiles`);
}

function user_pick(index) {
    console.assert(index >= 0 && index < USERS.length, index);
    for (let guard = 0; guard < USERS.length && user_index !== index; guard += 1) user_next();
    console.assert(user_index === index);
    render();
}

function session_pick(index) {
    console.assert(index >= 0 && index < SESSIONS.length, index);
    for (let guard = 0; guard < SESSIONS.length && session_index !== index; guard += 1) session_next();
    console.assert(session_index === index);
    render();
}

function step_set(next) {
    console.assert(next === "pick" || next === "password", next);
    step = next;
    stage.classList.toggle("step-password", step === "password");
    if (step === "pick") field_password.value = "";
    field_password.focus();
    render();
}

function on_stage_class(records) {
    const was_success = records.some((record) => record.oldValue !== null && record.oldValue.includes("is-success"));
    const landed = was_success && !stage.classList.contains("is-success") && stage.classList.contains("is-idle");
    if (landed && step === "password") step_set("pick");
    else render();
}

function render() {
    if (step === "pick" && (stage.classList.contains("is-busy") || stage.classList.contains("is-error"))) {
        step = "password";
        stage.classList.add("step-password");
    }
    if (stage.classList.contains("is-error") && message.textContent !== ERROR_TEXT) message.textContent = ERROR_TEXT;
    const shows_message = stage.classList.contains("is-info") || stage.classList.contains("is-success");
    const title = shows_message ? message.textContent : step === "pick" ? HEADING_PICK : HEADING_PASSWORD;
    if (heading.textContent !== title) {
        heading.textContent = title;
        heading.classList.remove("is-new");
        void heading.offsetWidth;
        heading.classList.add("is-new");
    }
    if (stage.classList.contains("is-info")) hint.textContent = step === "pick" ? HINT_INFO_PICK : HINT_INFO_PASSWORD;
    else hint.textContent = step === "pick" ? HINT_PICK : HINT_PASSWORD;
    if (stage.classList.contains("is-success")) launch.textContent = message.textContent;
    for (const tile of picker.children) tile.classList.toggle("is-selected", Number(tile.dataset.tile) === user_index);
    for (const tile of session_row.children) tile.classList.toggle("is-selected", Number(tile.dataset.sessionTile) === session_index);
    focus_face.style.setProperty("--tile", PROFILE_COLOURS[user_index]);
}

function on_profile_click(event) {
    const tile = event.target.closest("[data-tile]");
    if (tile !== null) {
        const index = Number(tile.dataset.tile);
        if (index === user_index) step_set("password");
        else user_pick(index);
    }
    const session = event.target.closest("[data-session-tile]");
    if (session !== null) session_pick(Number(session.dataset.sessionTile));
    if (event.target.closest("[data-back]") !== null && step === "password") back();
    if (event.target.closest("[data-move]") !== null) user_pick((user_index + 1) % USERS.length);
    if (event.target.closest('[data-action="login"]') !== null && step === "pick") step_set("password");
    render();
}

function back() {
    if (stage.classList.contains("is-busy") || stage.classList.contains("is-success")) return;
    state_set("idle", "");
    step_set("pick");
}

function on_profile_key(event) {
    if (event.ctrlKey || event.altKey || event.metaKey) return;
    if (step === "password") {
        if (event.key === "Escape") {
            event.preventDefault();
            back();
        }
        return;
    }
    if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
        event.preventDefault();
        const offset = event.key === "ArrowRight" ? 1 : USERS.length - 1;
        user_pick((user_index + offset) % USERS.length);
        render();
        return;
    }
    if (event.key === "Enter") {
        event.preventDefault();
        step_set("password");
        return;
    }
    if (event.key.length === 1) {
        field_password.focus();
        step_set("password");
    }
}

profiles_build();
new MutationObserver(on_stage_class).observe(stage, { attributes: true, attributeFilter: ["class"], attributeOldValue: true });
new MutationObserver(render).observe(message, { childList: true, characterData: true, subtree: true });
document.addEventListener("click", on_profile_click);
document.addEventListener("keydown", on_profile_key, true);
render();
</script>
</body>
</html>
