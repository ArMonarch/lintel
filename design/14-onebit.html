<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 14 One Bit</title>
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face {
    font-family: "Departure Mono";
    src: url("assets/fonts/DepartureMono-Regular.woff2") format("woff2");
    font-style: normal;
}

.stage {
    --ink: #1a1a1a;
    --paper: #e8e4d8;
    --checker: conic-gradient(var(--ink) 25%, transparent 0 50%, var(--ink) 0 75%, transparent 0) 0 0 / 4px 4px;
    background: var(--ink);
    color: var(--ink);
    font: 22px/24px "Departure Mono", monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
    text-rendering: optimizeSpeed;
}

.stage.is-ink {
    --ink: #e8e4d8;
    --paper: #1a1a1a;
}

.glyph { display: inline-block; flex: none; width: 32px; height: 32px; }
.glyph svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
.glyph path { fill: currentColor; }

.bold { text-shadow: 1px 0 0 currentColor; letter-spacing: 1px; }

.photo {
    position: absolute;
    inset: 0;
    background: var(--wallpaper) center / cover no-repeat;
    visibility: hidden;
}

.is-success .photo { visibility: visible; }

.dither {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    image-rendering: pixelated;
}

.dither-fallback {
    position: absolute;
    inset: 0;
    background: var(--wallpaper) center / cover no-repeat;
    filter: grayscale(1) contrast(1.6);
}

.flash {
    position: absolute;
    inset: 0;
    z-index: 30;
    background: var(--paper);
    visibility: hidden;
}

.flash.is-on { visibility: visible; }

.menubar {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 40px;
    z-index: 20;
    display: flex;
    align-items: center;
    padding: 0 24px 0 20px;
    background: var(--paper);
    border-bottom: 2px solid var(--ink);
}

.menubar .logo { width: 32px; height: 32px; margin-right: 18px; }
.menubar .host { margin-right: 36px; }
.menubar .item { padding: 6px 14px; line-height: 24px; }
.menubar button.item:hover,
.menubar button.item:active { background: var(--ink); color: var(--paper); }

.menubar .status {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    visibility: hidden;
}

.is-success .menubar .status { visibility: visible; }

.menubar .clock { margin-left: auto; display: flex; align-items: center; gap: 0; }
.menubar .clock .time { padding: 6px 14px 6px 18px; }
.menubar .divider { width: 2px; height: 24px; margin: 0 6px; background: var(--checker); }

.window {
    position: absolute;
    left: 420px;
    top: 296px;
    width: 1080px;
    z-index: 10;
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
}

.titlebar {
    position: relative;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 2px solid var(--ink);
}

.titlebar::before {
    content: "";
    position: absolute;
    left: 6px;
    right: 6px;
    top: 8px;
    height: 22px;
    background: repeating-linear-gradient(to bottom, var(--ink) 0 2px, transparent 2px 4px);
    background-size: 100% 22px;
}

.titlebar .box {
    position: absolute;
    left: 22px;
    top: 8px;
    width: 26px;
    height: 22px;
    background: var(--paper);
    padding: 0 4px;
}

.titlebar .box::after {
    content: "";
    display: block;
    width: 18px;
    height: 18px;
    margin-top: 2px;
    border: 2px solid var(--ink);
}

.titlebar .title {
    position: relative;
    padding: 0 14px;
    background: var(--paper);
    line-height: 24px;
}

.body {
    display: flex;
    gap: 40px;
    padding: 30px 36px 32px;
}

.pane { width: 300px; flex: none; display: flex; flex-direction: column; }
.pane .label { margin-bottom: 10px; }

.list {
    flex: 1;
    display: flex;
    border: 2px solid var(--ink);
    min-height: 268px;
}

.users {
    flex: 1;
    min-width: 0;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.scroll {
    flex: none;
    width: 26px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-left: 2px solid var(--ink);
    background: var(--checker);
}

.scroll .glyph {
    width: 24px;
    height: 26px;
    padding: 4px;
    background: var(--paper);
}

.scroll .glyph:first-child { border-bottom: 2px solid var(--ink); }
.scroll .glyph:last-child { border-top: 2px solid var(--ink); }
.scroll .glyph:last-child svg { transform: scaleY(-1); }

.users button {
    display: flex;
    align-items: center;
    gap: 14px;
    height: 52px;
    padding: 0 12px;
    text-align: left;
}

.users button.is-current { background: var(--ink); color: var(--paper); }
.users button:not(.is-current):hover { background: var(--checker); }

.pane .count {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
}

.pane .count button { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }

form { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.welcome { line-height: 24px; }

.name {
    margin-top: 6px;
    font-size: 66px;
    line-height: 66px;
    text-shadow: 3px 0 0 currentColor;
    letter-spacing: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.session-row {
    position: relative;
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 16px;
}

.popup {
    position: relative;
    min-width: 300px;
    height: 40px;
    display: flex;
    align-items: center;
    padding: 0 44px 0 14px;
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    background: var(--paper);
    text-align: left;
}

.popup::after {
    content: "";
    position: absolute;
    right: 14px;
    top: 15px;
    border: 6px solid transparent;
    border-top: 6px solid var(--ink);
    border-bottom: 0;
}

.popup:active { background: var(--ink); color: var(--paper); }
.popup:active::after { border-top-color: var(--paper); }

.popwrap { position: relative; }

.menu {
    position: absolute;
    left: 0;
    top: 44px;
    z-index: 5;
    min-width: 300px;
    padding: 4px 0;
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    display: none;
}

.menu.is-open { display: block; }

.menu button {
    width: 100%;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 18px 0 8px;
    text-align: left;
}

.menu button:hover { background: var(--ink); color: var(--paper); }
.menu .glyph { visibility: hidden; }
.menu .is-current .glyph { visibility: visible; }

.password-label { margin-top: 24px; margin-bottom: 10px; }

.field {
    position: relative;
    display: block;
    height: 52px;
    border: 2px solid var(--ink);
    background: var(--paper);
    box-shadow: inset 2px 2px 0 var(--ink);
}

.field input {
    position: absolute;
    inset: 0;
    width: 100%;
    padding: 0 16px;
    color: transparent;
    caret-color: transparent;
    font: inherit;
}

.field input::selection { background: transparent; color: transparent; }

.blocks {
    position: absolute;
    left: 18px;
    right: 150px;
    top: 14px;
    height: 22px;
    display: flex;
    align-items: center;
    gap: 4px;
    overflow: hidden;
    white-space: pre;
    pointer-events: none;
}

.blocks i { flex: none; width: 12px; height: 20px; background: var(--ink); }

.blocks .caret {
    width: 4px;
    height: 24px;
    margin-left: 2px;
    visibility: hidden;
}

.field:focus-within .caret { visibility: visible; animation: blink 1060ms step-end infinite; }

@keyframes blink {
    50% { visibility: hidden; }
}

.capslock {
    position: absolute;
    right: 12px;
    top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
}

.capslock .glyph { width: 32px; height: 32px; }

.line {
    position: relative;
    height: 40px;
    margin-top: 12px;
    display: flex;
    align-items: center;
}

.is-busy .hint,
.is-error .hint,
.is-info .hint { visibility: hidden; }

.progress {
    position: absolute;
    left: 0;
    top: 6px;
    right: 0;
    display: flex;
    align-items: center;
    gap: 18px;
    visibility: hidden;
}

.is-busy .progress { visibility: visible; }

.bar {
    flex: 1;
    height: 28px;
    border: 2px solid var(--ink);
    padding: 2px;
    overflow: hidden;
}

.bar .fill { width: 100%; height: 100%; overflow: hidden; }
.bar svg { display: block; width: calc(100% + 32px); height: 100%; shape-rendering: crispEdges; }
.bar rect { fill: var(--ink); }
.is-busy .bar svg { animation: march 640ms steps(8) infinite; }

@keyframes march {
    from { transform: translateX(0); }
    to { transform: translateX(-16px); }
}

.actions {
    margin-top: 16px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 28px;
}

.plain {
    height: 40px;
    padding: 0 22px;
    border: 2px solid var(--ink);
    clip-path: polygon(2px 0, calc(100% - 2px) 0, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 0 calc(100% - 2px), 0 2px);
}

.plain:active,
.default:active .face { background: var(--ink); color: var(--paper); }

.default {
    position: relative;
    padding: 6px;
}

.default::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 4px solid var(--ink);
    clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
}

.default .face {
    display: block;
    height: 40px;
    min-width: 160px;
    padding: 0 26px;
    line-height: 36px;
    border: 2px solid var(--ink);
    clip-path: polygon(2px 0, calc(100% - 2px) 0, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 0 calc(100% - 2px), 0 2px);
}

.reveal i[data-icon] { display: none; }

.is-busy .default .face,
.is-busy .plain,
.is-busy .popup span,
.is-busy .users button:not(.is-current) span:not(.glyph),
.is-success .default .face {
    color: transparent;
    background: var(--checker);
    -webkit-background-clip: text;
    background-clip: text;
    text-shadow: none;
}


.alert {
    position: absolute;
    left: 660px;
    bottom: 724px;
    width: 600px;
    z-index: 15;
    display: none;
    padding: 6px;
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
}

.is-error .alert,
.is-info .alert { display: block; }

.is-error .window .titlebar::before,
.is-info .window .titlebar::before { display: none; }

.alert .inner {
    display: flex;
    gap: 24px;
    padding: 22px 24px 18px 22px;
    border: 2px solid var(--ink);
}

.alert .glyph { width: 64px; height: 64px; }
.alert .glyph-info { display: none; }
.is-info .alert .glyph-error { display: none; }
.is-info .alert .glyph-info { display: inline-block; }

.alert .text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.alert .title { line-height: 24px; }
.is-info .alert .title { display: none; }
.alert .message { margin-top: 10px; line-height: 26px; }
.is-info .alert .message { margin-top: 2px; text-shadow: 1px 0 0 currentColor; letter-spacing: 1px; }

.alert .ok { align-self: flex-end; margin-top: 12px; }
.alert .ok .face { min-width: 112px; }

.is-error .window { animation: jolt 480ms step-end; }

@keyframes jolt {
    0% { transform: translateX(-2px); }
    16% { transform: translateX(2px); }
    33% { transform: translateX(-2px); }
    50% { transform: translateX(2px); }
    66% { transform: translateX(-2px); }
    83% { transform: translateX(2px); }
    100% { transform: translateX(0); }
}

.palette {
    position: absolute;
    right: 40px;
    bottom: 40px;
    z-index: 10;
    width: 236px;
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
}

.palette .titlebar { height: 30px; }
.palette .titlebar::before { top: 6px; height: 18px; background-size: 100% 18px; }
.palette .titlebar .title { padding: 0 10px; }

.palette .tools {
    display: flex;
    justify-content: space-between;
    padding: 14px 16px 16px;
}

.palette button {
    width: 56px;
    height: 56px;
    display: grid;
    place-items: center;
    border: 2px solid var(--ink);
}

.palette button:hover,
.palette button:focus-visible { background: var(--ink); color: var(--paper); }

.is-success .window,
.is-success .alert,
.is-success .palette { visibility: hidden; }

.is-success .menubar { animation: menubar-leave 360ms steps(7) 1700ms forwards; }

@keyframes menubar-leave {
    to { transform: translateY(-42px); }
}

.is-success .menubar .clock,
.is-success .menubar .item { visibility: hidden; }
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="photo"></div>
    <canvas class="dither" width="960" height="540"></canvas>

    <div class="menubar">
        <span class="glyph logo" data-glyph="lintel"></span>
        <span class="host bold">seiren</span>
        <span class="status bold" data-message-copy></span>
        <div class="clock">
            <button class="item" data-action="theme" title="Invert"><span data-theme-name>Ink</span></button>
            <span class="divider"></span>
            <span class="item" data-clock="short"></span>
            <span class="time bold tabular" data-clock="time"></span>
        </div>
    </div>

    <div class="window">
        <div class="titlebar"><span class="box"></span><span class="title bold">Log In</span></div>
        <div class="body">
            <div class="pane">
                <div class="label">Users</div>
                <div class="list">
                    <div class="users" data-users></div>
                    <div class="scroll"><span class="glyph" data-glyph="arrow"></span><span class="glyph" data-glyph="arrow"></span></div>
                </div>
                <div class="count"><span data-user-count></span><button type="button" data-action="switch-user">Next</button></div>
            </div>

            <form data-login>
                <div class="welcome">Welcome back,</div>
                <div class="name" data-user-name></div>

                <div class="session-row">
                    <span>Session:</span>
                    <span class="popwrap">
                        <button type="button" class="popup" data-action="session"><span data-session-name></span></button>
                        <div class="menu" data-menu></div>
                    </span>
                </div>

                <div class="password-label">Password:</div>
                <label class="field">
                    <input data-field="password" type="password" aria-label="Password" autocomplete="off" spellcheck="false">
                    <span class="blocks" data-blocks></span>
                    <span class="capslock" data-capslock><span class="glyph" data-glyph="caps"></span>Caps</span>
                </label>

                <div class="line">
                    <span class="hint">Type your password, then press Return.</span>
                    <div class="progress">
                        <span data-message-copy></span>
                        <div class="bar"><div class="fill" data-stripes></div></div>
                    </div>
                </div>

                <div class="actions">
                    <button type="button" class="plain reveal" data-action="reveal"><i data-icon="view-visible"></i><span data-reveal-label>Show</span></button>
                    <button type="submit" class="default"><span class="face bold">Log in</span></button>
                </div>
            </form>
        </div>
    </div>

    <div class="alert" role="alert">
        <div class="inner">
            <span class="glyph glyph-error" data-glyph="alert"></span>
            <span class="glyph glyph-info" data-glyph="note"></span>
            <div class="text">
                <span class="title bold">Wrong password.</span>
                <span class="message" data-message></span>
                <button type="button" class="default ok" data-alert-ok><span class="face bold">OK</span></button>
            </div>
        </div>
    </div>

    <div class="palette">
        <div class="titlebar"><span class="title" data-palette-title>Power</span></div>
        <div class="tools">
            <button data-power="suspend" title="Sleep" data-label="Sleep"><span class="glyph" data-glyph="suspend"></span></button>
            <button data-power="reboot" title="Restart" data-label="Restart"><span class="glyph" data-glyph="reboot"></span></button>
            <button data-power="shutdown" title="Shut Down" data-label="Shut Down"><span class="glyph" data-glyph="shutdown"></span></button>
        </div>
    </div>

    <div class="flash"></div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>

    ],
    note: [
        "................",
        ".##############.",
        "################",
        "#######..#######",
        "#######..#######",
        "################",
        "######...#######",
        "#######..#######",
        "#######..#######",
        "#######..#######",
        "######....######",
        "################",
        ".##############.",
        ".....###........",
        "......##........",
        ".......#........",
    ],
};

const canvas = document.querySelector(".dither");
const context = canvas.getContext("2d", { willReadFrequently: true });
const flash = document.querySelector(".flash");
const menu = document.querySelector("[data-menu]");
const users = document.querySelector("[data-users]");
const blocks = document.querySelector("[data-blocks]");
const palette_title = document.querySelector("[data-palette-title]");
const reveal_label = document.querySelector("[data-reveal-label]");

let dither_pixels = null;
let dither_source = "";
let dither_timer = 0;
let dither_threshold = 0;
let menu_timer = 0;
let stage_state = "";

function glyph_svg(name) {
    const rows = GLYPHS[name];
    console.assert(rows !== undefined, `unknown glyph ${name}`);
    console.assert(rows.length === GLYPH_SIZE, name);
    let path = "";
    for (let y = 0; y < rows.length; y += 1) {
        console.assert(rows[y].length === GLYPH_SIZE, name, y);
        let x = 0;
        while (x < GLYPH_SIZE) {
            if (rows[y][x] !== "#") {
                x += 1;
                continue;
            }
            const start = x;
            while (x < GLYPH_SIZE && rows[y][x] === "#") x += 1;
            path += `M${start} ${y}h${x - start}v1h${start - x}z`;
        }
    }
    return `<svg viewBox="0 0 ${GLYPH_SIZE} ${GLYPH_SIZE}"><path d="${path}"/></svg>`;
}

function glyphs_paint(root) {
    for (const node of root.querySelectorAll("[data-glyph]")) node.innerHTML = glyph_svg(node.dataset.glyph);
}

function stripes_paint() {
    let rects = "";
    for (let y = 0; y < 12; y += 1) {
        for (let x = -12; x < 600; x += STRIPE_PERIOD) {
            rects += `<rect x="${x + y}" y="${y}" width="${STRIPE_PERIOD / 2}" height="1"/>`;
        }
    }
    const fill = document.querySelector("[data-stripes]");
    fill.innerHTML = `<svg viewBox="0 0 600 12" preserveAspectRatio="xMinYMin slice" style="width:1200px;height:24px">${rects}</svg>`;
}

function users_paint() {
    users.innerHTML = "";
    for (let index = 0; index < USERS.length; index += 1) {
        const row = document.createElement("button");
        row.type = "button";
        row.classList.toggle("is-current", index === user_index);
        row.innerHTML = `<span class="glyph" data-glyph="${index === 0 ? "user" : "guest"}"></span><span></span>`;
        row.lastChild.textContent = USERS[index];
        row.addEventListener("click", () => user_pick(index));
        users.append(row);
    }
    glyphs_paint(users);
    text_set("[data-user-count]", `${USERS.length} users`);
}

function user_pick(index) {
    console.assert(index >= 0 && index < USERS.length, index);
    if (stage.classList.contains("is-busy")) return;
    for (let guard = 0; guard < USERS.length && user_index !== index; guard += 1) user_next();
    console.assert(user_index === index);
}

function menu_paint() {
    menu.innerHTML = "";
    for (let index = 0; index < SESSIONS.length; index += 1) {
        const row = document.createElement("button");
        row.type = "button";
        row.classList.toggle("is-current", index === session_index);
        row.innerHTML = `<span class="glyph" data-glyph="check"></span><span></span>`;
        row.lastChild.textContent = SESSIONS[index];
        row.addEventListener("click", (event) => {
            event.stopPropagation();
            session_pick(index);
            menu_close();
        });
        menu.append(row);
    }
    glyphs_paint(menu);
}

function session_pick(index) {
    console.assert(index >= 0 && index < SESSIONS.length, index);
    for (let guard = 0; guard < SESSIONS.length && session_index !== index; guard += 1) session_next();
    console.assert(session_index === index);
    menu_paint();
}

function menu_open() {
    menu_paint();
    menu.classList.add("is-open");
    clearTimeout(menu_timer);
    menu_timer = setTimeout(menu_close, MENU_OPEN_MS);
}

function menu_close() {
    clearTimeout(menu_timer);
    menu.classList.remove("is-open");
}

function blocks_paint() {
    const value = field_password.value;
    const shown = Math.min(value.length, PASSWORD_BLOCKS_MAX);
    blocks.textContent = "";
    if (field_password.type === "text") {
        blocks.append(value.slice(value.length - shown));
    } else {
        for (let index = 0; index < shown; index += 1) blocks.append(document.createElement("i"));
    }
    const caret = document.createElement("i");
    caret.className = "caret";
    blocks.append(caret);
}

function dither_colours() {
    const style = getComputedStyle(stage);
    return [style.getPropertyValue("--ink").trim(), style.getPropertyValue("--paper").trim()];
}

function hex_rgb(hex) {
    console.assert(/^#[0-9a-f]{6}$/i.test(hex), hex);
    return [1, 3, 5].map((offset) => parseInt(hex.slice(offset, offset + 2), 16));
}

function dither_source_url() {
    const value = getComputedStyle(document.documentElement).getPropertyValue("--wallpaper");
    const match = /url\(["']?([^"')]+)["']?\)/.exec(value);
    return match === null ? "" : match[1];
}

function dither_load() {
    const url = dither_source_url();
    if (url === "" || url === dither_source) return;
    dither_source = url;
    const image = new Image();
    image.onload = () => {
        if (dither_source !== url) return;
        context.drawImage(image, 0, 0, DITHER_WIDTH, DITHER_HEIGHT);
        try {
            dither_pixels = context.getImageData(0, 0, DITHER_WIDTH, DITHER_HEIGHT);
        } catch {
            dither_pixels = null;
            dither_fallback();
            return;
        }
        dither_paint(dither_threshold);
    };
    image.onerror = () => dither_fallback();
    image.src = url;
}

function dither_fallback() {
    if (document.querySelector(".dither-fallback") !== null) return;
    const layer = document.createElement("div");
    layer.className = "dither-fallback";
    canvas.after(layer);
    canvas.hidden = true;
}

function dither_levels(source) {
    const histogram = new Uint32Array(256);
    for (let index = 0; index < source.length; index += 4) {
        const luma = (source[index] * 54 + source[index + 1] * 183 + source[index + 2] * 19) >> 8;
        histogram[luma] += 1;
    }
    const total = source.length / 4;
    let low = 0;
    let high = 255;
    for (let seen = 0; low < 255 && seen + histogram[low] < total * 0.02; low += 1) seen += histogram[low];
    for (let seen = 0; high > 0 && seen + histogram[high] < total * 0.02; high -= 1) seen += histogram[high];
    if (high - low < 32) return [0, 255];
    return [low, high];
}

function dither_paint(threshold) {
    console.assert(threshold >= 0 && threshold <= 64, threshold);
    dither_threshold = threshold;
    if (dither_pixels === null) return;
    const [ink, paper] = dither_colours().map(hex_rgb);
    const source = dither_pixels.data;
    const [low, high] = dither_levels(source);
    const output = context.createImageData(DITHER_WIDTH, DITHER_HEIGHT);
    const target = output.data;
    for (let y = 0; y < DITHER_HEIGHT; y += 1) {
        for (let x = 0; x < DITHER_WIDTH; x += 1) {
            const index = (y * DITHER_WIDTH + x) * 4;
            const order = BAYER[(y & 7) * 8 + (x & 7)];
            const luma = (source[index] * 54 + source[index + 1] * 183 + source[index + 2] * 19) >> 8;
            const level = Math.min(1, Math.max(0, (luma - low) / (high - low)));
            const colour = level > (order + 0.5) / 64 ? paper : ink;
            target[index] = colour[0];
            target[index + 1] = colour[1];
            target[index + 2] = colour[2];
            target[index + 3] = order < threshold ? 0 : 255;
        }
    }
    context.putImageData(output, 0, 0);
}

function dissolve_run() {
    clearTimeout(dither_timer);
    flash.classList.add("is-on");
    let step = 0;
    const next = () => {
        flash.classList.remove("is-on");
        step += 1;
        dither_paint(Math.min(64, step * (64 / DISSOLVE_STEPS)));
        if (step < DISSOLVE_STEPS) dither_timer = setTimeout(next, DISSOLVE_STEP_MS);
    };
    dither_timer = setTimeout(next, FLASH_MS);
}

function dissolve_reset() {
    clearTimeout(dither_timer);
    flash.classList.remove("is-on");
    dither_paint(0);
}

function state_current() {
    return STATES.find((each) => stage.classList.contains(`is-${each}`)) ?? "idle";
}

function on_stage_change() {
    const state = state_current();
    const ink = stage.classList.contains("is-ink") ? "ink" : "paper";
    const key = `${state}/${ink}`;
    if (key === stage_state) return;
    const was = stage_state.split("/")[0];
    const was_ink = stage_state.split("/")[1];
    stage_state = key;
    blocks_paint();
    if (state === "success" && was !== "success") dissolve_run();
    else if (state !== "success" && was === "success") dissolve_reset();
    else if (ink !== was_ink) dither_paint(state === "success" ? 64 : 0);
    if (state !== "idle") menu_close();
}

function message_mirror() {
    text_set("[data-message-copy]", message.textContent);
}

function on_after_click(event) {
    if (event.target.closest('[data-action="session"]') !== null) menu_open();
    else if (event.target.closest("[data-menu]") === null) menu_close();
    if (event.target.closest('[data-action="reveal"]') !== null) {
        reveal_label.textContent = field_password.type === "text" ? "Hide" : "Show";
        blocks_paint();
    }
    users_paint();
}

for (const button of document.querySelectorAll(".palette button")) {
    button.addEventListener("mouseenter", () => { palette_title.textContent = button.dataset.label; });
    button.addEventListener("mouseleave", () => { palette_title.textContent = "Power"; });
}

function alert_close() {
    state_set("idle", "");
    field_password.focus();
}

function on_alert_key(event) {
    if (event.ctrlKey || event.altKey || event.metaKey) return;
    if (event.key !== "Enter" && event.key !== "Escape") return;
    if (!stage.classList.contains("is-error") && !stage.classList.contains("is-info")) return;
    if (event.key === "Enter" && field_password.value.length > 0) return;
    event.preventDefault();
    alert_close();
}

document.querySelector("[data-alert-ok]").addEventListener("click", alert_close);
document.addEventListener("keydown", on_alert_key);

field_password.addEventListener("input", blocks_paint);
field_password.addEventListener("focus", blocks_paint);
document.addEventListener("click", on_after_click);
new MutationObserver(on_stage_change).observe(stage, { attributes: true, attributeFilter: ["class"] });
new MutationObserver(message_mirror).observe(message, { childList: true, characterData: true, subtree: true });
new MutationObserver(dither_load).observe(document.documentElement, { attributes: true, attributeFilter: ["style"] });
new MutationObserver(users_paint).observe(document.querySelector(".name"), { childList: true, characterData: true, subtree: true });

glyphs_paint(document);
stripes_paint();
users_paint();
menu_paint();
blocks_paint();
message_mirror();
on_stage_change();
dither_load();
</script>
</body>
</html>
