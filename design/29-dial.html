<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 29 Dial</title>
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/IBMPlexSans-ExtraLight.otf") format("opentype"); font-weight: 200; }
@font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/IBMPlexSans-Light.otf") format("opentype"); font-weight: 300; }
@font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/IBMPlexSans-Regular.otf") format("opentype"); font-weight: 400; }
@font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-Regular.otf") format("opentype"); font-weight: 400; }
@font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-Medium.otf") format("opentype"); font-weight: 500; }

.stage {
    --graphite: #1e1f22;
    --graphite-deep: #121315;
    --cream: #ede6d6;
    --cream-dim: rgba(237, 230, 214, 0.56);
    --cream-faint: rgba(237, 230, 214, 0.3);
    --orange: #ff6a2b;
    --mono: "IBM Plex Mono", "Adwaita Mono", monospace;
    font-family: "IBM Plex Sans", var(--font-sans);
    color: var(--cream);
    background: var(--graphite-deep) var(--wallpaper) center / cover no-repeat;
}

.dim {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse 900px 420px at 50% 100%, rgba(10, 10, 12, 0.7), transparent 75%),
        radial-gradient(ellipse 760px 360px at 50% 46%, rgba(10, 10, 12, 0.42), transparent 80%),
        linear-gradient(180deg, rgba(14, 15, 17, 0.5) 0%, rgba(14, 15, 17, 0.62) 45%, rgba(12, 13, 15, 0.9) 78%, rgba(10, 11, 12, 0.97) 100%);
}

.head {
    position: absolute;
    left: 0;
    right: 0;
    top: 92px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.clock {
    font-size: 184px;
    font-weight: 200;
    line-height: 1;
    letter-spacing: -4px;
    font-feature-settings: "tnum" 1;
}

.date {
    margin-top: 18px;
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--cream-dim);
}

form {
    position: absolute;
    left: 710px;
    top: 398px;
    width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 500ms, transform 700ms cubic-bezier(0.2, 0.8, 0.3, 1);
}

.who {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 2px 12px;
    border-radius: 6px;
    font-size: 40px;
    font-weight: 300;
    line-height: 1.2;
    transition: background 150ms;
}

.who i[data-icon] { position: absolute; left: calc(100% + 4px); top: calc(50% - 11px); width: 22px; height: 22px; opacity: 0.55; transition: opacity 150ms; }
.who:hover { background: rgba(237, 230, 214, 0.06); }
.who:hover i[data-icon] { opacity: 0.9; }

.slot {
    position: relative;
    width: 100%;
    margin-top: 30px;
}

.label {
    height: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--cream-faint);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
    transition: opacity 200ms;
}

.capslock { color: var(--cream); }

.field {
    margin-top: 8px;
    height: 58px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px 0 20px;
    border-radius: 4px;
    border: 1px solid rgba(237, 230, 214, 0.18);
    background: rgba(18, 19, 21, 0.62);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45);
    transition: border-color 200ms, opacity 300ms;
}

.field:focus-within { border-color: rgba(237, 230, 214, 0.5); }

.field input {
    flex: 1;
    min-width: 0;
    height: 100%;
    font-size: 22px;
    letter-spacing: 5px;
    caret-color: var(--cream);
}

.reveal {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 4px;
    color: var(--cream-faint);
    transition: color 150ms;
}

.reveal:hover { color: var(--cream); }

.message {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 20px);
    text-align: center;
    font-size: 17px;
    color: var(--cream-dim);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
    transition: color 200ms;
}

.is-busy .field { opacity: 0.55; }
.is-busy .rim-label { color: var(--cream-faint); }
.is-busy .pointer .body { animation: pointer-pulse 680ms ease-in-out infinite alternate; }
.is-error .message { color: var(--orange); }
.is-error .field {
    border-color: var(--orange);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 106, 43, 0.28), 0 0 24px rgba(255, 106, 43, 0.18);
}

@keyframes pointer-pulse {
    from { opacity: 1; }
    to { opacity: 0.38; }
}

.is-info .label { opacity: 0; }
.is-info .message::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    margin: 0 12px 1px 0;
    border-radius: 50%;
    border: 1.5px solid var(--cream);
    animation: beacon 1600ms ease-in-out infinite;
}

@keyframes beacon {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
}

.is-info .field { border-color: rgba(237, 230, 214, 0.42); }
.is-info .message {
    top: -6px;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.08em;
    color: var(--cream);
}

.is-success .field,
.is-success .label { opacity: 0; }
.is-success .message {
    top: 32px;
    font-size: 24px;
    font-weight: 300;
    color: var(--cream);
}

.plate {
    position: absolute;
    bottom: 56px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: opacity 400ms;
}

.plate small {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--cream-faint);
}

.plate .value { font-size: 20px; font-weight: 300; color: var(--cream); }
.plate.left { left: 72px; align-items: flex-start; }
.plate.right { right: 72px; align-items: flex-end; text-align: right; }
.plate button { text-align: left; display: flex; flex-direction: column; gap: 6px; }
.plate button .value { display: inline-flex; align-items: center; gap: 10px; }
.plate button .value::after { content: "›"; color: var(--cream-faint); }
.plate button:hover .value::after { color: var(--cream); }

.mount {
    position: absolute;
    left: 610px;
    top: 712px;
    width: 700px;
    height: 700px;
    transition: transform 800ms cubic-bezier(0.2, 0.8, 0.3, 1);
}

.well {
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    background: #0b0c0d;
    box-shadow:
        0 -30px 90px rgba(0, 0, 0, 0.6),
        0 -1px 0 rgba(237, 230, 214, 0.08),
        inset 0 6px 14px rgba(0, 0, 0, 0.9);
}

.rattle {
    position: absolute;
    inset: 0;
    border-radius: 50%;
}

.turn {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    transition: transform 400ms cubic-bezier(0.3, 1.4, 0.5, 1);
}

.knurl {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
        repeating-conic-gradient(#2b2d31 0deg 0.9deg, #5d6066 0.9deg 1.4deg, #2b2d31 1.4deg 2deg);
}

.bevel {
    position: absolute;
    inset: 9px;
    border-radius: 50%;
    background:
        conic-gradient(from 0deg,
            #d9dbde 0deg, #8d9096 22deg, #5b5e64 52deg, #3a3c41 90deg, #2c2e32 140deg,
            #24262a 180deg, #2c2e32 220deg, #3a3c41 270deg, #5b5e64 308deg, #8d9096 338deg, #d9dbde 360deg);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
    -webkit-mask: radial-gradient(circle, transparent 323.5px, #000 324px);
    mask: radial-gradient(circle, transparent 323.5px, #000 324px);
    pointer-events: none;
}

.bevel::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-radial-gradient(circle, rgba(255, 255, 255, 0.07) 0 1px, rgba(0, 0, 0, 0.08) 1px 2px, transparent 2px 3px);
}

.face {
    position: absolute;
    inset: 26px;
    border-radius: 50%;
    background: var(--graphite);
}

.marks {
    position: absolute;
    inset: 0;
    width: 700px;
    height: 700px;
    overflow: visible;
}

.marks .tick { stroke: var(--cream); stroke-linecap: round; }
.marks .tick.minor { stroke-width: 1.2; opacity: 0.32; }
.marks .tick.half { stroke-width: 0.9; opacity: 0.16; }
.marks .tick.major { stroke-width: 2.6; opacity: 0.92; }
.marks .arc { fill: none; stroke: var(--cream); stroke-width: 1; opacity: 0.26; }
.marks .end { stroke: var(--cream); stroke-width: 1; opacity: 0.26; }
.marks .legend { fill: var(--cream); opacity: 0.42; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.34em; }
.marks .seat { fill: var(--cream); opacity: 0; transition: opacity 200ms; }
.marks .seat.is-current { opacity: 0.9; }

.rim-label {
    position: absolute;
    left: 350px;
    top: 350px;
    height: 24px;
    padding: 0 8px;
    margin: -12px 0 0;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    line-height: 24px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--cream-dim);
    transform: translateX(-50%) rotate(var(--a)) translateY(-282px);
    transform-origin: 50% 50%;
    transition: color 200ms;
}

.rim-label:hover,
.rim-label.is-current,
.rim-label.is-pointed { color: var(--cream); }

.hub {
    position: absolute;
    left: 240px;
    top: 240px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background:
        radial-gradient(circle at 50% 50%, #1a1b1e 0 30px, transparent 31px),
        repeating-radial-gradient(circle, #2a2c30 0 1px, #222326 1px 2.5px),
        #25272a;
    box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.7),
        0 0 0 6px #18191b,
        0 0 0 7px rgba(237, 230, 214, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    pointer-events: none;
}

.hub::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255, 255, 255, 0.16), transparent 50deg, transparent 130deg, rgba(255, 255, 255, 0.08) 180deg, transparent 230deg, transparent 310deg, rgba(255, 255, 255, 0.16));
}

.light {
    position: absolute;
    inset: 26px;
    border-radius: 50%;
    pointer-events: none;
    background:
        linear-gradient(180deg, transparent 31%, rgba(8, 9, 10, 0.55) 41%, rgba(8, 9, 10, 0.97) 49%, #08090a 56%),
        radial-gradient(ellipse 72% 44% at 50% 4%, rgba(255, 255, 255, 0.075), transparent 70%);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.7), inset 0 10px 26px rgba(0, 0, 0, 0.55);
}

.pointer {
    position: absolute;
    left: 336px;
    top: -26px;
    width: 28px;
    height: 92px;
    transform-origin: 14px 11px;
    filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.7));
    pointer-events: none;
}

.pointer .body { fill: var(--orange); }
.pointer .pivot { fill: var(--graphite); }
.pointer .index { stroke: var(--orange); stroke-width: 1.5; stroke-linecap: round; }

@keyframes pawl {
    0% { transform: rotate(0deg); }
    35% { transform: rotate(-7deg); }
    100% { transform: rotate(0deg); }
}

@keyframes rattle {
    0% { transform: rotate(0deg); }
    10% { transform: rotate(-4deg); }
    22% { transform: rotate(3.4deg); }
    34% { transform: rotate(-2.8deg); }
    46% { transform: rotate(2.2deg); }
    58% { transform: rotate(-1.5deg); }
    70% { transform: rotate(1deg); }
    84% { transform: rotate(-0.4deg); }
    100% { transform: rotate(0deg); }
}

.is-error .rattle { animation: rattle 620ms linear; }

.is-success .mount {
    transform: translateY(470px);
    transition: transform 1100ms cubic-bezier(0.55, 0, 0.8, 0.35) 650ms;
}

.is-success .plate { opacity: 0; }
.is-success form { transform: translateY(56px); }
</style>

<div class="stage" data-stage>
    <div class="dim"></div>

    <div class="head">
        <div class="clock" data-clock="time"></div>
        <div class="date" data-clock="long"></div>
    </div>

    <form data-login>
        <button type="button" class="who" data-action="switch-user" title="Switch user">
            <span data-user-name></span><i data-icon="system-switch-user"></i>
        </button>
        <div class="slot">
            <div class="label"><span>Password</span><span class="capslock" data-capslock>Caps lock</span></div>
            <label class="field">
                <input data-field="password" type="password" aria-label="Password">
                <button type="button" class="reveal" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
            </label>
            <div class="message" data-message></div>
        </div>
    </form>

    <div class="plate left">
        <button type="button" data-action="session" title="Next session">
            <small>Session</small>
            <span class="value" data-session-name></span>
        </button>
    </div>

    <div class="plate right">
        <small>Host</small>
        <span class="value">seiren</span>
    </div>

    <div class="mount" data-dial-mount>
        <div class="well"></div>
        <div class="rattle">
            <div class="turn" data-dial-turn>
                <div class="knurl"></div>
                <div class="face"></div>
                <svg class="marks" data-dial-marks viewBox="-350 -350 700 700"></svg>
                <button type="button" class="rim-label" data-power="suspend">Sleep</button>
                <button type="button" class="rim-label" data-power="reboot">Restart</button>
                <button type="button" class="rim-label" data-power="shutdown">Power off</button>
            </div>
        </div>
        <div class="bevel"></div>
        <div class="hub"></div>
        <div class="light"></div>
        <svg class="pointer" data-dial-pointer viewBox="0 0 28 92">
            <path class="body" d="M14 1 a10 10 0 0 1 10 10 c0 4 -1.6 7 -3.4 10 L14 58 L7.4 21 C5.6 18 4 15 4 11 a10 10 0 0 1 10 -10 z"/>
            <circle class="pivot" cx="14" cy="11" r="3.2"/>
            <line class="index" x1="14" y1="58" x2="14" y2="82"/>
        </svg>
    </div>
</div>

<script>
const DIAL_PITCH = 36;
const DIAL_GROUP_GAP = 60;
const DIAL_DETENT = 6;
const DIAL_ITEMS_MAX = 12;
const DIAL_LABEL_RADIUS = 282;
const DIAL_FACE_RADIUS = 324;
const DIAL_STEP_MS = 42;
const DIAL_RATCHET_MS = 340;
const DIAL_SPIN_TURNS = 3;
const DIAL_WHEEL_MS = 180;
const SVG_NS = "http://www.w3.org/2000/svg";

const dial_mount = document.querySelector("[data-dial-mount]");
const dial_turn_node = document.querySelector("[data-dial-turn]");
const dial_marks = document.querySelector("[data-dial-marks]");
const dial_pointer = document.querySelector("[data-dial-pointer]");
const dial_items = [];
let dial_angle = 0;
let dial_selected = 0;
let dial_state = "idle";
let dial_ratchet = 0;
let dial_wheel_at = 0;

function dial_build() {
    const power = [...dial_turn_node.querySelectorAll("[data-power]")];
    const groups = [
        { name: "user", items: USERS.map((text, index) => ({ kind: "user", index, text })) },
        { name: "session", items: SESSIONS.map((text, index) => ({ kind: "session", index, text: text.split(" (")[0] })) },
        { name: "power", items: power.map((node, index) => ({ kind: "power", index, node })) },
    ];
    let angle = 0;
    for (const group of groups) {
        const first = angle;
        for (const item of group.items) {
            item.angle = angle;
            if (item.node === undefined) {
                item.node = document.createElement("button");
                item.node.type = "button";
                item.node.className = "rim-label";
                item.node.textContent = item.text;
                dial_turn_node.insertBefore(item.node, power[0]);
            }
            item.node.style.setProperty("--a", `${angle}deg`);
            item.node.dataset.dialItem = String(dial_items.length);
            dial_items.push(item);
            angle += DIAL_PITCH;
        }
        const last = angle - DIAL_PITCH;
        dial_group_draw(group.name, first, last);
        angle += DIAL_GROUP_GAP - DIAL_PITCH;
    }
    console.assert(angle === 360, `dial does not close: ${angle}`);
    console.assert(dial_items.length <= DIAL_ITEMS_MAX, dial_items.length);
    dial_ticks_draw();
}

function polar(radius, angle) {
    const radians = (angle - 90) * Math.PI / 180;
    return [radius * Math.cos(radians), radius * Math.sin(radians)];
}

function svg_add(tag, attributes) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
    dial_marks.appendChild(node);
    return node;
}

function dial_ticks_draw() {
    const majors = new Set(dial_items.map((item) => item.angle));
    for (let angle = 0; angle < 360; angle += DIAL_DETENT / 2) {
        let kind = "half";
        let length = 5;
        if (majors.has(angle)) {
            kind = "major";
            length = 24;
        } else if (angle % DIAL_DETENT === 0) {
            kind = "minor";
            length = 11;
        }
        const [x1, y1] = polar(DIAL_FACE_RADIUS - 2, angle);
        const [x2, y2] = polar(DIAL_FACE_RADIUS - 2 - length, angle);
        svg_add("line", { class: `tick ${kind}`, x1, y1, x2, y2 });
    }
    for (const item of dial_items) {
        if (item.kind === "power") continue;
        const [cx, cy] = polar(DIAL_LABEL_RADIUS - 24, item.angle);
        item.seat = svg_add("circle", { class: "seat", cx, cy, r: 2.6 });
    }
}

function dial_group_draw(name, first, last) {
    const radius_arc = 226;
    const radius_text = 206;
    const from = first - 13;
    const to = last + 13;
    const [ax, ay] = polar(radius_arc, from);
    const [bx, by] = polar(radius_arc, to);
    const large = to - from > 180 ? 1 : 0;
    svg_add("path", { class: "arc", d: `M${ax} ${ay} A${radius_arc} ${radius_arc} 0 ${large} 1 ${bx} ${by}` });
    for (const angle of [from, to]) {
        const [x1, y1] = polar(radius_arc, angle);
        const [x2, y2] = polar(radius_arc + 7, angle);
        svg_add("line", { class: "end", x1, y1, x2, y2 });
    }
    const middle = (first + last) / 2;
    const [tx, ty] = polar(radius_text, middle - 40);
    const [ux, uy] = polar(radius_text, middle + 40);
    const id = `dial-legend-${name}`;
    svg_add("path", { id, d: `M${tx} ${ty} A${radius_text} ${radius_text} 0 0 1 ${ux} ${uy}`, fill: "none" });
    const text = svg_add("text", { class: "legend", "text-anchor": "middle", dy: "4" });
    const path = document.createElementNS(SVG_NS, "textPath");
    path.setAttribute("href", `#${id}`);
    path.setAttribute("startOffset", "50%");
    path.textContent = name.toUpperCase();
    text.appendChild(path);
}

function angle_wrap(delta) {
    let wrapped = ((delta % 360) + 360) % 360;
    if (wrapped > 180) wrapped -= 360;
    return wrapped;
}

function dial_apply(transition) {
    dial_turn_node.style.transition = transition;
    dial_turn_node.style.transform = `rotate(${dial_angle}deg)`;
}

function dial_pawl(count, step_ms) {
    dial_pointer.style.animation = "none";
    void dial_pointer.getBoundingClientRect();
    dial_pointer.style.animation = `pawl ${step_ms}ms ease-out ${count}`;
}

function dial_goal() {
    return dial_angle + angle_wrap(-dial_items[dial_selected].angle - dial_angle);
}

function dial_select(item_index) {
    console.assert(item_index >= 0 && item_index < dial_items.length, item_index);
    dial_items[dial_selected].node.classList.remove("is-pointed");
    dial_selected = item_index;
    dial_items[dial_selected].node.classList.add("is-pointed");
    if (dial_state === "busy" || dial_state === "success") return;
    const goal = dial_goal();
    const steps = Math.round(Math.abs(goal - dial_angle) / DIAL_DETENT);
    if (steps === 0) return;
    dial_angle = goal;
    dial_apply(`transform ${steps * DIAL_STEP_MS}ms steps(${steps}, end)`);
    dial_pawl(steps, DIAL_STEP_MS);
}

function dial_find(kind, index) {
    const found = dial_items.findIndex((item) => item.kind === kind && item.index === index);
    console.assert(found !== -1, kind, index);
    return found;
}

function dial_marks_update() {
    for (const item of dial_items) {
        let current = false;
        if (item.kind === "user") current = item.index === user_index;
        if (item.kind === "session") current = item.index === session_index;
        item.node.classList.toggle("is-current", current);
        if (item.seat !== undefined) item.seat.classList.toggle("is-current", current);
    }
}

function dial_ratchet_step() {
    dial_angle += DIAL_DETENT;
    dial_apply("transform 150ms cubic-bezier(0.3, 1.8, 0.5, 1)");
    dial_pawl(1, 220);
}

function stage_state() {
    for (const state of STATES) if (stage.classList.contains(`is-${state}`)) return state;
    return "idle";
}

function dial_on_state() {
    const state = stage_state();
    const previous = dial_state;
    if (state === previous && state !== "error") return;
    dial_state = state;
    clearInterval(dial_ratchet);
    dial_ratchet = 0;
    if (state === "busy") {
        dial_ratchet_step();
        dial_ratchet = setInterval(dial_ratchet_step, DIAL_RATCHET_MS);
        return;
    }
    if (state === "success") {
        dial_angle = dial_goal() + 360 * DIAL_SPIN_TURNS;
        dial_apply("transform 2600ms cubic-bezier(0.12, 0.6, 0.2, 1)");
        return;
    }
    if (previous === "success") {
        dial_angle = -dial_items[dial_selected].angle;
        dial_apply("none");
        return;
    }
    if (state === "error") {
        dial_angle = dial_goal();
        dial_apply("transform 640ms cubic-bezier(0.3, 1.5, 0.5, 1)");
        return;
    }
    const goal = dial_goal();
    if (goal !== dial_angle) {
        dial_angle = goal;
        dial_apply("transform 500ms cubic-bezier(0.3, 1.4, 0.5, 1)");
    }
}

function dial_pick(item_index) {
    const item = dial_items[item_index];
    if (item.kind === "user") while (user_index !== item.index) user_next();
    if (item.kind === "session") while (session_index !== item.index) session_next();
    dial_marks_update();
    dial_select(item_index);
}

function dial_on_click(event) {
    const label = event.target.closest("[data-dial-item]");
    if (label !== null) {
        dial_pick(Number(label.dataset.dialItem));
        return;
    }
    const action = event.target.closest('[data-action="session"], [data-action="switch-user"]');
    if (action === null) return;
    dial_marks_update();
    if (action.dataset.action === "session") dial_select(dial_find("session", session_index));
    else dial_select(dial_find("user", user_index));
}

function dial_on_wheel(event) {
    event.preventDefault();
    if (dial_state === "busy" || dial_state === "success") return;
    if (event.deltaY === 0) return;
    const now = performance.now();
    if (now - dial_wheel_at < DIAL_WHEEL_MS) return;
    dial_wheel_at = now;
    const offset = event.deltaY > 0 ? 1 : -1;
    dial_pick((dial_selected + offset + dial_items.length) % dial_items.length);
}

dial_build();
dial_marks_update();
dial_select(dial_find("user", user_index));
dial_apply("none");
document.addEventListener("click", dial_on_click);
dial_mount.addEventListener("wheel", dial_on_wheel, { passive: false });
new MutationObserver(dial_on_state).observe(stage, { attributes: true, attributeFilter: ["class"] });
</script>
</body>
</html>
