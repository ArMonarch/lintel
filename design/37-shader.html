<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 37 Shader</title>
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face {
    font-family: "Lexend Giga";
    src: url("assets/fonts/LexendGiga-Thin.ttf") format("truetype");
    font-weight: 100;
}

@font-face {
    font-family: "Lexend Deca";
    src: url("assets/fonts/LexendDeca-ExtraLight.ttf") format("truetype");
    font-weight: 200;
}

@font-face {
    font-family: "Lexend Deca";
    src: url("assets/fonts/LexendDeca-Light.ttf") format("truetype");
    font-weight: 300;
}

@font-face {
    font-family: "Lexend Deca";
    src: url("assets/fonts/LexendDeca-Regular.ttf") format("truetype");
    font-weight: 400;
}

.stage {
    --text: #f4f0ff;
    --dim: rgba(244, 240, 255, 0.5);
    --faint: rgba(244, 240, 255, 0.28);
    --accent: 172 107 234;
    --red: #ff5a6a;
    --amber: #ffcf8a;
    background: #05030c;
    color: var(--text);
    font-family: "Lexend Deca", var(--font-sans);
    font-weight: 300;
}

.field-canvas {
    position: absolute;
    left: -40px;
    top: -40px;
    width: 2000px;
    height: 1160px;
    image-rendering: auto;
}

.vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 80% at 50% 50%, transparent 55%, rgba(3, 2, 10, 0.7) 100%);
    pointer-events: none;
    transition: opacity 900ms;
}

.strip {
    position: absolute;
    left: 0;
    right: 0;
    top: 440px;
    height: 200px;
    background: rgba(5, 3, 14, 0.58);
    backdrop-filter: blur(22px) saturate(1.25);
    transition: opacity 600ms, background 600ms, backdrop-filter 600ms;
}

.strip::before,
.strip::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 4%, rgba(244, 240, 255, 0.14) 24%, rgb(var(--accent) / 0.75) 50%, rgba(244, 240, 255, 0.14) 76%, transparent 96%);
    transition: opacity 600ms;
}

.strip::before { top: 0; }
.strip::after { bottom: 0; }

.host {
    position: absolute;
    left: 96px;
    top: 72px;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--dim);
    transition: opacity 600ms;
}

.host b {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-right: 14px;
    border-radius: 50%;
    vertical-align: 2px;
    background: rgb(var(--accent));
    box-shadow: 0 0 10px rgb(var(--accent));
}

.clock-block {
    position: absolute;
    right: 1020px;
    top: 0;
    height: 200px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    transition: opacity 500ms, transform 900ms cubic-bezier(0.5, 0, 0.2, 1);
}

.clock {
    font-family: "Lexend Giga", var(--font-sans);
    font-weight: 100;
    font-size: 104px;
    line-height: 1;
    letter-spacing: -2px;
    margin-right: -2px;
    font-feature-settings: "tnum" 1;
    text-shadow: 0 0 28px rgb(var(--accent) / 0.55), 0 0 2px rgb(var(--accent) / 0.4);
}

.date {
    margin-top: 16px;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--dim);
}

.divider {
    position: absolute;
    left: 959px;
    top: 44px;
    width: 1px;
    height: 112px;
    background: linear-gradient(180deg, transparent, rgb(var(--accent)) 50%, transparent);
    box-shadow: 0 0 12px rgb(var(--accent) / 0.8);
    transition: opacity 500ms;
}

form {
    position: absolute;
    left: 1020px;
    top: 0;
    width: 460px;
    height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: transform 900ms cubic-bezier(0.5, 0, 0.2, 1);
}

.who {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin: 0 0 12px 22px;
    transition: opacity 500ms;
}

.who .label {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--faint);
}

.who .name {
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.5px;
}

.field {
    position: relative;
    height: 54px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px 0 22px;
    border-radius: 27px;
    border: 1px solid rgba(244, 240, 255, 0.2);
    background: rgba(2, 1, 8, 0.55);
    color: var(--text);
    overflow: hidden;
    transition: background 520ms ease-out, color 520ms ease-out, border-color 300ms, box-shadow 300ms, opacity 500ms;
}

.field:focus-within {
    border-color: rgb(var(--accent) / 0.85);
    box-shadow: 0 0 0 4px rgb(var(--accent) / 0.12), 0 0 30px rgb(var(--accent) / 0.25);
}

.field input {
    flex: 1;
    min-width: 0;
    height: 100%;
    font-size: 18px;
    letter-spacing: 4px;
    caret-color: rgb(var(--accent));
}

.field input[type="password"] { font-size: 20px; letter-spacing: 5px; }
.field input::placeholder { font-size: 18px; letter-spacing: 1px; font-weight: 300; opacity: 0.4; }

.field::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 30%;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgb(var(--accent)), transparent);
    opacity: 0;
    transform: translateX(-100%);
}

.field button {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--dim);
    transition: color 150ms, background 150ms;
}

.field button:hover { color: var(--text); background: rgba(244, 240, 255, 0.08); }
.field i[data-icon] { width: 18px; height: 18px; }

.field .go {
    color: var(--text);
    background: rgb(var(--accent) / 0.22);
}

.field .go:hover { background: rgb(var(--accent) / 0.4); }

.notes {
    position: absolute;
    left: 22px;
    right: 0;
    top: 152px;
    display: flex;
    gap: 18px;
    align-items: baseline;
    white-space: nowrap;
}

.message {
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.3px;
    color: var(--dim);
    transition: color 400ms;
}

.capslock {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--amber);
}

.side {
    position: absolute;
    top: 0;
    height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
    transition: opacity 500ms;
}

.side.left { left: 96px; align-items: flex-start; }
.side.right { right: 96px; align-items: flex-end; }

.pick {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
    color: var(--text);
}

.pick small,
.power small {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--faint);
}

.pick span {
    font-size: 16px;
    font-weight: 300;
    transition: color 150ms;
}

.pick span::after {
    content: "›";
    margin-left: 10px;
    color: rgb(var(--accent));
}

.pick:hover span { color: rgb(var(--accent)); }

.power {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
}

.power small { margin-bottom: 2px; }

.power button {
    font-size: 15px;
    font-weight: 300;
    color: var(--dim);
    transition: color 150ms;
}

.power button:hover { color: var(--text); }
.power button[data-power="shutdown"]:hover { color: var(--red); }

.readout {
    position: absolute;
    left: 96px;
    bottom: 64px;
    display: flex;
    gap: 34px;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--faint);
    font-feature-settings: "tnum" 1;
    transition: opacity 600ms;
}

.readout b {
    margin-left: 10px;
    font-weight: 400;
    letter-spacing: 1px;
    color: var(--dim);
}

.stage.is-busy .field::after {
    opacity: 1;
    animation: sweep 1100ms cubic-bezier(0.6, 0, 0.4, 1) infinite;
}

.stage.is-busy .message {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.stage.is-busy .field input { opacity: 0.5; }

@keyframes sweep {
    to { transform: translateX(340%); }
}

.stage.is-error .field { border-color: var(--red); box-shadow: 0 0 26px rgba(255, 60, 80, 0.3); }
.stage.is-error .message { color: var(--red); }

.stage.is-flash .field {
    background: #f4f0ff;
    color: #05030c;
    border-color: #f4f0ff;
    transition: none;
}

.stage.is-flash .field button { color: #05030c; transition: none; }

.stage.is-info .message {
    font-size: 22px;
    font-weight: 200;
    letter-spacing: 0.6px;
    color: var(--amber);
}

.stage.is-info .notes { top: 148px; }

.stage.is-success .strip { background: transparent; backdrop-filter: none; }
.stage.is-success .strip::before,
.stage.is-success .strip::after { opacity: 0; }
.stage.is-success .side,
.stage.is-success .divider,
.stage.is-success .who,
.stage.is-success .field,
.stage.is-success .host,
.stage.is-success .readout,
.stage.is-success .vignette { opacity: 0; }
.stage.is-success .clock-block { opacity: 0; transform: translateX(-60px) scale(1.04); }
.stage.is-success form { transform: translateX(-290px); }
.stage.is-success .notes { top: 86px; left: 0; right: 0; justify-content: center; }

.stage.is-success .message {
    font-size: 26px;
    font-weight: 300;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #1a0f33;
    transition: none;
    animation: rise 650ms cubic-bezier(0.2, 0.7, 0.2, 1) 450ms both;
}

@keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

<body>
<div class="stage" data-stage>
    <canvas class="field-canvas" width="320" height="180"></canvas>
    <div class="vignette"></div>

    <div class="host"><b></b>seiren</div>

    <div class="strip">
        <div class="side left">
            <button type="button" class="pick" data-action="session" title="Next session">
                <small>Session</small><span data-session-name></span>
            </button>
            <button type="button" class="pick" data-action="switch-user" title="Switch user">
                <small>User</small><span>Switch</span>
            </button>
        </div>

        <div class="clock-block">
            <div class="clock" data-clock="time"></div>
            <div class="date" data-clock="long"></div>
        </div>

        <div class="divider"></div>

        <form data-login>
            <div class="who">
                <span class="name" data-user-name></span>
            </div>
            <label class="field">
                <input data-field="password" type="password" placeholder="Password" autocomplete="off">
                <button type="button" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
                <button type="submit" class="go" title="Log in"><i data-icon="go-next"></i></button>
            </label>
            <div class="notes">
                <span class="message" data-message></span>
                <span class="capslock" data-capslock>Caps Lock</span>
            </div>
        </form>

        <div class="side right">
            <div class="power">
                <small>Power</small>
                <button type="button" data-power="suspend">Suspend</button>
                <button type="button" data-power="reboot">Restart</button>

            </div>
        </div>
    </div>

    <div class="readout">
        <span>speed<b data-readout="speed"></b></span>
        <span>hue<b data-readout="hue"></b></span>
        <span>gain<b data-readout="gain"></b></span>
        <span>blur<b data-readout="blur"></b></span>
        <span>zoom<b data-readout="zoom"></b></span>
    </div>
</div>

<script>
const FIELD_WIDTH = 320;
const FIELD_HEIGHT = 180;
const FIELD_RINGS = 9;
const PULSE_LIMIT = 8;
const PULSE_LIFE_S = 1.4;
const PULSE_SPEED = 0.85;
const FRAME_DT_MAX_S = 0.05;
const READOUT_INTERVAL_S = 0.12;
const FLASH_FALLBACK_MS = 80;

const PALETTE = {
    base: [[90, 60, 255], [255, 154, 213]],
    error: [[255, 26, 52], [255, 120, 96]],
    info: [[255, 128, 16], [255, 214, 130]],
};

const TARGETS = {
    idle: { speed: 0.05, gain: 0.55, blur: 1.5, white: 0, sharp: 1, palette: "base" },
    busy: { speed: 0.9, gain: 0.85, blur: 13, white: 0, sharp: 0.35, palette: "base" },
    error: { speed: 0.14, gain: 0.85, blur: 2, white: 0, sharp: 1, palette: "error" },
    info: { speed: 0.1, gain: 0.75, blur: 3, white: 0, sharp: 0.8, palette: "info" },
    success: { speed: 1.4, gain: 2.6, blur: 5, white: 1.3, sharp: 0.5, palette: "base" },
};

const canvas = document.querySelector(".field-canvas");
const context = canvas.getContext("2d");
const image = context.createImageData(FIELD_WIDTH, FIELD_HEIGHT);
const pixel_count = FIELD_WIDTH * FIELD_HEIGHT;
const pixel_r = new Float32Array(pixel_count);
const pixel_x = new Float32Array(pixel_count);
const pixel_y = new Float32Array(pixel_count);
const pixel_sin3 = new Float32Array(pixel_count);
const pixel_cos3 = new Float32Array(pixel_count);
const pixel_sin5 = new Float32Array(pixel_count);
const pixel_cos5 = new Float32Array(pixel_count);
console.assert(canvas.width === FIELD_WIDTH && canvas.height === FIELD_HEIGHT);

for (let y = 0; y < FIELD_HEIGHT; y += 1) {
    for (let x = 0; x < FIELD_WIDTH; x += 1) {
        const index = y * FIELD_WIDTH + x;
        const u = (x + 0.5 - FIELD_WIDTH / 2) / FIELD_HEIGHT;
        const v = (y + 0.5 - FIELD_HEIGHT / 2) / FIELD_HEIGHT;
        const angle = Math.atan2(v, u);
        pixel_x[index] = u;
        pixel_y[index] = v;
        pixel_r[index] = Math.hypot(u, v);
        pixel_sin3[index] = Math.sin(angle * 3);
        pixel_cos3[index] = Math.cos(angle * 3);
        pixel_sin5[index] = Math.sin(angle * 5);
        pixel_cos5[index] = Math.cos(angle * 5);
    }
}

const shader = {
    speed: TARGETS.idle.speed,
    gain: 0,
    blur: TARGETS.idle.blur,
    white: 0,
    sharp: 1,
    zoom_log: 0,
    travel: 0,
    time: 0,
    color_a: PALETTE.base[0].slice(),
    color_b: PALETTE.base[1].slice(),
    flash_frames: 0,
};

const pulses = [];
let frame_last = performance.now();
let readout_wait = 0;
let filter_last = "";
let accent_last = "";
let password_length = 0;

function stage_state() {
    for (const each of STATES) {
        if (stage.classList.contains(`is-${each}`)) return each;
    }
    return "idle";
}

function ease(value, target, rate, dt) {
    return value + (target - value) * (1 - Math.exp(-rate * dt));
}

function color_ease(color, target, rate, dt) {
    for (let channel = 0; channel < 3; channel += 1) {
        color[channel] = ease(color[channel], target[channel], rate, dt);
    }
}

function color_snap(color, target) {
    for (let channel = 0; channel < 3; channel += 1) color[channel] = target[channel];
}

function hue_of(color) {
    const r = color[0] / 255;
    const g = color[1] / 255;
    const b = color[2] / 255;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    if (max === min) return 0;
    const delta = max - min;
    let hue = 0;
    if (max === r) hue = ((g - b) / delta) % 6;
    else if (max === g) hue = (b - r) / delta + 2;
    else hue = (r - g) / delta + 4;
    return Math.round((hue * 60 + 360) % 360);
}

function shader_step(dt) {
    const state = stage_state();
    const target = TARGETS[state];
    console.assert(target !== undefined, state);
    const palette = PALETTE[target.palette];
    shader.speed = ease(shader.speed, target.speed, state === "busy" ? 1.2 : 2.2, dt);
    shader.gain = ease(shader.gain, target.gain, state === "success" ? 1.6 : 2.5, dt);
    shader.blur = ease(shader.blur, target.blur, 2.2, dt);
    shader.white = ease(shader.white, target.white, state === "success" ? 1.5 : 4, dt);
    shader.sharp = ease(shader.sharp, target.sharp, 2.5, dt);
    if (state === "success") shader.zoom_log += dt * 1.9;
    else shader.zoom_log = ease(shader.zoom_log, 0, 3, dt);
    color_ease(shader.color_a, palette[0], state === "error" ? 1.2 : 2.4, dt);
    color_ease(shader.color_b, palette[1], state === "error" ? 1.2 : 2.4, dt);
    shader.travel += shader.speed * dt;
    shader.time += dt;
    for (let index = pulses.length - 1; index >= 0; index -= 1) {
        pulses[index] += dt;
        if (pulses[index] > PULSE_LIFE_S) pulses.splice(index, 1);
    }
}

function shader_draw() {
    const data = image.data;
    const time = shader.time;
    const travel = shader.travel;
    const zoom = Math.exp(shader.zoom_log);
    const gain = shader.gain;
    const white = shader.white;
    const sharp = shader.sharp;
    const invert = shader.flash_frames > 0;
    const [ar, ag, ab] = shader.color_a;
    const [br, bg, bb] = shader.color_b;
    const wobble_cos3 = Math.cos(time * 0.37);
    const wobble_sin3 = Math.sin(time * 0.37);
    const wobble_cos5 = Math.cos(-time * 0.23);
    const wobble_sin5 = Math.sin(-time * 0.23);
    const orbit_x = Math.cos(time * 0.11) * 0.34;
    const orbit_y = Math.sin(time * 0.17) * 0.16;
    const pulse_radius = pulses.map((age) => age * PULSE_SPEED);
    const pulse_amount = pulses.map((age) => 1 - age / PULSE_LIFE_S);
    const tau = Math.PI * 2;
    const tint_r = 178 + (ar + br) * 0.15;
    const tint_g = 178 + (ag + bg) * 0.15;
    const tint_b = 178 + (ab + bb) * 0.15;
    for (let index = 0; index < pixel_count; index += 1) {
        const r = pixel_r[index];
        const warp = 0.022 * (pixel_sin3[index] * wobble_cos3 + pixel_cos3[index] * wobble_sin3)
            + 0.012 * (pixel_sin5[index] * wobble_cos5 + pixel_cos5[index] * wobble_sin5);
        const rw = (r + warp * r) / zoom;
        const phase = rw * FIELD_RINGS - travel;
        const wave = 0.5 + 0.5 * Math.cos(phase * tau);
        const wave2 = wave * wave;
        const wave4 = wave2 * wave2;
        const wave8 = wave4 * wave4;
        const wave16 = wave8 * wave8;
        let value = (wave16 * sharp + wave4 * (1 - sharp)) * 0.85 + wave2 * 0.12;
        const dx = pixel_x[index] - orbit_x;
        const dy = pixel_y[index] - orbit_y;
        const r2 = Math.sqrt(dx * dx + dy * dy) / zoom;
        const beat = 0.5 + 0.5 * Math.cos((r2 * FIELD_RINGS * 0.62 - travel * 0.6) * tau);
        value *= 0.45 + 0.55 * beat;
        for (let p = 0; p < pulse_radius.length; p += 1) {
            const d = (r - pulse_radius[p]) * 30;
            if (d > -1 && d < 1) {
                const k = 1 - d * d;
                value += k * k * pulse_amount[p] * 0.9;
            }
        }
        const envelope = 1 / (1 + r * r * 0.7);
        let mix = rw * 1.7 - 0.3 + 0.22 * Math.sin(phase * 0.9 + time * 0.2);
        if (mix < 0) mix = 0;
        if (mix > 1) mix = 1;
        const lit = value * envelope * gain;
        let red = (ar + (br - ar) * mix) * lit + ar * 0.035;
        let green = (ag + (bg - ag) * mix) * lit + ag * 0.035;
        let blue = (ab + (bb - ab) * mix) * lit + ab * 0.035;
        let blow = white * white * 0.9 + white * value * 1.2;
        if (blow > 1) blow = 1;
        red += (tint_r - red) * blow;
        green += (tint_g - green) * blow;
        blue += (tint_b - blue) * blow;
        const offset = index * 4;
        if (invert) {
            data[offset] = 255 - red;
            data[offset + 1] = 255 - green;
            data[offset + 2] = 255 - blue;
        } else {
            data[offset] = red;
            data[offset + 1] = green;
            data[offset + 2] = blue;
        }
        data[offset + 3] = 255;
    }
    context.putImageData(image, 0, 0);
}

function shader_apply_css() {
    const brightness = 1 + shader.white * 0.6;
    const filter = `blur(${shader.blur.toFixed(1)}px) brightness(${brightness.toFixed(2)}) saturate(1.15)`;
    if (filter !== filter_last) {
        canvas.style.filter = filter;
        filter_last = filter;
    }
    const a = shader.color_a;
    const b = shader.color_b;
    const accent = `${Math.round((a[0] + b[0]) / 2 + 20)} ${Math.round((a[1] + b[1]) / 2 + 10)} ${Math.round((a[2] + b[2]) / 2 + 10)}`;
    if (accent !== accent_last) {
        stage.style.setProperty("--accent", accent);
        accent_last = accent;
    }
}

function readout_update() {
    text_set('[data-readout="speed"]', shader.speed.toFixed(2));
    text_set('[data-readout="hue"]', `${hue_of(shader.color_a)}°`);
    text_set('[data-readout="gain"]', shader.gain.toFixed(2));
    text_set('[data-readout="blur"]', `${shader.blur.toFixed(1)}px`);
    text_set('[data-readout="zoom"]', `${Math.exp(shader.zoom_log).toFixed(2)}×`);
}

function frame(now) {
    const dt = Math.min((now - frame_last) / 1000, FRAME_DT_MAX_S);
    frame_last = now;
    const flashing = shader.flash_frames > 0;
    shader_step(dt);
    shader_draw();
    shader_apply_css();
    if (flashing) shader.flash_frames -= 1;
    else if (stage.classList.contains("is-flash")) flash_end();
    readout_wait -= dt;
    if (readout_wait <= 0) {
        readout_update();
        readout_wait = READOUT_INTERVAL_S;
    }
    requestAnimationFrame(frame);
}

function on_stage_class(records) {
    if (!stage.classList.contains("is-error")) return;
    const entered = records.some((record) => !(record.oldValue ?? "").split(" ").includes("is-error"));
    if (!entered) return;
    color_snap(shader.color_a, PALETTE.error[0]);
    color_snap(shader.color_b, PALETTE.error[1]);
    shader.flash_frames = 1;
    stage.classList.add("is-flash");
    setTimeout(flash_end, FLASH_FALLBACK_MS);
}

function flash_end() {
    shader.flash_frames = 0;
    stage.classList.remove("is-flash");
}

function on_password_input() {
    const length = field_password.value.length;
    if (length > password_length) {
        if (pulses.length >= PULSE_LIMIT) pulses.shift();
        pulses.push(0);
    }
    console.assert(pulses.length <= PULSE_LIMIT);
    password_length = length;
}

new MutationObserver(on_stage_class).observe(stage, { attributes: true, attributeFilter: ["class"], attributeOldValue: true });
field_password.addEventListener("input", on_password_input);
form.addEventListener("submit", () => { password_length = 0; });
readout_update();
requestAnimationFrame(frame);
</script>
</body>
</html>
