    width: 300px;
    min-height: 280px;
    padding: 40px 30px 36px 32px;
    background-color: var(--sticky-info);
    font-size: 46px;
    line-height: 1.02;
    color: var(--ink);
    opacity: 0;
    visibility: hidden;
    transform: translate(60px, -90px) rotate(22deg) scale(1.08);
    transition: opacity 260ms ease, transform 420ms cubic-bezier(0.2, 0.8, 0.25, 1.1), visibility 0s 420ms;
}

.info-note small {
    display: block;
    margin-bottom: 10px;
    font-size: 28px;
    color: rgba(28, 35, 64, 0.6);
}

.dusk {
    position: absolute;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%, #1a0f08, #070402 70%);
    opacity: 0;
    transition: opacity 700ms ease;
}

.farewell {
    position: absolute;
    left: 0;
    right: 0;
    top: 470px;
    z-index: 9;
    text-align: center;
    font-size: 96px;
    color: #f3ead9;
    opacity: 0;
    pointer-events: none;
    transform: rotate(-2deg) translateY(16px);
    transition: opacity 400ms ease, transform 400ms ease;
}

.is-busy .front .photo-image { animation: develop-image 2600ms ease-in-out infinite; }
.is-busy .front .photo-milk { animation: develop-milk 2600ms ease-in-out infinite; }
.is-busy .pencil-note { color: var(--ink-soft); }

@keyframes develop-image {
    0% { filter: grayscale(1) brightness(1.35) contrast(0.35) blur(4px); }
    30% { filter: grayscale(0.85) brightness(1.25) contrast(0.55) sepia(0.35) blur(2px); }
    70%, 88% { filter: saturate(1.06) contrast(1.03); }
    100% { filter: grayscale(1) brightness(1.35) contrast(0.35) blur(4px); }
}

@keyframes develop-milk {
    0% { opacity: 0.96; }
    40% { opacity: 0.55; }
    70%, 88% { opacity: 0; }
    100% { opacity: 0.96; }
}

.is-error .front .photo-image { filter: grayscale(1) brightness(1.3) contrast(0.4) blur(3px); }
.is-error .front .photo-milk { opacity: 0.93; }
.is-error .photo-note { opacity: 1; transition-delay: 300ms; }
.is-error .scribble path { animation: scribble 600ms ease-out 600ms forwards; }
.is-error .pen-row { animation: shake 360ms ease-in-out; }
.is-error .pen-rule path { stroke: var(--red-pen); }

@keyframes scribble {
    to { stroke-dashoffset: 0; }
}

.is-info .info-note {
    opacity: 1;
    visibility: visible;
    transform: rotate(6deg);
    transition: opacity 200ms ease, transform 460ms cubic-bezier(0.2, 0.8, 0.25, 1.1), visibility 0s;
}

.is-success .front {
    transform: translate(-1500px, 220px) rotate(-26deg);
    transition: transform 1100ms cubic-bezier(0.55, 0, 0.8, 0.3);
}

.is-success .table-objects { opacity: 0; }
.is-success .dusk { opacity: 1; transition: opacity 900ms ease 500ms; }
.is-success .farewell { opacity: 1; transform: rotate(-2deg); transition: opacity 600ms ease 1100ms, transform 600ms ease 1100ms; }
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="planks"></div>

    <div class="table-objects">
        <button type="button" class="polaroid back paper-noise" data-action="switch-user" title="Switch user">
            <span class="photo"><span class="photo-image"></span></span>
            <span class="back-strip" data-other-user></span>
        </button>

        <div class="tag">
            <svg class="twine" viewBox="0 0 420 400">
                <path class="rope" d="M366 378 C 300 330, 250 300, 236 236 S 160 120, 40 -20"/>
                <path class="twist" d="M366 378 C 300 330, 250 300, 236 236 S 160 120, 40 -20"/>
            </svg>
            <div class="tag-card">
                <div class="tag-paper"></div>
                <span class="tag-ring"></span>
                <div class="tag-body">
                    <div class="stamp"><span>Time</span><span>No. <span data-clock="day-of-year"></span></span></div>
                    <div class="tag-time" data-clock="time"></div>
                    <div class="tag-date" data-clock="long"></div>
                </div>
            </div>
            <svg class="twine over" viewBox="0 0 420 400">
                <path class="rope" d="M366 378 C 380 388, 400 400, 380 420"/>
                <path class="twist" d="M366 378 C 380 388, 400 400, 380 420"/>
            </svg>
        </div>

        <div class="sticky sessions">
            <button type="button" class="note-title" data-action="session" title="Next session">
                session
                <svg viewBox="0 0 150 10"><path d="M2 6 C 40 2, 90 9, 148 4"/></svg>
            </button>
            <div class="session-list"></div>
        </div>

        <div class="sheet">
            <button class="sticker sleep" data-power="suspend" title="Sleep"><i data-icon="system-suspend"></i>Sleep</button>
            <button class="sticker restart" data-power="reboot" title="Restart"><i data-icon="system-reboot"></i>Restart</button>
            <button class="sticker off" data-power="shutdown" title="Power off"><i data-icon="system-shutdown"></i>Off</button>
        </div>

        <div class="pencil">
            <span class="pencil-eraser"></span>
            <span class="pencil-ferrule"></span>
            <span class="pencil-body"></span>
            <span class="pencil-tip"></span>
        </div>
    </div>

    <div class="polaroid front paper-noise">
        <div class="photo">
            <div class="photo-image"></div>
            <div class="photo-milk"></div>
            <div class="photo-note">
                <b>wrong password</b>
                <svg class="scribble" viewBox="0 0 430 46"><path d="M10 14 C 120 4, 300 6, 420 10 C 330 16, 150 18, 30 26 C 140 24, 290 22, 400 26 C 300 32, 170 36, 70 40"/></svg>
                <p data-mirror="error"></p>
            </div>
        </div>
        <form class="strip" data-login>
            <div class="strip-top">
                <button type="button" class="name" data-action="switch-user" title="Switch user"><span data-user-name></span><i data-icon="system-switch-user"></i></button>
                <div class="caption"><span data-clock="short"></span><span>@ <span data-session-name></span></span></div>
            </div>
            <div class="pen-row">
                <label class="pen-line">
                    <input data-field="password" type="password" aria-label="Password" autocomplete="off" spellcheck="false">
                    <span class="pen-hint">password</span>
                    <span class="pen-ink" aria-hidden="true"><span class="pen-dots"></span><span class="pen-caret"></span></span>
                    <svg class="pen-rule" viewBox="0 0 438 14" preserveAspectRatio="none"><path d="M2 8 C 50 5, 110 10, 170 7 S 290 4, 350 8 S 420 9, 436 6"/></svg>
                </label>
                <button type="button" class="reveal" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
                <button type="submit" class="go" title="Log in"><svg viewBox="0 0 58 40"><path d="M4 22 C 18 20, 34 21, 52 19 M38 7 C 44 12, 49 16, 53 19 C 48 23, 43 28, 39 34"/></svg></button>
            </div>
            <div class="pencil-note"><span class="message" data-message></span><span class="capslock" data-capslock>caps lock is on</span></div>
        </form>
    </div>

    <div class="sticky info-note"><small>note</small><span data-mirror="info"></span></div>

    <div class="dusk"></div>
    <div class="farewell" data-mirror="success"></div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
<script>
const PEN_DOT_LIMIT = 22;
const pen_dots = document.querySelector(".pen-dots");
const session_list = document.querySelector(".session-list");
const session_rows = [];

function pen_hash(index, salt) {
    const value = Math.sin((index + 1) * 12.9898 + salt * 78.233) * 43758.5453;
    return value - Math.floor(value);
}

function pen_draw() {
    const count = Math.min(field_password.value.length, PEN_DOT_LIMIT);
    console.assert(count >= 0 && count <= PEN_DOT_LIMIT, count);
    while (pen_dots.children.length < count) {
        const index = pen_dots.children.length;
        const dot = document.createElement("span");
        const radius = [50, 46, 54, 48].map((base, corner) => base + Math.round(pen_hash(index, corner + 3) * 10 - 5));
        dot.style.setProperty("--size", `${11 + Math.round(pen_hash(index, 1) * 4)}px`);
        dot.style.setProperty("--rise", `${Math.round(pen_hash(index, 2) * 6 - 3)}px`);
        dot.style.setProperty("--turn", `${Math.round(pen_hash(index, 7) * 90)}deg`);
        dot.style.setProperty("--shape", radius.map((each) => `${each}%`).join(" "));
        pen_dots.append(dot);
    }
    while (pen_dots.children.length > count) pen_dots.lastElementChild.remove();
    stage.classList.toggle("has-text", field_password.value.length > 0);
}

function reveal_sync() {
    stage.classList.toggle("is-revealed", field_password.type === "text");
}

function message_mirror() {
    const text = message.textContent;
    if (text.length === 0) return;
    for (const state of ["error", "info", "success"]) {
        if (!stage.classList.contains(`is-${state}`)) continue;
        text_set(`[data-mirror="${state}"]`, text);
    }
}

function sessions_build() {
    console.assert(SESSIONS.length > 0 && SESSIONS.length <= 6, SESSIONS.length);
    SESSIONS.forEach((name, index) => {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "session-row";
        row.dataset.pick = String(index);
        row.innerHTML = `<span class="box" style="--turn:${index % 2 === 0 ? -3 : 4}deg"><svg viewBox="0 0 42 42"><path d="M6 24 C 10 28, 13 31, 16 35 C 22 22, 30 11, 40 2"/></svg></span>`;
        row.append(name);
        session_list.append(row);
        session_rows.push(row);
    });
}

function sessions_mark() {
    session_rows.forEach((row, index) => row.classList.toggle("is-on", index === session_index));
}

function session_pick(index) {
    console.assert(index >= 0 && index < SESSIONS.length, index);
    while (session_index !== index) session_next();
    field_password.focus();
}

function other_user_sync() {
    text_set("[data-other-user]", USERS[(user_index + 1) % USERS.length]);
}

session_list.addEventListener("click", (event) => {
    const row = event.target.closest(".session-row");
    if (row === null) return;
    session_pick(Number(row.dataset.pick));
});

field_password.addEventListener("input", pen_draw);
new MutationObserver(reveal_sync).observe(field_password, { attributes: true, attributeFilter: ["type"] });
new MutationObserver(() => {
    pen_draw();
    message_mirror();
}).observe(stage, { attributes: true, attributeFilter: ["class"] });
new MutationObserver(message_mirror).observe(message, { childList: true, characterData: true, subtree: true });
new MutationObserver(sessions_mark).observe(document.querySelector("[data-session-name]"), { childList: true, characterData: true, subtree: true });
new MutationObserver(other_user_sync).observe(document.querySelector("[data-user-name]"), { childList: true, characterData: true, subtree: true });

sessions_build();
sessions_mark();
other_user_sync();
reveal_sync();
pen_draw();
message_mirror();
</script>
</body>
</html>
