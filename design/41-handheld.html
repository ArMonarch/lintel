<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 41 Handheld</title>
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face {
    font-family: "Red Hat Display";
    src: url("assets/fonts/RedHatDisplay-Light.otf") format("opentype");
    font-weight: 300;
}

@font-face {
    font-family: "Red Hat Display";
    src: url("assets/fonts/RedHatDisplay-Regular.otf") format("opentype");
    font-weight: 400;
}

@font-face {
    font-family: "Red Hat Display";
    src: url("assets/fonts/RedHatDisplay-Medium.otf") format("opentype");
    font-weight: 500;
}

.stage {
    --navy: #14192a;
    --navy-deep: #0e1220;
    --white: #f4f6fb;
    --dim: rgba(244, 246, 251, 0.56);
    --faint: rgba(244, 246, 251, 0.4);
    --label: rgba(244, 246, 251, 0.44);
    --hair: rgba(244, 246, 251, 0.12);
    --tile: rgba(244, 246, 251, 0.045);
    --red: #ff5f72;
    --amber: #ffc861;
    --green: #6ee7a8;
    --x: #6f9bff;
    --y: #5fd49a;
    background:
        radial-gradient(1200px 800px at 18% 30%, rgba(80, 104, 170, 0.22), transparent 70%),
        linear-gradient(180deg, rgba(20, 25, 42, 0.72), rgba(14, 18, 32, 0.88)),
        var(--wallpaper-blur) center / cover no-repeat,
        var(--navy);
    color: var(--white);
    font-family: "Red Hat Display", var(--font-sans);
    font-weight: 300;
}

.status {
    position: absolute;
    left: 180px;
    right: 180px;
    top: 52px;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 28px;
    font-size: 22px;
    color: var(--dim);
    z-index: 2;
}

.host {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-right: auto;
    letter-spacing: 0.5px;
}

.host::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--white);
    box-shadow: 0 0 12px rgba(244, 246, 251, 0.6);
}

.caps {
    height: 34px;
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    border-radius: 17px;
    border: 1px solid var(--amber);
    color: var(--amber);
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.date { color: var(--white); }

.track {
    position: absolute;
    left: 0;
    top: 0;
    width: 3840px;
    height: 976px;
    display: flex;
    transition: transform 720ms cubic-bezier(0.65, 0, 0.25, 1);
}

.screen {
    position: relative;
    width: 1920px;
    height: 976px;
    flex: none;
}

.divider {
    position: absolute;
    left: 960px;
    top: 210px;
    width: 1px;
    height: 660px;
    background: linear-gradient(180deg, transparent, var(--hair) 18%, var(--hair) 82%, transparent);
}

.heading {
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--label);
}

form {
    position: absolute;
    left: 180px;
    top: 196px;
    width: 680px;
}

.avatar {
    position: relative;
    width: 340px;
    height: 340px;
    margin-top: 30px;
    display: grid;
    place-items: center;
    border-radius: 38px;
    background:
        radial-gradient(260px 220px at 30% 22%, rgba(255, 255, 255, 0.22), transparent 70%),
        linear-gradient(145deg, #4c6fd8, #6a4fc4 55%, #3a2f86);
    font-size: 170px;
    font-weight: 300;
    line-height: 1;
    color: var(--white);
    box-shadow: 0 30px 60px rgba(4, 6, 14, 0.5);
}

.avatar::after {
    content: "";
    position: absolute;
    inset: -12px;
    border-radius: 50px;
    border: 3px solid var(--white);
    opacity: 0.9;
    box-shadow: 0 0 26px rgba(160, 190, 255, 0.35);
    animation: ring-breathe 2.6s ease-in-out infinite;
    transition: border-color 200ms, box-shadow 200ms;
}

@keyframes ring-breathe {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 0.45; }
}

.name {
    margin-top: 44px;
    font-size: 72px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.5px;
}

.prompt {
    margin-top: 26px;
    min-height: 40px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 30px;
    color: var(--dim);
}

.prompt .glyph-mark {
    display: none;
    width: 34px;
    height: 34px;
    flex: none;
}

.prompt .p-error { display: none; color: var(--red); font-weight: 400; }
.prompt .p-idle { display: inline; }
.message { display: none; }

.note {
    min-height: 30px;
    margin-top: 10px;
    font-size: 22px;
    color: var(--dim);
}

.slot {
    position: relative;
    margin-top: 30px;
    height: 48px;
    display: flex;
    align-items: center;
}

.dots {
    display: flex;
    align-items: center;
    gap: 16px;
}

.dot {
    width: 26px;
    height: 26px;
    flex: none;
    border-radius: 50%;
    border: 2px solid var(--faint);
    background: transparent;
    transition: background 140ms, border-color 140ms, transform 140ms;
}

.dot.is-on {
    border-color: var(--white);
    background: var(--white);
    transform: scale(1.06);
}

.dot.is-next { border-color: var(--white); }
.slot:focus-within .dot.is-next { animation: next-blink 1.1s steps(1) infinite; }

@keyframes next-blink {
    50% { border-color: var(--faint); }
}

.more {
    font-size: 22px;
    color: var(--dim);
}

.more:not(:empty) { margin-left: 14px; }

.slot input {
    position: absolute;
    left: 0;
    top: 0;
    width: 600px;
    height: 48px;
    font-family: inherit;
    font-size: 30px;
    font-weight: 300;
    letter-spacing: 3px;
    color: transparent;
    caret-color: transparent;
}

.slot input[type="text"] { color: var(--white); caret-color: var(--white); }
.slot:has(input[type="text"]) .dots { visibility: hidden; }
.slot:has(input[type="text"]) .more { display: none; }

.reveal {
    position: relative;
    z-index: 1;
    margin-left: 26px;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    color: var(--dim);
    border-radius: 50%;
}

.reveal:hover { color: var(--white); background: var(--tile); }
.reveal i[data-icon] { width: 24px; height: 24px; }

.menu {
    position: absolute;
    left: 1060px;
    top: 196px;
    width: 680px;
    transition: opacity 260ms;
}

.group + .group { margin-top: 40px; }
.group .heading { margin-bottom: 18px; }
.rows { display: flex; flex-direction: column; gap: 14px; }

.row {
    position: relative;
    width: 100%;
    height: 100px;
    padding: 0 34px 0 28px;
    display: flex;
    align-items: center;
    gap: 26px;
    border-radius: 20px;
    background: var(--tile);
    font-size: 32px;
    font-weight: 300;
    text-align: left;
    transition: background 140ms, box-shadow 140ms;
}

.row:hover { background: rgba(244, 246, 251, 0.07); }

.row.is-selected {
    background: rgba(244, 246, 251, 0.1);
    box-shadow: 0 0 0 3px var(--white), 0 0 30px rgba(160, 190, 255, 0.28);
}

.row .value {
    margin-left: auto;
    font-size: 26px;
    color: var(--dim);
}

.row i[data-icon] { width: 30px; height: 30px; color: var(--faint); }
.row .value + i[data-icon] { margin-left: 4px; width: 22px; height: 22px; }
.row > span:nth-child(2) { flex: none; }
.row i.push { margin-left: auto; color: var(--dim); }

.btn {
    width: 46px;
    height: 46px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 2px solid rgba(244, 246, 251, 0.7);
    font-size: 20px;
    font-weight: 500;
    line-height: 1;
    color: var(--white);
}

.btn.pill { width: 62px; border-radius: 23px; font-size: 18px; }
.btn.x { border-color: var(--x); color: var(--x); }
.btn.y { border-color: var(--y); color: var(--y); }
.row.is-selected .btn { background: var(--white); border-color: var(--white); color: var(--navy); }

.footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 104px;
    padding: 0 180px;
    display: flex;
    align-items: center;
    gap: 44px;
    border-top: 1px solid var(--hair);
    background: rgba(8, 11, 22, 0.42);
    font-size: 24px;
    color: var(--dim);
    z-index: 2;
}

.hint {
    display: flex;
    align-items: center;
    gap: 14px;
    transition: opacity 200ms;
}

.hint:hover { color: var(--white); }

.hint .btn {
    width: 38px;
    height: 38px;
    font-size: 17px;
    background: var(--white);
    border-color: var(--white);
    color: var(--navy);
}

.hint .btn.pill { width: 54px; font-size: 20px; }

.clock {
    margin-left: auto;
    display: flex;
    align-items: baseline;
    gap: 18px;
}

.clock .weekday { font-size: 22px; color: var(--dim); }
.clock .time { font-size: 38px; color: var(--white); letter-spacing: 0.5px; }

.starting {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 20px;
}

.starting .avatar {
    width: 132px;
    height: 132px;
    margin: 0;
    border-radius: 22px;
    font-size: 64px;
    box-shadow: 0 20px 40px rgba(4, 6, 14, 0.5);
}

.starting .avatar::after { display: none; }
.starting .heading { margin-top: 48px; }

.starting .session {
    margin-top: 18px;
    font-size: 132px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -1px;
}

.starting .bar {
    width: 520px;
    height: 4px;
    margin-top: 56px;
    border-radius: 2px;
    background: var(--hair);
    overflow: hidden;
}

.starting .bar::after {
    content: "";
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 2px;
    background: var(--white);
    transform-origin: 0 50%;
    transform: scaleX(0);
}

.starting .who { margin-top: 22px; font-size: 24px; color: var(--dim); }

.is-busy .prompt .p-idle,
.is-info .prompt .p-idle,
.is-success .prompt .p-idle { display: none; }
.is-busy .message,
.is-info .message,
.is-success .message { display: inline; }
.is-busy .prompt { color: var(--white); }
.is-busy .dot { animation: dot-loop 1.4s ease-in-out infinite; animation-delay: calc(var(--i) * 90ms); }
.is-busy .menu { opacity: 0.32; pointer-events: none; }
.is-busy .hint { opacity: 0.32; }
.is-busy .avatar::after { animation-duration: 0.9s; }

@keyframes dot-loop {
    0%, 100% { background: transparent; border-color: var(--faint); transform: scale(1); }
    25%, 45% { background: var(--white); border-color: var(--white); transform: scale(1.12); }
}

.is-error .prompt .p-idle { display: none; }
.is-error .prompt .p-error { display: inline; }
.is-error .prompt .glyph-error { display: block; color: var(--red); }
.is-error .note .message { display: inline; color: rgba(244, 246, 251, 0.78); }
.is-error .dots { animation: shake 420ms ease-in-out; }
.is-error .dot { border-color: rgba(255, 95, 114, 0.78); }
.is-error .dot.is-on { border-color: var(--red); background: var(--red); animation: dot-flash 760ms steps(1); }
.is-error .dot.is-next { animation: none; border-color: rgba(255, 95, 114, 0.78); }
.is-error .avatar::after { border-color: var(--red); box-shadow: 0 0 30px rgba(255, 95, 114, 0.45); animation: none; }

@keyframes dot-flash {
    0%, 40% { background: var(--red); }
    20%, 60% { background: transparent; }
    80% { background: var(--red); }
}

.is-info .prompt { color: var(--amber); }
.is-info .prompt .glyph-print { display: block; }
.is-info .dot { opacity: 0.35; }
.is-info .avatar::after { border-color: var(--amber); box-shadow: 0 0 30px rgba(255, 200, 97, 0.35); }

.is-success .track { transform: translateX(-1920px); }
.is-success .hint { opacity: 0.32; }
.is-success .starting .bar::after { transform: scaleX(1); transition: transform 2200ms cubic-bezier(0.3, 0, 0.2, 1) 500ms; }
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="status">
        <span class="host">seiren</span>
        <span class="caps" data-capslock>Caps Lock</span>
        <span class="date" data-clock="day-month-year"></span>
    </div>

    <div class="track">
        <div class="screen">
            <form data-login>
                <div class="heading">Account</div>
                <div class="avatar" data-user-initial></div>
                <div class="name" data-user-name></div>
                <div class="prompt">
                    <svg class="glyph-mark glyph-print" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        <path d="M8.5 7.5a11 11 0 0 1 15 0"/>
                        <path d="M6 13.5a11 11 0 0 1 20 0"/>
                        <path d="M9.5 26c-1.4-2.4-2-5-2-8a8.5 8.5 0 0 1 17 0v1.5"/>
                        <path d="M13 28c-1.4-2.6-2-5.2-2-9.5a5 5 0 0 1 10 0c0 2.6.5 5 1.5 7"/>
                        <path d="M16 18.5c0 3.6.8 7 2.4 10"/>
                    </svg>
                    <svg class="glyph-mark glyph-error" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="16" cy="16" r="12.5"/>
                        <path d="M16 9.5v8"/>
                        <path d="M16 22.2v.3"/>
                    </svg>
                    <span class="p-idle">Enter your password</span>
                    <span class="p-error">Wrong password</span>
                    <span class="message" data-message></span>
                </div>
                <label class="slot">
                    <span class="dots"></span>
                    <span class="more"></span>
                    <input data-field="password" type="password" aria-label="Password" autocomplete="off">
                    <button type="button" class="reveal" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
                </label>
                <div class="note"></div>
            </form>

            <div class="divider"></div>

            <div class="menu">
                <div class="group">
                    <div class="heading">Options</div>
                    <div class="rows">
                        <button class="row" data-action="session"><span class="btn x">X</span><span>Session</span><span class="value" data-session-name></span><i data-icon="go-next"></i></button>
                        <button class="row" data-action="switch-user"><span class="btn y">Y</span><span>Switch user</span><span class="value" data-next-user></span><i data-icon="go-next"></i></button>
                    </div>
                </div>
                <div class="group">
                    <div class="heading">Power</div>
                    <div class="rows">
                        <button class="row" data-power="suspend"><span class="btn pill">L</span><span>Sleep</span><i class="push" data-icon="system-suspend"></i></button>
                        <button class="row" data-power="reboot"><span class="btn pill">R</span><span>Restart</span><i class="push" data-icon="system-reboot"></i></button>
                        <button class="row" data-power="shutdown"><span class="btn pill">ZR</span><span>Power off</span><i class="push" data-icon="system-shutdown"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="screen starting">
            <div class="avatar" data-user-initial></div>
            <div class="heading">Starting</div>
            <div class="session" data-session-name></div>
            <div class="bar"></div>
            <div class="who">Signed in as <span data-user-name></span></div>
        </div>
    </div>

    <div class="footer">
        <button type="button" class="hint hint-select"><span class="btn">A</span>Select</button>
        <button type="button" class="hint hint-back"><span class="btn">B</span>Back</button>
        <button type="button" class="hint" data-action="login"><span class="btn pill">⏎</span>Log in</button>
        <div class="clock">
            <span class="weekday" data-clock="weekday"></span>
            <span class="time" data-clock="time"></span>
        </div>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
<script>
const DOT_MIN = 8;
const DOT_MAX = 16;
const dots = document.querySelector(".dots");
const dots_more = document.querySelector(".more");
const note = document.querySelector(".note");
const prompt_line = document.querySelector(".prompt");
const rows = [...document.querySelectorAll(".row")];
console.assert(dots !== null && rows.length === 5);
console.assert(message !== null);

let dots_last = 0;
let row_index = 0;

function dots_render() {
    let count = field_password.value.length;
    if (stage.classList.contains("is-busy")) dots_last = count;
    if (stage.classList.contains("is-error") && count === 0) count = dots_last;
    const slots = Math.min(Math.max(count + 1, DOT_MIN), DOT_MAX);
    console.assert(slots >= DOT_MIN && slots <= DOT_MAX, slots);
    dots.replaceChildren();
    for (let i = 0; i < slots; i += 1) {
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.setProperty("--i", i);
        if (i < count) dot.classList.add("is-on");
        if (i === count) dot.classList.add("is-next");
        dots.append(dot);
    }
    dots_more.textContent = count > DOT_MAX ? `+${count - DOT_MAX}` : "";
}

function message_place() {
    const target = stage.classList.contains("is-error") ? note : prompt_line;
    if (message.parentElement !== target) target.append(message);
}

function row_select(index) {
    console.assert(index >= 0 && index < rows.length, index);
    row_index = index;
    rows.forEach((row, i) => row.classList.toggle("is-selected", i === index));
}

function next_user_sync() {
    const name = document.querySelector("[data-user-name]").textContent;
    const index = USERS.indexOf(name);
    console.assert(index !== -1, name);
    text_set("[data-next-user]", USERS[(index + 1) % USERS.length]);
}

function on_page_click(event) {
    if (event.target.closest(".hint-select") !== null) {
        rows[row_index].click();
        return;
    }
    if (event.target.closest(".hint-back") !== null) {
        field_password.value = "";
        if (stage.classList.contains("is-error") || stage.classList.contains("is-info")) state_set("idle", "");
        dots_render();
    }
    const row = event.target.closest(".row");
    if (row !== null) row_select(rows.indexOf(row));
    next_user_sync();
    if (!field_password.disabled) field_password.focus();
}

function on_page_key(event) {
    if (event.ctrlKey || event.altKey || event.metaKey || event.shiftKey) return;
    if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
    if (stage.classList.contains("is-busy") || stage.classList.contains("is-success")) return;
    event.preventDefault();
    const step = event.key === "ArrowDown" ? 1 : -1;
    row_select((row_index + step + rows.length) % rows.length);
}

for (const row of rows) row.addEventListener("mouseenter", () => row_select(rows.indexOf(row)));
field_password.addEventListener("input", dots_render);
document.addEventListener("click", on_page_click);
document.addEventListener("keydown", on_page_key);
new MutationObserver(() => {
    message_place();
    dots_render();
}).observe(stage, { attributes: true, attributeFilter: ["class"] });

row_select(0);
next_user_sync();
message_place();
dots_render();
</script>
</body>
