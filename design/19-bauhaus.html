<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 19 Bauhaus</title>
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face {
    font-family: "Jost";
    src: url("assets/fonts/Jost-400-Book.otf") format("opentype");
    font-weight: 400;
}

@font-face {
    font-family: "Jost";
    src: url("assets/fonts/Jost-500-Medium.otf") format("opentype");
    font-weight: 500;
}

@font-face {
    font-family: "Jost";
    src: url("assets/fonts/Jost-700-Bold.otf") format("opentype");
    font-weight: 700;
}

.stage {
    --cream: #e8dfc8;
    --black: #111111;
    --red: #c8402a;
    --blue: #2f5d8a;
    --grey: #8a8a86;
    --slide: 900ms cubic-bezier(0.7, 0, 0.25, 1);
    background: var(--cream);
    color: var(--black);
    font-family: "Jost", var(--font-sans);
    font-weight: 500;
}

.piece {
    position: absolute;
    transition: transform var(--slide), opacity 400ms;
}

.band {
    left: 0;
    top: 1020px;
    width: 1000px;
    height: 120px;
    transform-origin: 0 50%;
    transform: rotate(-29.358deg) translateX(-120px);
    background: var(--black);
    color: var(--cream);
    z-index: 2;
    transition: transform var(--slide), background 300ms, color 300ms;
}

.band-text {
    position: absolute;
    left: 250px;
    top: 0;
    max-width: 520px;
    line-height: 120px;
    font-size: 24px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 250ms;
}

.band-message {
    opacity: 0;
    font-size: 30px;
    letter-spacing: 0.04em;
    text-transform: none;
}

.rule {
    left: 0;
    top: 1076px;
    width: 2203px;
    height: 8px;
    transform-origin: 0 50%;
    transform: rotate(-29.358deg);
    background: var(--black);
    z-index: 1;
}

.clock {
    position: absolute;
    left: 1330px;
    bottom: 2px;
    font-size: 200px;
    line-height: 0.8;
    letter-spacing: -4px;
    font-feature-settings: "tnum" 1;
    white-space: nowrap;
}

.date {
    position: absolute;
    left: 1366px;
    top: 26px;
    font-size: 19px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    white-space: nowrap;
}

.square {
    left: 1620px;
    top: 0;
    width: 300px;
    height: 300px;
    background: var(--grey);
    z-index: 0;
}

.host {
    position: absolute;
    left: 28px;
    bottom: 24px;
    font-size: 16px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--cream);
}

.disc {
    left: 370px;
    top: 100px;
    width: 660px;
    height: 660px;
    z-index: 2;
}

.disc-turn {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--blue);
}

.photo {
    position: absolute;
    inset: 64px;
    border-radius: 50%;
    background: var(--blue) var(--wallpaper) center / cover no-repeat;
}

.dot {
    position: absolute;
    left: 520px;
    top: 98px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--black);
}

.initial {
    left: 300px;
    top: 130px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--red);
    color: var(--cream);
    font-size: 96px;
    font-weight: 700;
    line-height: 1;
    z-index: 3;
}

.initial span { margin-top: -6px; }
.initial:hover { background: var(--black); }
.name:hover { color: var(--red); }
.sessions:hover .session-name { color: var(--red); }

.name {
    left: 46px;
    bottom: 196px;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 132px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -2px;
    white-space: nowrap;
    z-index: 2;
}

.name-caption {
    left: 72px;
    top: 904px;
    font-size: 15px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    z-index: 2;
}

.sessions {
    left: 72px;
    top: 64px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 2;
}

.sessions svg { width: 30px; height: 30px; overflow: visible; }
.sessions svg * { fill: none; stroke-width: 3px; transition: fill 200ms; }
.mark-circle * { stroke: var(--blue); }
.mark-square * { stroke: var(--red); }
.mark-triangle * { stroke: var(--black); }
.stage[data-session="0"] .mark-circle * { fill: var(--blue); }
.stage[data-session="1"] .mark-square * { fill: var(--red); }
.stage[data-session="2"] .mark-triangle * { fill: var(--black); }

.session-name {
    margin-left: 10px;
    font-size: 26px;
    white-space: nowrap;
}

.session-caption {
    font-size: 15px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    margin-left: 6px;
}

form {
    left: 749px;
    top: 349px;
    width: 622px;
    height: 622px;
    z-index: 3;
}

.diamond {
    position: absolute;
    inset: 0;
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    background: var(--red);
    overflow: hidden;
    transition: background 200ms;
}

.sweep {
    position: absolute;
    top: 0;
    bottom: 0;
    left: -12px;
    width: 12px;
    background: var(--black);
    opacity: 0;
}

.field-box {
    position: absolute;
    left: 121px;
    top: 250px;
    width: 380px;
    color: var(--cream);
}

.label {
    font-size: 15px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
}

.field {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    border-bottom: 5px solid var(--cream);
}

.field input {
    flex: 1;
    min-width: 0;
    height: 64px;
    font-family: inherit;
    font-size: 46px;
    letter-spacing: 6px;
    caret-color: var(--cream);
}

.reveal { display: inline-flex; color: var(--cream); opacity: 0.8; }
.reveal:hover { opacity: 1; }
.reveal i[data-icon] { width: 28px; height: 28px; }

.capslock {
    display: block;
    margin-top: 12px;
    font-size: 15px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
}

.go {
    position: absolute;
    left: 570px;
    top: 259px;
    width: 104px;
    height: 104px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--black);
    color: var(--cream);
    transition: background 200ms;
}

.go svg { width: 34px; height: 34px; margin-left: 6px; }
.go:hover { background: var(--blue); }

.message {
    position: absolute;
    left: 11px;
    top: 636px;
    width: 600px;
    font-size: 24px;
    line-height: 32px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transition: opacity 200ms;
}

.power {
    left: 1380px;
    top: 940px;
    width: 420px;
    height: 140px;
    display: flex;
    padding: 0 18px 22px;
    background: var(--red);
    color: var(--cream);
    z-index: 2;
}

.power button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
}

.power svg { width: 40px; height: 40px; }
.power button:hover { color: var(--black); }

.finale {
    position: absolute;
    left: 0;
    right: 0;
    top: 470px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    opacity: 0;
    transition: opacity 300ms;
    pointer-events: none;
}

.finale-shapes { display: flex; gap: 18px; }
.finale-shapes span { width: 34px; height: 34px; }
.finale-shapes span:nth-child(1) { border-radius: 50%; background: var(--blue); }
.finale-shapes span:nth-child(2) { background: var(--red); }
.finale-shapes span:nth-child(3) { background: var(--black); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.finale-message { font-size: 72px; letter-spacing: -1px; }

.is-busy .disc-turn { animation: turn 4s linear infinite; }
.is-busy .sweep { opacity: 1; animation: sweep 1100ms cubic-bezier(0.6, 0, 0.4, 1) infinite; }
.is-busy .message { opacity: 1; }
.is-busy .go { background: var(--grey); }

.is-error .diamond { background: var(--black); }
.is-error .go { background: var(--red); }
.is-error form { animation: shake 360ms ease-in-out; }
.is-error .message { opacity: 1; color: var(--red); }
.is-error .message::before {
    content: "";
    display: inline-block;
    width: 16px;
    height: 16px;
    margin: -4px 14px 0 0;
    vertical-align: middle;
    background: var(--black);
}

.is-info .band { background: var(--grey); color: var(--black); }
.is-info .band-date { opacity: 0; }
.is-info .band-message { opacity: 1; }

.is-success .band { transform: rotate(-29.358deg) translateX(-1500px); }
.is-success .rule { transform: rotate(-29.358deg) translateX(2300px); }
.is-success .square { transform: translate(700px, -700px); }
.is-success .disc { transform: translate(-1200px, -900px); }
.is-success .initial { transform: translate(-900px, -800px); }
.is-success .name { transform: translateX(-320px) rotate(180deg); }
.is-success .name-caption { transform: translateX(-320px); }
.is-success .sessions { transform: translateY(-200px); }
.is-success form { transform: translate(1300px, 900px); }
.is-success .power { transform: translateY(220px); }
.is-success .finale { opacity: 1; transition-delay: 700ms; }

@keyframes turn {
    to { transform: rotate(360deg); }
}

@keyframes sweep {
    from { transform: translateX(0); }
    to { transform: translateX(646px); }
}
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="piece square"><span class="host">seiren</span></div>

    <div class="piece band">
        <span class="band-text band-date" data-clock="greeting"></span>
        <span class="band-text band-message"></span>
    </div>

    <div class="piece rule">
        <div class="clock" data-clock="time"></div>
        <div class="date" data-clock="day-month-year"></div>
    </div>

    <div class="piece disc">
        <div class="disc-turn"><span class="dot"></span></div>
        <div class="photo"></div>
    </div>

    <button class="piece initial" data-action="switch-user" title="Switch user"><span data-user-initial></span></button>

    <button class="piece name" data-action="switch-user" data-user-name title="Switch user"></button>
    <div class="piece name-caption">user</div>

    <button class="piece sessions" data-action="session" title="Next session">
        <svg class="mark-circle" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13.5"/></svg>
        <svg class="mark-square" viewBox="0 0 30 30"><rect x="1.5" y="1.5" width="27" height="27"/></svg>
        <svg class="mark-triangle" viewBox="0 0 30 30"><path d="M15 1.5 L28.5 28.5 L1.5 28.5 Z"/></svg>
        <span class="session-name" data-session-name></span>
        <span class="session-caption">session</span>
    </button>

    <form class="piece" data-login>
        <div class="diamond"><span class="sweep"></span></div>
        <div class="field-box">
            <div class="label">Password</div>
            <label class="field">
                <input data-field="password" type="password" aria-label="Password">
                <button type="button" class="reveal" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
            </label>
            <span class="capslock" data-capslock>Caps Lock is on</span>
        </div>
        <button class="go" type="submit" title="Log in">
            <svg viewBox="0 0 34 34"><path d="M4 2 L32 17 L4 32 Z" fill="currentColor"/></svg>
        </button>
        <div class="message" data-message></div>
    </form>

    <div class="piece power">
        <button data-power="suspend" title="Sleep">
            <svg viewBox="0 0 40 40" fill="currentColor"><path d="M4 28 A16 16 0 0 1 36 28 Z"/><rect x="4" y="33" width="32" height="4"/></svg>
            Sleep
        </button>
        <button data-power="reboot" title="Restart">
            <svg viewBox="0 0 40 40"><path d="M20 9 A13 13 0 1 1 8.7 15.5" fill="none" stroke="currentColor" stroke-width="5"/><path d="M18 2 L28 9 L18 16 Z" fill="currentColor"/></svg>
            Restart
        </button>
        <button data-power="shutdown" title="Power off">
            <svg viewBox="0 0 40 40"><path d="M12.5 12 A13 13 0 1 0 27.5 12" fill="none" stroke="currentColor" stroke-width="5"/><rect x="17.5" y="2" width="5" height="19" fill="currentColor"/></svg>
            Off
        </button>
    </div>

    <div class="finale">
        <div class="finale-shapes"><span></span><span></span><span></span></div>
        <div class="finale-message"></div>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
<script>
const band_message = document.querySelector(".band-message");
const finale_message = document.querySelector(".finale-message");
const session_label = document.querySelector("[data-session-name]");
console.assert(band_message !== null && finale_message !== null && session_label !== null);

function message_mirror() {
    band_message.textContent = message.textContent;
    finale_message.textContent = message.textContent;
}

function session_mark() {
    const index = SESSIONS.indexOf(session_label.textContent);
    console.assert(index !== -1, `unknown session ${session_label.textContent}`);
    stage.dataset.session = String(index);
}

const watch = { childList: true, characterData: true, subtree: true };
new MutationObserver(message_mirror).observe(message, watch);
new MutationObserver(session_mark).observe(session_label, watch);
message_mirror();
session_mark();
</script>
</body>
</html>
