<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 12 Flap</title>
<link rel="stylesheet" href="shared/base.css">
<style>
.stage {
    --housing: #0a0a0a;
    --cell: #141414;
    --bone: #e8e4da;
    --amber: #f2c230;
    --red: #d2412b;
    --label: #8c887f;
    --rule: #242424;
    background:
        radial-gradient(ellipse 120% 90% at 50% 40%, #121212 0%, var(--housing) 70%),
        var(--housing);
    color: var(--bone);
    font-family: "Adwaita Sans", "Inter", sans-serif;
}

.frame {
    position: absolute;
    inset: 30px;
    border: 1px solid #1d1d1d;
    border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03), inset 0 0 80px rgba(0, 0, 0, 0.6);
    pointer-events: none;
}

.screw {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a3a3a, #121212 70%);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05);
}

.screw::after {
    content: "";
    position: absolute;
    left: 2px;
    right: 2px;
    top: 4.5px;
    height: 1px;
    background: #050505;
    transform: rotate(35deg);
}

.screw.tl { left: 46px; top: 46px; }
.screw.tr { right: 46px; top: 46px; }
.screw.bl { left: 46px; bottom: 46px; }
.screw.br { right: 46px; bottom: 46px; }

.source {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
}

.label {
    position: absolute;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--label);
    line-height: 16px;
    white-space: nowrap;
}

.greeting {
    position: absolute;
    left: 98px;
    top: 60px;
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--bone);
}

.greeting .mark {
    width: 34px;
    height: 34px;
    border-radius: 4px;
    background: var(--amber);
    display: grid;
    place-items: center;
    color: #141414;
    font-size: 24px;
    font-weight: 800;
}

.row {
    position: absolute;
    display: flex;
    gap: 5px;
}

.row.small { gap: 4px; }

.cell {
    --bg: var(--cell);
    --fg: var(--bone);
    --size: 54px;
    --shift: 2px;
    position: relative;
    flex: none;
    width: 49px;
    height: 74px;
    perspective: 320px;
    border-radius: 4px;
    box-shadow: 0 2px 0 #000, 0 8px 16px rgba(0, 0, 0, 0.55);
}

.cell.small {
    --size: 31px;
    --shift: 1px;
    width: 32px;
    height: 46px;
    perspective: 220px;
    border-radius: 3px;
}

.cell.big {
    --size: 136px;
    --shift: 4px;
    width: 103px;
    height: 153px;
    perspective: 600px;
    border-radius: 6px;
}

.cell.word {
    --size: 27px;
    --shift: 1px;
    width: 211px;
}

.cell.word.wide { width: 265px; }

.half {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    color: var(--fg);
    background: var(--bg);
}

.half.top,
.half.front {
    top: 0;
    border-radius: inherit;
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.015));
    transform-origin: 50% 100%;
}

.half.bottom,
.half.back {
    top: 50%;
    border-radius: inherit;
    border-top-left-radius: 0;
    border-top-right-radius: 0;
    background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.28));
    transform-origin: 50% 0;
}

.half.front,
.half.back {
    z-index: 2;
    visibility: hidden;
    backface-visibility: hidden;
}

.cell.is-flipping .half.front,
.cell.is-flipping .half.back { visibility: visible; }

.half span {
    position: absolute;
    left: 0;
    width: 100%;
    height: 200%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: var(--shift);
    font-size: var(--size);
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    font-feature-settings: "tnum" 1, "case" 1;
}

.cell.word .half span { letter-spacing: 0.12em; padding-left: 0.12em; }
.half.bottom span,
.half.back span { top: -100%; }

.cell::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: calc(50% - 1px);
    height: 2px;
    z-index: 3;
    background: rgba(0, 0, 0, 0.9);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04);
}

.cell::before {
    content: "";
    position: absolute;
    left: -2px;
    right: -2px;
    top: calc(50% - 4px);
    height: 8px;
    z-index: 4;
    background: linear-gradient(90deg, #050505 0 3px, transparent 3px calc(100% - 3px), #050505 calc(100% - 3px));
    border-radius: 1px;
}

[data-tone="dim"] { --fg: #77746c; }
[data-tone="amber"] { --fg: var(--amber); }
[data-tone="alert"] { --fg: #ff8a6e; }
[data-tone="red"] { --bg: var(--red); --fg: #fff4ea; }
[data-tone="paper"] { --bg: var(--bone); --fg: #141414; }
[data-tone="gold"] { --bg: var(--amber); --fg: #141414; }

.colon {
    position: absolute;
    left: 1556px;
    top: 64px;
    width: 49px;
    height: 153px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 38px;
}

.colon::before,
.colon::after {
    content: "";
    width: 13px;
    height: 13px;
    border-radius: 2px;
    background: var(--bone);
    opacity: 0.85;
}

.rule {
    position: absolute;
    left: 98px;
    width: 1723px;
    height: 1px;
    background: var(--rule);
}

.hit {
    position: absolute;
    height: 74px;
    border-radius: 6px;
    outline: 1px solid transparent;
    outline-offset: 5px;
    transition: outline-color 150ms;
}

.hit:hover,
.hit:focus-visible { outline-color: rgba(242, 194, 48, 0.55); }

.session-hit {
    left: 692px;
    width: 373px;
    transition: outline-color 150ms, top 200ms;
}

form {
    position: absolute;
    left: 98px;
    top: 698px;
    width: 1723px;
    height: 74px;
}

form .row { left: 0; top: 0; }

form input {
    position: absolute;
    left: 0;
    top: 0;
    width: 1615px;
    height: 74px;
    z-index: 5;
    color: transparent;
    caret-color: transparent;
    font-size: 1px;
    cursor: text;
}

form input::selection { background: transparent; color: transparent; }

.pw .cell { --size: 30px; --shift: 0px; }
.pw.is-revealed .cell { --size: 50px; --shift: 2px; }

.stage .greeting,
.stage .colon,
.stage .label { transition: opacity 500ms; }
.stage .reveal { transition: opacity 500ms, color 150ms; }

.is-departed .greeting,
.is-departed .colon,
.is-departed .label,
.is-departed .reveal { opacity: 0.12; }

.pw .cell.is-caret { outline: 2px solid transparent; outline-offset: 4px; border-radius: 4px; }
form:focus-within .pw .cell.is-caret { animation: caret 1s steps(1) infinite; }

@keyframes caret {
    0% { outline-color: var(--amber); }
    50% { outline-color: transparent; }
}

.reveal {
    position: absolute;
    left: 1674px;
    top: 0;
    width: 49px;
    height: 74px;
    display: grid;
    place-items: center;
    border-radius: 4px;
    color: #a6a299;
    background: linear-gradient(180deg, #181818 50%, #111 50%);
    box-shadow: 0 2px 0 #000, 0 8px 16px rgba(0, 0, 0, 0.55);
    transition: color 150ms;
}

.reveal:hover { color: var(--amber); }
.reveal i[data-icon] { width: 28px; height: 28px; }

.capslock {
    position: absolute;
    left: 254px;
    top: 669px;
    padding: 3px 8px 2px;
    border-radius: 3px;
    background: var(--amber);
    color: #141414;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.2em;
    line-height: 16px;
}

.power {
    position: absolute;
    top: 942px;
    border-radius: 4px;
}

.power:hover .half,
.power:focus-visible .half { --fg: var(--amber); }
.power.login .half { --fg: var(--amber); }
.power.login:hover .half { --fg: #fff3c2; }

.is-busy .power.login,
.is-success .power.login { pointer-events: none; }

.is-busy .power.login .half,
.is-success .power.login .half { --fg: #77746c; }

.board-led {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #2a2a2a;
    transition: background 200ms, box-shadow 200ms;
}

.board-led.status { left: 1232px; top: 265px; }
.is-idle .board-led.status { background: #4a4535; }
.is-busy .board-led.status { background: var(--amber); box-shadow: 0 0 12px rgba(242, 194, 48, 0.7); animation: led 400ms steps(1) infinite; }
.is-error .board-led.status { background: var(--red); box-shadow: 0 0 14px rgba(210, 65, 43, 0.8); }
.is-info .board-led.status { background: var(--bone); box-shadow: 0 0 12px rgba(232, 228, 218, 0.6); }
.is-success .board-led.status { background: var(--amber); box-shadow: 0 0 14px rgba(242, 194, 48, 0.9); }

@keyframes led {
    50% { background: #4a4535; box-shadow: none; }
}
</style>

<script>
const BOARD_LEFT = 98;
const BOARD_PITCH = 54;
const BOARD_ROWS = 4;
const BOARD_ROW_TOP = 302;
const BOARD_ROW_PITCH = 84;
const USER_CELLS = 10;
const SESSION_CELLS = 7;
const STATUS_CELLS = 13;
const PASSWORD_CELLS = 30;
const REMARK_CELLS = 48;
const STATION_CELLS = 6;
const DATE_CELLS = 10;
const GATE_CELLS = 2;
const STATION_NAME = "SEIREN";
const FLIP_MS = 300;
const STAGGER_MS = 30;
const STAGGER_SMALL_MS = 14;
const SPIN_STEP_MS = 70;
const SPIN_FLIPS = 6;
const SPIN_GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
const BLANK_DELAY_MS = 950;
const BLANK_ROW_MS = 90;
const BLANK_COLUMN_MS = 9;
const REMARK_IDLE = "TYPE YOUR PASSWORD AND PRESS ENTER TO BOARD";
const GATE_NUMBER = "01";
const PASSWORD_DOT = "●";
const POWER_WORDS = { suspend: "SUSPEND", reboot: "RESTART", shutdown: "POWER OFF" };
const LOGIN_WORD = "BOARD ↵";
const INFO_OVERFLOW = "SEE REMARKS";

console.assert(USERS.length <= BOARD_ROWS, "more users than board rows");
console.assert(INFO_OVERFLOW.length <= STATUS_CELLS);
console.assert(Number(field_password.maxLength) === PASSWORD_CELLS);
console.assert(STATION_NAME.length <= STATION_CELLS);

const board_groups = [];
const board_status_cells = [];
const message_node = document.querySelector("[data-message]");
const session_hit = document.querySelector(".session-hit");
let board_state = "";
let board_blank = false;
let board_blank_timer = 0;

function face_make(cell_node, kind) {
    const face = document.createElement("div");
    face.className = `half ${kind}`;
    face.append(document.createElement("span"));
    cell_node.append(face);
    return face;
}

function face_set(face, glyph, tone) {
    face.firstChild.textContent = glyph;
    face.dataset.tone = tone;
}

function cell_make(parent, kind, x, row) {
    const node = parent.matches(".power") ? parent : document.createElement("div");
    node.classList.add("cell");
    if (kind !== "") node.classList.add(...kind.split(" "));
    const cell = {
        node,
        top: face_make(node, "top"),
        bottom: face_make(node, "bottom"),
        front: face_make(node, "front"),
        back: face_make(node, "back"),
        glyph: "",
        tone: "",
        anims: [],
        timers: [],
        spinning: false,
        x,
        row,
    };
    for (const face of [cell.top, cell.bottom, cell.front, cell.back]) face_set(face, "", "");
    if (node !== parent) parent.append(node);
    return cell;
}

function cell_stop(cell) {
    for (const timer of cell.timers) clearTimeout(timer);
    cell.timers = [];
    cell.spinning = false;
    for (const anim of cell.anims) anim.cancel();
    cell.anims = [];
    face_set(cell.bottom, cell.glyph, cell.tone);
    cell.node.classList.remove("is-flipping");
}

function cell_flip(cell, glyph, tone, delay, duration) {
    console.assert(duration > 0 && delay >= 0, duration, delay);
    for (const anim of cell.anims) anim.cancel();
    const glyph_old = cell.glyph;
    const tone_old = cell.tone;
    cell.glyph = glyph;
    cell.tone = tone;
    face_set(cell.top, glyph, tone);
    face_set(cell.bottom, glyph_old, tone_old);
    face_set(cell.front, glyph_old, tone_old);
    face_set(cell.back, glyph, tone);
    cell.node.classList.add("is-flipping");
    const half = duration / 2;
    const fall = cell.front.animate(
        [
            { transform: "rotateX(0deg)", filter: "brightness(1)" },
            { transform: "rotateX(-90deg)", filter: "brightness(0.4)" },
        ],
        { duration: half, delay, easing: "cubic-bezier(0.5, 0, 0.9, 0.5)", fill: "both" },
    );
    const land = cell.back.animate(
        [
            { transform: "rotateX(90deg)", filter: "brightness(0.5)" },
            { transform: "rotateX(-7deg)", filter: "brightness(1.08)", offset: 0.78 },
            { transform: "rotateX(0deg)", filter: "brightness(1)" },
        ],
        { duration: half * 1.2, delay: delay + half, easing: "ease-in", fill: "both" },
    );
    land.onfinish = () => {
        face_set(cell.bottom, glyph, tone);
        cell.node.classList.remove("is-flipping");
        fall.cancel();
        land.cancel();
        cell.anims = [];
    };
    cell.anims = [fall, land];
}

function cell_spin(cell, glyph, tone, delay) {
    cell_stop(cell);
    cell.spinning = true;
    const start = Math.floor(Math.random() * SPIN_GLYPHS.length);
    for (let step = 0; step < SPIN_FLIPS; step += 1) {
        const spin_glyph = SPIN_GLYPHS[(start + step) % SPIN_GLYPHS.length];
        cell.timers.push(setTimeout(() => cell_flip(cell, spin_glyph, tone, 0, SPIN_STEP_MS), delay + step * SPIN_STEP_MS));
    }
    cell.timers.push(setTimeout(() => {
        cell.spinning = false;
        cell.timers = [];
        cell_flip(cell, glyph, tone, 0, FLIP_MS);
    }, delay + SPIN_FLIPS * SPIN_STEP_MS));
}

function group_make(name, cells, stagger) {
    const group = { name, cells, stagger, glyphs: [], tones: [] };
    board_groups.push(group);
    return group;
}

function row_build(selector, count, kind, x0, pitch, row) {
    const parent = document.querySelector(selector);
    console.assert(parent !== null, selector);
    const cells = [];
    for (let index = 0; index < count; index += 1) cells.push(cell_make(parent, kind, x0 + index * pitch, row));
    return cells;
}

function table_build() {
    const table = document.querySelector('[data-board="table"]');
    const rows = [];
    for (let row = 0; row < BOARD_ROWS; row += 1) {
        const top = BOARD_ROW_TOP + row * BOARD_ROW_PITCH;
        const user_row = document.createElement(row < USERS.length ? "button" : "div");
        user_row.className = "row hit";
        user_row.style.left = `${BOARD_LEFT}px`;
        user_row.style.top = `${top}px`;
        if (row < USERS.length) {
            user_row.dataset.action = "switch-user";
            user_row.title = "Switch user";
        }
        const session_row = document.createElement("div");
        session_row.className = "row";
        session_row.style.left = `${BOARD_LEFT + 11 * BOARD_PITCH}px`;
        session_row.style.top = `${top}px`;
        const status_row = document.createElement("div");
        status_row.className = "row";
        status_row.style.left = `${BOARD_LEFT + 19 * BOARD_PITCH}px`;
        status_row.style.top = `${top}px`;
        table.append(user_row, session_row, status_row);
        const user_cells = [];
        const session_cells = [];
        const status_cells = [];
        for (let index = 0; index < USER_CELLS; index += 1) user_cells.push(cell_make(user_row, "", index * BOARD_PITCH, row + 1));
        for (let index = 0; index < SESSION_CELLS; index += 1) session_cells.push(cell_make(session_row, "", (11 + index) * BOARD_PITCH, row + 1));
        for (let index = 0; index < STATUS_CELLS; index += 1) status_cells.push(cell_make(status_row, "", (19 + index) * BOARD_PITCH, row + 1));
        rows.push({
            user: group_make("user", user_cells, STAGGER_MS),
            session: group_make("session", session_cells, STAGGER_MS),
            status: group_make("status", status_cells, STAGGER_MS),
        });
        board_status_cells.push(status_cells);
    }
    return rows;
}

const board_hours = group_make("hours", row_build('[data-board="hours"]', 2, "big", 23 * BOARD_PITCH, 2 * BOARD_PITCH, 0), 60);
const board_minutes = group_make("minutes", row_build('[data-board="minutes"]', 2, "big", 28 * BOARD_PITCH, 2 * BOARD_PITCH, 0), 60);
const board_station = group_make("station", row_build('[data-board="station"]', STATION_CELLS, "", 0, BOARD_PITCH, 0), STAGGER_MS);
const board_date = group_make("date", row_build('[data-board="date"]', DATE_CELLS, "", 7 * BOARD_PITCH, BOARD_PITCH, 0), STAGGER_MS);
const board_gate = group_make("gate", row_build('[data-board="gate"]', GATE_CELLS, "", 18 * BOARD_PITCH, BOARD_PITCH, 0), STAGGER_MS);
const board_rows = table_build();
const board_password = group_make("password", row_build('[data-board="password"]', PASSWORD_CELLS, "", 0, BOARD_PITCH, 5), 10);
const board_remarks = group_make("remarks", row_build('[data-board="remarks"]', REMARK_CELLS, "small", 0, BOARD_PITCH * 2 / 3, 6), STAGGER_SMALL_MS);
const board_login = group_make("login", [cell_make(document.querySelector(".power.login"), "word wide", 0, 7)], 0);
const board_power = group_make("power", [
    cell_make(document.querySelector('[data-power="suspend"]'), "word", 17 * BOARD_PITCH, 7),
    cell_make(document.querySelector('[data-power="reboot"]'), "word", 22 * BOARD_PITCH, 7),
    cell_make(document.querySelector('[data-power="shutdown"]'), "word wide", 27 * BOARD_PITCH, 7),
], 80);

function state_current() {
    for (const state of ["busy", "error", "info", "success", "idle"]) {
        if (stage.classList.contains(`is-${state}`)) return state;
    }
    return "idle";
}

function text_fit(text, count) {
    const upper = text.toUpperCase().trim();
    if (upper.length <= count) return upper;
    const cut = upper.slice(0, count);
    const space = cut.lastIndexOf(" ");
    return (space > count / 2 ? cut.slice(0, space) : cut).trimEnd();
}

function session_word(name) {
    return text_fit(name.split(" (")[0], SESSION_CELLS);
}

function group_fill(group, text, tone) {
    console.assert(text.length <= group.cells.length, group.name, text);
    group.glyphs = [];
    group.tones = [];
    for (let index = 0; index < group.cells.length; index += 1) {
        group.glyphs.push(index < text.length ? text[index] : "");
        group.tones.push(tone);
    }
}

function status_target(state, text) {
    switch (state) {
        case "idle": return ["READY", "amber"];
        case "busy": return ["CHECKING", "amber"];
        case "error": return ["DENIED", "red"];
        case "info": return [text.trim().length <= STATUS_CELLS ? text_fit(text, STATUS_CELLS) : INFO_OVERFLOW, "paper"];
        case "success": return ["BOARDING", "gold"];
        default:
            console.assert(false, `unknown state ${state}`);
            return ["", ""];
    }
}

function remark_tone(state) {
    if (state === "error") return "alert";
    if (state === "success") return "amber";
    return "";
}

function board_targets(state) {
    const now = new Date();
    const user_name = document.querySelector("[data-user-name]").textContent;
    const session_name = document.querySelector("[data-session-name]").textContent;
    const message_text = message_node.textContent;
    const user_active = USERS.indexOf(user_name);
    console.assert(user_active !== -1, user_name);
    group_fill(board_hours, String(now.getHours()).padStart(2, "0"), "");
    group_fill(board_minutes, String(now.getMinutes()).padStart(2, "0"), "");
    group_fill(board_station, STATION_NAME, "");
    group_fill(board_gate, GATE_NUMBER, "");
    group_fill(board_date, text_fit(document.querySelector('[data-clock="short"]').textContent, DATE_CELLS), "");
    for (let row = 0; row < BOARD_ROWS; row += 1) {
        const groups = board_rows[row];
        if (row >= USERS.length) {
            group_fill(groups.user, "", "");
            group_fill(groups.session, "", "");
            group_fill(groups.status, "", "");
            continue;
        }
        const active = row === user_active;
        group_fill(groups.user, text_fit(USERS[row], USER_CELLS), active ? "amber" : "dim");
        group_fill(groups.session, active ? session_word(session_name) : "", "amber");
        const [status_text, status_tone] = active ? status_target(state, message_text) : ["", ""];
        group_fill(groups.status, status_text, status_tone);
    }
    const length = field_password.value.length;
    console.assert(length <= PASSWORD_CELLS, length);
    const shown = field_password.type === "password" ? PASSWORD_DOT.repeat(length) : field_password.value;
    group_fill(board_password, shown, "");
    const remark = message_text === "" ? REMARK_IDLE : message_text;
    group_fill(board_remarks, text_fit(remark, REMARK_CELLS), remark_tone(state));
    board_login.glyphs = [LOGIN_WORD];
    board_login.tones = [""];
    board_power.glyphs = [POWER_WORDS.suspend, POWER_WORDS.reboot, POWER_WORDS.shutdown];
    board_power.tones = ["", "", ""];
    if (board_blank) {
        for (const group of board_groups) {
            group.glyphs = group.cells.map(() => "");
            group.tones = group.cells.map(() => "");
        }
    }
    return user_active;
}

function board_update() {
    const state = state_current();
    let spin_row = -1;
    if (state !== board_state) {
        clearTimeout(board_blank_timer);
        for (const cells of board_status_cells) {
            for (const cell of cells) if (cell.spinning) cell_stop(cell);
        }
        board_blank = false;
        if (state === "success") {
            board_blank_timer = setTimeout(() => {
                board_blank = true;
                board_update();
            }, BLANK_DELAY_MS);
        }
        board_state = state;
        if (state === "busy") spin_row = -2;
    }
    const user_active = board_targets(state);
    if (spin_row === -2) spin_row = user_active;
    session_hit.style.top = `${BOARD_ROW_TOP + user_active * BOARD_ROW_PITCH}px`;
    for (const group of board_groups) {
        let first = -1;
        for (let index = 0; index < group.cells.length; index += 1) {
            const cell = group.cells[index];
            const glyph = group.glyphs[index];
            const tone = group.tones[index];
            if (spin_row >= 0 && group === board_rows[spin_row].status) {
                cell_spin(cell, glyph, tone, index * STAGGER_MS);
                continue;
            }
            if (cell.spinning) continue;
            if (cell.glyph === glyph && cell.tone === tone) continue;
            if (first === -1) first = index;
            const delay = board_blank
                ? cell.row * BLANK_ROW_MS + (cell.x / BOARD_PITCH) * BLANK_COLUMN_MS
                : (index - first) * group.stagger;
            cell_flip(cell, glyph, tone, delay, FLIP_MS);
        }
    }
    caret_update();
}

function caret_update() {
    stage.classList.toggle("is-departed", board_blank);
    board_password.cells[0].node.parentElement.classList.toggle("is-revealed", field_password.type !== "password");
    const length = field_password.value.length;
    for (let index = 0; index < board_password.cells.length; index += 1) {
        board_password.cells[index].node.classList.toggle("is-caret", index === length && !board_blank);
    }
}

const board_observer = new MutationObserver(board_update);
board_observer.observe(stage, { attributes: true, attributeFilter: ["class"] });
board_observer.observe(message_node, { childList: true, characterData: true, subtree: true });
board_observer.observe(document.querySelector(".source"), { childList: true, characterData: true, subtree: true });
board_observer.observe(field_password, { attributes: true, attributeFilter: ["type"] });
field_password.addEventListener("input", board_update);
board_update();
</script>
</body>
</html>
