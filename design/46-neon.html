<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 46 Neon</title>
<link rel="stylesheet" href="shared/base.css">
<style>
@font-face {
    font-family: "Beon";
    src: url("assets/fonts/Beon-Regular.ttf") format("truetype");
}

@font-face {
    font-family: "Dancing Script";
    src: url("assets/fonts/DancingScript-Bold.otf") format("opentype");
    font-weight: 700;
}

.stage {
    --pink: #ff4fa3;
    --pink-core: #ffe4f1;
    --cyan: #3fe7ff;
    --cyan-core: #e6fdff;
    --red: #ff2d3d;
    --red-core: #ffe0e2;
    --amber: #ffb02e;
    --amber-core: #fff1d8;
    --warm: #ff9fc8;
    --warm-core: #fff4ea;
    --glass: rgba(236, 214, 226, 0.15);
    --glass-edge: rgba(236, 214, 226, 0.2);
    --metal: linear-gradient(90deg, #26262b, #6e6e78 45%, #32323a);
    background: #070508;
    font-family: "Beon", var(--font-sans);
    color: var(--warm-core);
}

.wall {
    position: absolute;
    inset: 0;
    background: #120a0d var(--wallpaper-blur) center / cover no-repeat;
    filter: brightness(0.46) saturate(0.6);
    transition: filter 900ms ease 400ms;
}

.bricks {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse 60% 55% at 50% 30%, rgba(255, 79, 163, 0.13), transparent 70%),
        radial-gradient(ellipse 30% 25% at 82% 72%, rgba(255, 45, 61, 0.05), transparent 70%),
        radial-gradient(ellipse 110% 85% at 50% 38%, transparent 40%, rgba(0, 0, 0, 0.82)),
        conic-gradient(from 0deg at 3px 30px, transparent 0 75%, rgba(6, 3, 4, 0.9) 75% 100%) 0 0 / 96px 60px,
        conic-gradient(from 0deg at 3px 30px, transparent 0 75%, rgba(6, 3, 4, 0.9) 75% 100%) 48px 30px / 96px 60px,
        linear-gradient(to bottom, transparent 27px, rgba(6, 3, 4, 0.9) 27px 30px) 0 0 / 96px 30px,
        linear-gradient(to bottom, rgba(255, 230, 235, 0.05) 0 2px, transparent 2px 22px, rgba(0, 0, 0, 0.18) 26px) 0 0 / 96px 30px,
        linear-gradient(90deg, rgba(0, 0, 0, 0.1) 0 96px, transparent 96px 192px, rgba(255, 200, 210, 0.015) 192px 288px) 0 0 / 288px 30px,
        linear-gradient(90deg, transparent 0 144px, rgba(0, 0, 0, 0.1) 144px 240px, transparent 240px) 0 30px / 480px 90px,
        linear-gradient(90deg, rgba(255, 210, 220, 0.03) 0 96px, transparent 96px) 48px 60px / 672px 150px,
        radial-gradient(ellipse 340px 220px at 14% 62%, rgba(40, 30, 32, 0.55), transparent 70%),
        radial-gradient(ellipse 420px 260px at 88% 22%, rgba(30, 22, 24, 0.5), transparent 70%),
        rgba(30, 13, 18, 0.58);
    transition: opacity 900ms ease 400ms;
}

.tube {
    position: relative;
    display: inline-block;
    white-space: nowrap;
    line-height: 1;
}

.tube .glass {
    display: block;
    color: var(--glass);
    text-shadow: 0 0.025em 0.02em rgba(0, 0, 0, 0.7);
}

.tube .lit {
    position: absolute;
    left: 0;
    top: 0;
    color: var(--core);
    text-shadow:
        0 0 0.01em #fff,
        0 0 0.03em var(--c),
        0 0 0.08em var(--c),
        0 0 0.18em var(--c),
        0 0 0.42em var(--c);
    transition: opacity 160ms;
}

.tube.small .lit {
    text-shadow:
        0 0 1px #fff,
        0 0 4px var(--c),
        0 0 10px var(--c),
        0 0 22px var(--c),
        0 0 44px var(--c);
}

.pink { --c: var(--pink); --core: var(--pink-core); }
.cyan { --c: var(--cyan); --core: var(--cyan-core); }
.red { --c: var(--red); --core: var(--red-core); }
.warm { --c: var(--warm); --core: var(--warm-core); }

.sign {
    position: absolute;
    left: 380px;
    top: 70px;
    width: 1160px;
    height: 510px;
}

.wash {
    position: absolute;
    inset: -260px -320px;
    background:
        radial-gradient(ellipse 34% 30% at 34% 30%, rgba(63, 231, 255, 0.1), transparent 70%),
        radial-gradient(ellipse 46% 40% at 52% 52%, rgba(255, 79, 163, 0.2), transparent 72%);
    pointer-events: none;
}

.rod {
    position: absolute;
    top: -70px;
    width: 6px;
    height: 74px;
    background: var(--metal);
    box-shadow: 4px 6px 8px rgba(0, 0, 0, 0.6);
}

.rod::after {
    content: "";
    position: absolute;
    left: -9px;
    bottom: -6px;
    width: 24px;
    height: 12px;
    border-radius: 3px;
    background: linear-gradient(180deg, #7a7a84, #2a2a30);
}

.rod.l { left: 150px; }
.rod.r { right: 150px; }

.backer {
    position: absolute;
    inset: 0;
    border-radius: 30px;
    border: 1px solid rgba(255, 240, 248, 0.1);
    background: linear-gradient(170deg, rgba(255, 245, 250, 0.06), rgba(255, 245, 250, 0.015) 40%, rgba(255, 245, 250, 0.03));
    box-shadow: 0 34px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 -1px 0 rgba(0, 0, 0, 0.4);
}

.bolt {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #c4c4cc, #5a5a62 45%, #1c1c20 75%);
    box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.6);
}

.bolt.tl { left: 24px; top: 24px; }
.bolt.tr { right: 24px; top: 24px; }
.bolt.bl { left: 24px; bottom: 24px; }
.bolt.br { right: 24px; bottom: 24px; }

.greeting {
    position: absolute;
    left: 150px;
    top: 34px;
    font-family: "Dancing Script", cursive;
    font-weight: 700;
    font-size: 116px;
    transform: rotate(-5deg);
    transform-origin: left center;
}

.clock {
    position: absolute;
    left: 0;
    right: 0;
    top: 128px;
    text-align: center;
    font-size: 300px;
    letter-spacing: 6px;
}

.date {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 50px;
    text-align: center;
    font-size: 34px;
    letter-spacing: 5px;
}

.cable {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    pointer-events: none;
    fill: none;
    stroke-linecap: round;
}

.cable .wire { stroke: #050304; stroke-width: 7; }
.cable .shine { stroke: rgba(255, 220, 235, 0.09); stroke-width: 1.5; transform: translate(-1.5px, -2px); }
.cable .hang { stroke: #6c6c74; stroke-width: 2; }

.box {
    position: absolute;
    left: 104px;
    top: 838px;
    width: 176px;
    height: 118px;
    padding: 20px 22px;
    border-radius: 6px;
    background: linear-gradient(160deg, #2c2a2e, #141316);
    border: 1px solid rgba(255, 255, 255, 0.07);
    box-shadow: 6px 14px 22px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    font: 600 13px/1.5 var(--font-sans);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(236, 214, 226, 0.34);
}

.box b { display: block; font-size: 20px; letter-spacing: 3px; color: rgba(236, 214, 226, 0.55); }
.box .unit { text-transform: none; }

.box::before,
.box::after {
    content: "";
    position: absolute;
    top: 9px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #55535a;
}

.box::before { left: 9px; }
.box::after { right: 9px; }

.arm {
    position: absolute;
    left: 1530px;
    top: 650px;
    width: 400px;
    height: 10px;
    border-radius: 2px;
    background: linear-gradient(180deg, #7a7a84, #2c2c32);
    box-shadow: 0 8px 10px rgba(0, 0, 0, 0.55);
}

.vacancy {
    position: absolute;
    left: 1488px;
    top: 704px;
    width: 340px;
    height: 160px;
    transform: rotate(1.5deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border-radius: 18px;
    background: linear-gradient(170deg, rgba(255, 245, 250, 0.05), rgba(255, 245, 250, 0.015));
    border: 1px solid rgba(255, 240, 248, 0.08);
    box-shadow: 0 22px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

.vacancy .frame {
    position: absolute;
    inset: 14px;
    border-radius: 10px;
    border: 3px solid var(--glass-edge);
    box-shadow: 0 2px 2px rgba(0, 0, 0, 0.5);
}

.vacancy .frame.lit {
    border-color: #ffb6bc;
    box-shadow: 0 0 3px var(--red), 0 0 10px var(--red), 0 0 24px var(--red), inset 0 0 6px var(--red), inset 0 0 16px rgba(255, 45, 61, 0.5);
    opacity: 0;
}

.vacancy .tube .lit { opacity: 0; }
.vacancy .word { font-size: 52px; letter-spacing: 6px; }
.vacancy .word2 { font-size: 30px; letter-spacing: 7px; }

form {
    position: absolute;
    left: 520px;
    top: 632px;
    width: 880px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.who {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 4px 14px;
    font-size: 54px;
    letter-spacing: 2px;
}

.chev {
    width: 22px;
    height: 34px;
    fill: none;
    stroke: rgba(236, 214, 226, 0.32);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 150ms, filter 150ms;
}

.who:hover .chev {
    stroke: var(--warm-core);
    filter: drop-shadow(0 0 3px var(--warm)) drop-shadow(0 0 9px var(--warm));
}

.field {
    position: relative;
    width: 640px;
    height: 82px;
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 18px 0 40px;
    border-radius: 41px;
    border: 3px solid var(--glass-edge);
    box-shadow: 0 3px 3px rgba(0, 0, 0, 0.55);
    transition: border-color 160ms, box-shadow 160ms;
}

.field:focus-within,
.is-busy .field {
    border-color: var(--cyan-core);
    box-shadow:
        0 0 3px var(--cyan),
        0 0 10px var(--cyan),
        0 0 26px rgba(63, 231, 255, 0.65),
        0 0 60px rgba(63, 231, 255, 0.25),
        inset 0 0 4px var(--cyan),
        inset 0 0 18px rgba(63, 231, 255, 0.35);
}

.field input {
    flex: 1;
    min-width: 0;
    height: 100%;
    font-family: "Beon", var(--font-sans);
    font-size: 34px;
    letter-spacing: 10px;
    color: var(--cyan-core);
    caret-color: var(--cyan);
    text-shadow: 0 0 2px #fff, 0 0 8px var(--cyan), 0 0 18px var(--cyan);
}

.field input::placeholder {
    color: rgba(236, 214, 226, 0.26);
    opacity: 1;
    letter-spacing: 6px;
    text-shadow: none;
}

.field button {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: rgba(230, 253, 255, 0.45);
    transition: color 150ms, filter 150ms;
}

.field button:hover {
    color: var(--cyan-core);
    filter: drop-shadow(0 0 3px var(--cyan)) drop-shadow(0 0 8px var(--cyan));
}

.field i[data-icon] { width: 24px; height: 24px; }
.field .go svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

.notes {
    height: 90px;
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    font-size: 26px;
    letter-spacing: 2px;
}

.message {
    padding: 8px 26px;
    border-radius: 24px;
    border: 2px solid transparent;
    color: var(--glass);
    text-shadow: 0 2px 2px rgba(0, 0, 0, 0.6);
}

.message:empty { visibility: hidden; }

.capslock {
    font-size: 20px;
    letter-spacing: 4px;
    color: var(--amber-core);
    text-shadow: 0 0 1px #fff, 0 0 4px var(--amber), 0 0 12px var(--amber), 0 0 26px var(--amber);
}

.sessions {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 26px;
    padding: 8px 18px;
    font-size: 28px;
    letter-spacing: 3px;
}

.sessions .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--glass-edge);
}

.sessions .s .lit { opacity: 0; }
.sessions .s.on .lit { opacity: 1; animation: buzz-on 520ms linear; }
.who .tube.buzz .lit { animation: buzz-on 520ms linear; }
.sessions .s .glass { color: rgba(236, 214, 226, 0.28); }
.sessions:hover .s:not(.on) .glass { color: rgba(236, 214, 226, 0.4); }

.power {
    position: absolute;
    right: 72px;
    bottom: 58px;
    display: flex;
    gap: 18px;
}

.power button {
    width: 92px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 12px 0 8px;
    border-radius: 14px;
    font-size: 17px;
    letter-spacing: 3px;
    color: rgba(236, 214, 226, 0.45);
}

.power svg {
    width: 46px;
    height: 46px;
    fill: none;
    stroke: var(--core);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.62;
    filter: drop-shadow(0 0 2px var(--c)) drop-shadow(0 0 7px var(--c)) drop-shadow(0 0 16px var(--c));
    transition: opacity 150ms;
}

.power button:hover svg { opacity: 1; }
.power button:hover { color: var(--core); text-shadow: 0 0 4px var(--c), 0 0 12px var(--c); }

.blackout {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms;
}

.greeting .lit { animation: idle-flicker 13s linear infinite; }

.is-busy .tube .lit,
.is-busy .sessions .s.on .lit { animation: hum 1.1s steps(1, end) infinite; animation-delay: var(--d, 0ms); }
.is-busy .vacancy .tube .lit { animation: none; }
.is-busy .field { animation: field-hum 1.1s steps(1, end) infinite; }
.is-busy .message {
    color: var(--cyan-core);
    text-shadow: 0 0 1px #fff, 0 0 5px var(--cyan), 0 0 14px var(--cyan), 0 0 30px var(--cyan);
}

.is-error .sign .lit,
.is-error .sign .wash { animation: sputter 1700ms linear both; }
.is-error .bricks { animation: wall-dim 1700ms linear both; }
.is-error .vacancy .lit { opacity: 1; animation: buzz-on 900ms linear 260ms both; }
.is-error .field {
    border-color: var(--red-core);
    box-shadow:
        0 0 3px var(--red),
        0 0 10px var(--red),
        0 0 26px rgba(255, 45, 61, 0.7),
        0 0 60px rgba(255, 45, 61, 0.28),
        inset 0 0 4px var(--red),
        inset 0 0 18px rgba(255, 45, 61, 0.35);
    animation: shake 380ms ease-in-out;
}
.is-error .field input { color: var(--red-core); caret-color: var(--red); text-shadow: 0 0 2px #fff, 0 0 8px var(--red), 0 0 18px var(--red); }
.is-error .message {
    color: var(--red-core);
    text-shadow: 0 0 1px #fff, 0 0 5px var(--red), 0 0 14px var(--red), 0 0 30px var(--red);
}

.is-info .message {
    color: var(--amber-core);
    text-shadow: 0 0 1px #fff, 0 0 5px var(--amber), 0 0 14px var(--amber), 0 0 30px var(--amber);
    border-color: #ffe2b0;
    box-shadow: 0 0 3px var(--amber), 0 0 10px var(--amber), 0 0 24px rgba(255, 176, 46, 0.5), inset 0 0 3px var(--amber), inset 0 0 12px rgba(255, 176, 46, 0.35);
    animation: buzz-on 600ms linear;
}

.is-success .tube .lit,
.is-success .sessions .s .lit { opacity: 1; animation: flare 700ms ease-out forwards; }
.is-success .vacancy .tube .lit { opacity: 0; animation: none; }
.is-success .power svg { opacity: 1; }
.is-success .field {
    border-color: #fff;
    box-shadow: 0 0 4px var(--cyan), 0 0 14px var(--cyan), 0 0 40px var(--cyan), 0 0 90px rgba(63, 231, 255, 0.4), inset 0 0 20px rgba(63, 231, 255, 0.5);
}
.is-success .message {
    color: var(--pink-core);
    text-shadow: 0 0 1px #fff, 0 0 6px var(--pink), 0 0 16px var(--pink), 0 0 34px var(--pink);
}
.is-success .wall { filter: brightness(0) saturate(0); }
.is-success .bricks { opacity: 0; }
.is-success .blackout { opacity: 1; transition: opacity 900ms ease-in 1400ms; }

@keyframes idle-flicker {
    0%, 70%, 71.2%, 72.4%, 100% { opacity: 1; }
    70.6% { opacity: 0.25; }
    71.8% { opacity: 0.55; }
}

@keyframes hum {
    0% { filter: brightness(1); }
    12% { filter: brightness(0.8); }
    20% { filter: brightness(1.05); }
    46% { filter: brightness(0.9); }
    52% { filter: brightness(0.68); }
    58% { filter: brightness(1); }
    80% { filter: brightness(0.86); }
    88% { filter: brightness(1); }
}

@keyframes field-hum {
    0%, 20%, 58%, 88% { opacity: 1; }
    12%, 46%, 80% { opacity: 0.84; }
    52% { opacity: 0.7; }
}

@keyframes sputter {
    0% { opacity: 1; }
    4% { opacity: 0.15; }
    7% { opacity: 0.9; }
    10% { opacity: 0.05; }
    13% { opacity: 0.6; }
    15% { opacity: 0; }
    62% { opacity: 0; }
    65% { opacity: 0.55; }
    67% { opacity: 0.05; }
    72% { opacity: 0.8; }
    75% { opacity: 0.3; }
    80%, 100% { opacity: 1; }
}

@keyframes wall-dim {
    0%, 100% { filter: brightness(1); }
    15%, 62% { filter: brightness(0.6); }
}

@keyframes buzz-on {
    0% { opacity: 0; }
    12% { opacity: 0.8; }
    18% { opacity: 0.1; }
    30% { opacity: 0.9; }
    38% { opacity: 0.3; }
    55%, 100% { opacity: 1; }
}

@keyframes flare {
    0% { filter: brightness(1); }
    35% { filter: brightness(2.1) saturate(0.7); }
    100% { filter: brightness(1.45) saturate(0.85); }
}
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="wall"></div>
    <div class="bricks"></div>

    <svg class="cable" viewBox="0 0 1920 1080" aria-hidden="true">
        <path class="wire" d="M470 580 C 470 700, 250 700, 210 838"/>
        <path class="shine" d="M470 580 C 470 700, 250 700, 210 838"/>
        <path class="wire" d="M150 956 C 150 1010, 120 1040, 90 1090"/>
        <path class="shine" d="M150 956 C 150 1010, 120 1040, 90 1090"/>
        <path class="wire" d="M1820 790 C 1880 780, 1890 700, 1930 690"/>
        <path class="shine" d="M1820 790 C 1880 780, 1890 700, 1930 690"/>
        <path class="hang" d="M1568 660 L 1566 706"/>
        <path class="hang" d="M1752 660 L 1750 710"/>
    </svg>

    <div class="sign">
        <div class="wash"></div>
        <span class="rod l"></span>
        <span class="rod r"></span>
        <div class="backer"></div>
        <span class="bolt tl"></span>
        <span class="bolt tr"></span>
        <span class="bolt bl"></span>
        <span class="bolt br"></span>

        <div class="greeting">
            <span class="tube cyan" style="--d: 180ms"><span class="glass" data-clock="greeting"></span><span class="lit" data-clock="greeting"></span></span>
        </div>
        <div class="clock tabular">
            <span class="tube pink"><span class="glass" data-clock="time"></span><span class="lit" data-clock="time"></span></span>
        </div>
        <div class="date">
            <span class="tube small warm" style="--d: 420ms"><span class="glass" data-clock="long"></span><span class="lit" data-clock="long"></span></span>
        </div>
    </div>

    <div class="box"><b>seiren</b>tube supply<br>6 <span class="unit">kV</span> · 30 <span class="unit">mA</span></div>

    <div class="arm"></div>
    <div class="vacancy">
        <span class="frame"></span>
        <span class="frame lit"></span>
        <span class="tube red word"><span class="glass">WRONG</span><span class="lit">WRONG</span></span>
        <span class="tube small red word2"><span class="glass">PASSWORD</span><span class="lit">PASSWORD</span></span>
    </div>

    <form data-login>
        <button type="button" class="who" data-action="switch-user" title="Switch user">
            <svg class="chev" viewBox="0 0 22 34"><path d="M17 4 L5 17 L17 30"/></svg>
            <span class="tube warm" style="--d: 300ms"><span class="glass" data-user-name></span><span class="lit" data-user-name></span></span>
            <svg class="chev" viewBox="0 0 22 34"><path d="M5 4 L17 17 L5 30"/></svg>
        </button>
        <label class="field">
            <input data-field="password" type="password" placeholder="password" aria-label="Password">
            <button type="button" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
            <button type="submit" class="go" title="Log in"><svg viewBox="0 0 28 28"><path d="M5 14 H22 M15 7 L22 14 L15 21"/></svg></button>
        </label>
        <div class="notes">
            <span class="message" data-message></span>
            <span class="capslock" data-capslock>CAPS LOCK</span>
        </div>
        <button type="button" class="sessions" data-action="session" title="Next session">
            <span class="tube small pink s" style="--d: 90ms"><span class="glass">niri</span><span class="lit">niri</span></span>
            <span class="dot"></span>
            <span class="tube small pink s" style="--d: 90ms"><span class="glass">Plasma (Wayland)</span><span class="lit">Plasma (Wayland)</span></span>
            <span class="dot"></span>
            <span class="tube small pink s" style="--d: 90ms"><span class="glass">Shell</span><span class="lit">Shell</span></span>
            <span data-session-name hidden></span>
        </button>
    </form>

    <div class="power">

<script>
const session_tubes = document.querySelectorAll(".sessions .s");
const user_tube = document.querySelector(".who .tube");
console.assert(session_tubes.length === SESSIONS.length, "one tube per session");

function sessions_paint() {
    for (let index = 0; index < session_tubes.length; index += 1) {
        session_tubes[index].classList.toggle("on", index === session_index);
    }
}

function user_buzz() {
    user_tube.classList.remove("buzz");
    void user_tube.offsetWidth;
    user_tube.classList.add("buzz");
}

function on_neon_click(event) {
    if (event.target.closest('[data-action="switch-user"]') !== null) user_buzz();
    sessions_paint();
}

document.addEventListener("click", on_neon_click);
user_tube.addEventListener("animationend", () => user_tube.classList.remove("buzz"));
sessions_paint();
</script>
