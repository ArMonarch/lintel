<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 07 Terminal</title>
<link rel="stylesheet" href="shared/base.css">
<style>
/* TODO-UPDATE-COMMENT: the error text comes from demo.js ("Login failed. Check your
   password and try again."); only the prompts and the key bar use getty wording.
   ---
   07 Terminal: a nod to agreety and the TTY login greetd started from, and to
   the terminal-style SDDM themes. A monospace console over the dark wall,
   with getty's wording ("Login incorrect") and Breeze icons in the key bar. */

.stage { font-family: "Iosevka Nerd Font", "JetBrainsMono Nerd Font", monospace; }

.console {
    position: absolute;
    left: 120px;
    top: 310px;
    width: 760px;
    border-radius: 10px;
    border: 1px solid rgba(242, 232, 216, 0.14);
    background: rgba(10, 6, 6, 0.9);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    transition: border-color 200ms;
}

.title {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid rgba(242, 232, 216, 0.1);
    font-size: 14px;
    color: rgba(242, 232, 216, 0.5);
}

.title b { color: var(--lacquer); font-weight: 700; }

.body {
    padding: 22px 26px 24px;
    font-size: 20px;
    line-height: 1.75;
}

.dim { color: rgba(242, 232, 216, 0.42); }
.date { color: rgba(242, 232, 216, 0.68); }
.host { color: var(--jade); }
.prompt { color: var(--gold); }

.line { display: flex; align-items: center; white-space: pre; transition: opacity 600ms; }

.line input {
    flex: 1;
    min-width: 0;
    color: transparent;
    caret-color: transparent;
}

.line input::selection { background: transparent; }

.echo { color: var(--parchment); }

.echo::after {
    content: "█";
    color: rgba(242, 232, 216, 0.35);
}

.line:focus-within .echo::after {
    color: var(--parchment);
    animation: blink 1s steps(1, end) infinite;
}

.is-busy .echo::after,
.is-success .echo::after { content: ""; }

@keyframes blink {
    50% { opacity: 0; }
}

.user-switch { color: var(--parchment); text-decoration: underline dotted rgba(242, 232, 216, 0.4); text-underline-offset: 5px; }
.user-switch:hover { color: var(--gold); }

.notes { min-height: 1.75em; display: flex; flex-direction: column; }
.message { color: rgba(242, 232, 216, 0.75); }
.message:not(:empty)::before { content: "» "; color: var(--gold); }
.capslock { color: var(--gold); }

.is-busy .message::before { content: "| "; color: var(--gold); animation: spinner 480ms steps(1, end) infinite; }

@keyframes spinner {
    0% { content: "| "; }
    25% { content: "/ "; }
    50% { content: "- "; }
    75% { content: "\\ "; }
}

.is-error .message { color: var(--danger); }
.is-error .message:not(:empty)::before { content: "✗ "; color: var(--danger); }
.is-error .console { border-color: rgba(255, 122, 107, 0.45); animation: shake 360ms ease-in-out; }

.is-info .message { color: var(--jade); }

.is-success .message { color: var(--parchment); }
.is-success .message:not(:empty)::before { content: "✓ "; color: var(--jade); }
.is-success .body > .line,
.is-success .title,
.is-success .keys { opacity: 0.3; }

.keys {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    height: 50px;
    border-top: 1px solid rgba(242, 232, 216, 0.1);
    background: rgba(242, 232, 216, 0.03);
    transition: opacity 600ms;
}

.keys .mod {
    margin-right: 6px;
    padding-left: 6px;
    font-size: 13px;
    color: rgba(242, 232, 216, 0.4);
}

.keys button {
    height: 34px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px 0 6px;
    border-radius: 6px;
    font-size: 15px;
    color: rgba(242, 232, 216, 0.72);
}

.keys button:hover { color: var(--parchment); background: rgba(242, 232, 216, 0.08); }
.keys .session { margin-right: auto; }
.keys .session b { color: var(--jade); font-weight: 600; }
.keys i[data-icon] { width: 20px; height: 20px; }

.keys kbd {
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    min-width: 22px;
    height: 22px;
    display: inline-grid;
    place-items: center;
    padding: 0 5px;
    border-radius: 4px;
    background: rgba(242, 232, 216, 0.82);
    color: var(--ink);
}

.keys button:hover kbd { background: var(--gold); }
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="console">
        <div class="title">
            <span><b>lintel</b> 0.1.0</span>
            <span>seiren · tty1</span>
        </div>
        <form class="body" data-login>
            <div class="line dim">NixOS 26.05 (Yarara) · Linux 7.2.7-zen1</div>
            <div class="line date"><span data-clock="long"></span>, <span data-clock="time"></span></div>
            <div class="line">&nbsp;</div>
            <div class="line"><span class="host">seiren</span><span class="prompt"> login: </span><button type="button" class="user-switch" data-action="switch-user" data-user-name title="Switch user"></button></div>
            <label class="line"><span class="prompt">password: </span><span class="echo" data-echo></span><input data-field="password" type="password" spellcheck="false" autocomplete="off"></label>
            <div class="notes">
                <span class="message" data-message></span>
                <span class="capslock" data-capslock>! caps lock is on</span>
            </div>
        </form>
        <div class="keys">
            <span class="mod">ctrl+alt</span>
            <button class="session" data-action="session"><kbd>S</kbd>session <b data-session-name></b></button>
            <button data-power="suspend"><kbd>Z</kbd><i data-icon="system-suspend"></i>suspend</button>
            <button data-power="reboot"><kbd>B</kbd><i data-icon="system-reboot"></i>reboot</button>
            <button data-power="shutdown"><kbd>Q</kbd><i data-icon="system-shutdown"></i>poweroff</button>
        </div>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
<script>
const ECHO_MAX = 40;
const echo = document.querySelector("[data-echo]");
console.assert(echo !== null, "design has no [data-echo]");

function echo_sync() {
    const count = Math.min(field_password.value.length, ECHO_MAX);
    echo.textContent = "*".repeat(count);
}

field_password.addEventListener("input", echo_sync);
new MutationObserver(echo_sync).observe(stage, { attributes: true, attributeFilter: ["class"] });
echo_sync();
</script>
</body>
</html>
