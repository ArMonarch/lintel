<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 51 Unlock</title>
<link rel="stylesheet" href="shared/base.css?v=20261123g">
<style>
.stage {
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --lift: 520ms;
    --breeze: #3daee9;
    --negative: #ff8a80;
    --kde-text: #fcfcfc;
    --kde-base: #2a2e32;
    --kde-frame: rgba(252, 252, 252, 0.2);
    background: #0b0d10;
    color: #fff;
}

.bg {
    position: absolute;
    inset: -40px;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    transition: opacity var(--lift) var(--ease), transform var(--lift) var(--ease);
}

.bg.sharp { background-image: var(--wallpaper, url("assets/wallpapers/qi.jpg")); }

.bg.soft {
    background-image: var(--wallpaper-blur, url("assets/wallpapers/qi-blur.jpg"));
    opacity: 1;
    transform: scale(1.04);
}

.dim {
    position: absolute;
    inset: 0;
    background: rgba(8, 10, 14, 0.42);
    transition: opacity var(--lift) var(--ease);
}

.shade {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0) 38%),
        linear-gradient(0deg, rgba(0, 0, 0, 0.32) 0%, rgba(0, 0, 0, 0) 30%);
    opacity: 0;
    transition: opacity var(--lift) var(--ease);
}

.is-locked .bg.soft { opacity: 0; transform: scale(1); }
.is-locked .dim { opacity: 0; }
.is-locked .shade { opacity: 1; }

.lock {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 150px;
    opacity: 0;
    transform: translateY(-140px);
    pointer-events: none;
    transition: opacity 360ms var(--ease), transform var(--lift) var(--ease);
}

.is-locked .lock {
    opacity: 1;
    transform: none;
    pointer-events: auto;
    cursor: pointer;
}

.lock-time {
    font-size: 148px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -2px;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
}

.lock-date {
    margin-top: 14px;
    font-size: 30px;
    font-weight: 500;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.4);
}

.lock-hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 64px;
    text-align: center;
    font-size: 16px;
    color: rgba(255, 255, 255, 0.72);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    animation: hint-breathe 3200ms ease-in-out infinite;
}

@keyframes hint-breathe {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
}

.login {
    position: absolute;
    inset: 0;
    opacity: 1;
    transform: none;
    transition: opacity 420ms var(--ease) 140ms, transform var(--lift) var(--ease) 80ms;
}

.is-locked .login {
    opacity: 0;
    transform: translateY(48px) scale(0.98);
    pointer-events: none;
    transition: opacity 220ms var(--ease), transform 300ms var(--ease);
}

.center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 128px;
}

.clock {
    font-size: 92px;
    font-weight: 300;
    line-height: 1;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
}

.date {
    margin-top: 10px;
    font-size: 22px;
    color: rgba(255, 255, 255, 0.86);
}

form {
    margin-top: 92px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 400ms var(--ease);
}

.avatar {
    width: 126px;
    height: 126px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 2px solid var(--kde-text);
    background: rgba(42, 46, 50, 0.6);
    transition: opacity 200ms;
}

.avatar i[data-icon] { width: 64px; height: 64px; }

.name {
    margin-top: 18px;
    font-size: 18.67px;
    transition: opacity 200ms;
}

.notes {
    margin-top: 8px;
    min-height: 18px;
    max-width: 288px;
    text-align: center;
    font-size: 13.33px;
    font-style: italic;
    line-height: 18px;
}

.message:not(:empty) ~ .capslock::before { content: "\2022\00a0"; }

.entry {
    position: relative;
    margin-top: 5px;
    display: flex;
}

.field {
    width: 251px;
    height: 32px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 6px 0 8px;
    border-radius: 5px;
    border: 1px solid var(--kde-frame);
    background: var(--kde-base);
    color: var(--kde-text);
    transition: border-color 100ms, box-shadow 100ms, opacity 200ms;
}

.field:hover { border-color: var(--breeze); }

.field:focus-within {
    border-color: var(--breeze);
    box-shadow: 0 0 0 2px rgba(61, 174, 233, 0.33);
}

.field input { flex: 1; min-width: 0; font-size: 14.67px; }

.reveal { display: inline-flex; color: rgba(252, 252, 252, 0.7); }
.reveal:hover { color: var(--kde-text); }
.reveal i[data-icon] { width: 16px; height: 16px; }

.go {
    position: absolute;
    top: 0;
    left: calc(100% + 5px);
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 5px;
    border: 1px solid var(--kde-frame);
    background: var(--kde-base);
    color: var(--kde-text);
    transition: border-color 100ms, background 100ms, opacity 200ms;
}

.go:hover { border-color: var(--breeze); }
.go:active { border-color: var(--breeze); background: rgba(61, 174, 233, 0.33); }
.go i[data-icon] { width: 16px; height: 16px; }

.is-busy .avatar,
.is-busy .name { opacity: 0.75; }
.is-busy .field,
.is-busy .go { opacity: 0.6; }
.is-busy form,
.is-busy .actions { pointer-events: none; }

.is-error form,
.is-error .actions { animation: kde-reject 600ms linear; }

@keyframes kde-reject {
    0% { transform: translateX(0); }
    2.86% { transform: translateX(-15px); }
    9.14% { transform: translateX(15px); }
    16.45% { transform: translateX(-15px); }
    25.31% { transform: translateX(15px); }
    37% { transform: translateX(-15px); }
    56.32% { transform: translateX(15px); }
    100% { transform: translateX(0); }
}

.actions {
    margin-top: 24px;
    display: flex;
    gap: 8px;
    transition: opacity 400ms var(--ease);
}

.actions button {
    width: 88px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 4px;
    font-size: 14.67px;
    color: var(--kde-text);
    opacity: 0.85;
    transition: opacity 200ms;
}

.actions button:hover,
.actions button:focus-visible { opacity: 1; }

.actions .ring {
    width: 56px;
    height: 56px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    transition: background 200ms;
}

.actions button:hover .ring,
.actions button:focus-visible .ring { background: rgba(252, 252, 252, 0.15); }
.actions button:active .ring { background: rgba(252, 252, 252, 0.3); }
.actions i[data-icon] { width: 48px; height: 48px; }

.footer {
    position: absolute;
    left: 4px;
    right: 4px;
    bottom: 4px;
    display: flex;
    gap: 4px;
    transition: opacity 400ms var(--ease);
}

.tool {
    padding: 6px 8px;
    border-radius: 5px;
    font-size: 13.33px;
    color: var(--kde-text);
    transition: background 100ms;
}

.tool:hover { background: rgba(252, 252, 252, 0.1); }
div.tool { cursor: default; }
div.tool:hover { background: none; }

.is-success .bg.soft { opacity: 0; transform: scale(1); }
.is-success .dim { opacity: 0.2; }
.is-success .actions,
.is-success .footer,
.is-success .clock,
.is-success .date,
.is-success .avatar,
.is-success .name,
.is-success .entry { opacity: 0; }
.is-success .avatar,
.is-success .name,
.is-success .entry,
.is-success .clock,
.is-success .date { transition: opacity 400ms var(--ease); }
.is-success .message { font-size: 20px; color: #fff; }
</style>
</head>
<body>
<div class="stage is-locked" data-stage data-login-failed="Login Failed">
    <div class="bg sharp"></div>
    <div class="bg soft"></div>
    <div class="dim"></div>
    <div class="shade"></div>

    <div class="lock" data-lock>
        <div class="lock-time tabular" data-clock="time"></div>
        <div class="lock-date" data-clock="long"></div>
        <div class="lock-hint">Press any key or click to sign in</div>
    </div>

    <div class="login">
        <div class="center">
            <div class="clock tabular" data-clock="time"></div>
            <div class="date" data-clock="long"></div>

            <form data-login>
                <div class="avatar"><i data-icon="user-identity"></i></div>
                <div class="name" data-user-name></div>
                <div class="notes">
                    <span class="message" data-message></span>
                    <span class="capslock" data-capslock>Caps Lock is on</span>
                </div>
                <div class="entry">
                    <label class="field">
                        <input data-field="password" data-masked type="text" placeholder="Password" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off">
                        <button type="button" class="reveal" data-action="reveal" title="Show password">
                            <i data-icon="view-visible"></i>
                        </button>
                    </label>
                    <button class="go" type="submit" title="Log in"><i data-icon="go-next"></i></button>
                </div>
            </form>

            <div class="actions">
                <button data-power="suspend"><span class="ring"><i data-icon="system-suspend"></i></span>Sleep</button>
                <button data-power="reboot"><span class="ring"><i data-icon="system-reboot"></i></span>Restart</button>
                <button data-power="shutdown"><span class="ring"><i data-icon="system-shutdown"></i></span>Shut Down</button>
                <button data-action="switch-user"><span class="ring"><i data-icon="system-switch-user"></i></span>Other User</button>
            </div>
        </div>

        <div class="footer">
            <div class="tool">Keyboard Layout: English (US)</div>
            <button class="tool" data-action="session">Desktop Session: <span data-session-name></span></button>
        </div>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · any key / click unlocks · <b>Esc</b> lock · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
