<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintel · 08 Scroll</title>
<link rel="stylesheet" href="shared/base.css">
<style>
/* 08 Scroll: answers the painting's own vertical inscription (夜雨青灯画鬼狐,
   framed by jade marks) with a vertical kanji clock on the dark left wall.
   GTK has no writing-mode, so each glyph is its own label in a vertical box;
   the mock does the same with one span per glyph. */

.wall {
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(760px 600px at 0 100%, rgba(13, 7, 6, 0.66), rgba(13, 7, 6, 0) 72%),
        linear-gradient(90deg,
            rgba(13, 7, 6, 0.88) 0,
            rgba(13, 7, 6, 0.82) 150px,
            rgba(13, 7, 6, 0.72) 300px,
            rgba(13, 7, 6, 0.58) 420px,
            rgba(13, 7, 6, 0.41) 520px,
            rgba(13, 7, 6, 0.25) 610px,
            rgba(13, 7, 6, 0.12) 680px,
            rgba(13, 7, 6, 0.05) 750px,
            rgba(13, 7, 6, 0.015) 820px,
            rgba(13, 7, 6, 0) 900px);
}

.columns {
    position: absolute;
    left: 104px;
    top: 76px;
    display: flex;
    gap: 22px;
    font-family: var(--font-serif-cjk);
}

.column {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.column::before, .column::after {
    content: "";
    width: 4px;
    height: 24px;
    border-radius: 1px;
    background: var(--jade);
    transition: opacity 300ms, box-shadow 500ms;
}

.column::before { margin-bottom: 12px; }
.column::after { margin-top: 12px; }

.time { font-size: 68px; font-weight: 700; line-height: 1.04; color: var(--parchment); }
/* Narrow enough to stay left of the painting's own calligraphy at x≈235. */
.date { font-size: 28px; font-weight: 500; line-height: 1.2; color: rgba(242, 232, 216, 0.72); }
.date span:first-child { padding-top: 6px; }

.latin {
    position: absolute;
    left: 112px;
    top: 740px;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(242, 232, 216, 0.6);
    transition: opacity 400ms;
}

.latin b { font-weight: 600; color: rgba(242, 232, 216, 0.85); }

form {
    position: absolute;
    left: 110px;
    top: 798px;
    width: 400px;
}

.who { display: flex; align-items: center; gap: 14px; transition: opacity 400ms; }

.seal {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 4px;
    background: var(--lacquer-deep);
    font-family: var(--font-serif-cjk);
    font-size: 24px;
    font-weight: 700;
    box-shadow: inset 0 0 0 3px var(--lacquer-deep), inset 0 0 0 4px rgba(255, 220, 200, 0.4);
    transition: background 400ms, box-shadow 400ms, color 400ms;
}

.name {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-left: -10px;
    padding: 6px 8px 6px 10px;
    border-radius: 6px;
    font-size: 20px;
    font-weight: 600;
    transition: background 120ms;
}

.name:hover { background: rgba(242, 232, 216, 0.08); }
.name i[data-icon] { width: 20px; height: 20px; opacity: 0.55; transition: opacity 120ms; }
.name:hover i[data-icon] { opacity: 1; }

.entry { margin-top: 22px; display: flex; align-items: center; gap: 12px; transition: opacity 400ms; }

.field {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 46px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid rgba(242, 232, 216, 0.3);
    transition: border-color 150ms;
}

.field::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 0;
    height: 2px;
    background: var(--jade);
}

.field:focus-within { border-color: var(--jade); }
.field input { flex: 1; min-width: 0; font-size: 17px; caret-color: var(--jade); }
.field input[type="password"] { font-size: 22px; letter-spacing: 4px; }
.field input::placeholder { font-size: 17px; letter-spacing: 0.5px; }

.reveal { display: inline-flex; padding: 4px; border-radius: 6px; color: rgba(242, 232, 216, 0.5); }
.reveal:hover { color: var(--parchment); background: rgba(242, 232, 216, 0.08); }

.go {
    flex: none;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 4px;
    background: var(--lacquer);
    box-shadow: inset 0 0 0 3px var(--lacquer), inset 0 0 0 4px rgba(255, 220, 200, 0.3);
    transition: opacity 200ms, background 120ms, box-shadow 120ms;
}

.go:hover { background: #dc4d37; box-shadow: inset 0 0 0 3px #dc4d37, inset 0 0 0 4px rgba(255, 220, 200, 0.45); }

.notes { margin-top: 12px; min-height: 40px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; transition: transform 500ms; }
.message { display: flex; align-items: center; gap: 9px; line-height: 1.3; color: rgba(242, 232, 216, 0.75); transition: color 200ms; }
.message:empty { display: none; }

.message::before {
    content: "";
    flex: none;
    width: 4px;
    height: 14px;
    border-radius: 1px;
    background: currentColor;
    opacity: 0.6;
}

.is-error .message { color: var(--danger); }
.is-info .message, .is-success .message { color: #9fe0d2; }
.is-info .message::before, .is-success .message::before { background: var(--jade); opacity: 1; }
.capslock { color: var(--gold); }
.is-error .entry { animation: shake 360ms ease-in-out; }
.is-error .field { border-color: var(--danger); }
.is-info .field { border-color: var(--jade); }
.is-info .message::before { animation: breathe 1100ms ease-in-out infinite alternate; }
.is-busy .go { opacity: 0.4; pointer-events: none; }
.is-busy .field::after { animation: sweep 1200ms ease-in-out infinite; }
.is-busy .message::before { background: var(--jade); opacity: 1; animation: breathe 700ms ease-in-out infinite alternate; }
.is-busy .column::before, .is-busy .column::after { animation: breathe 1100ms ease-in-out infinite alternate; }
.is-success .entry, .is-success .footer, .is-success .name i[data-icon] { opacity: 0; }
.is-success .notes { transform: translateY(-48px); }
.is-success .message { font-size: 17px; }
.is-success .column::before, .is-success .column::after { box-shadow: 0 0 14px var(--jade); }

.is-success .seal {
    color: var(--ink);
    background: var(--jade);
    box-shadow: inset 0 0 0 3px var(--jade), inset 0 0 0 4px rgba(13, 7, 6, 0.45), 0 0 20px rgba(63, 174, 154, 0.55);
}

@keyframes sweep {
    0% { left: 0; width: 0; }
    45% { left: 0; width: 100%; }
    100% { left: 100%; width: 0; }
}

@keyframes breathe {
    from { opacity: 1; }
    to { opacity: 0.3; }
}

.footer {
    position: absolute;
    left: 98px;
    bottom: 44px;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: opacity 400ms;
}

.footer button {
    height: 40px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    border-radius: 6px;
    font-size: 14px;
    color: rgba(242, 232, 216, 0.65);
    transition: color 120ms, background 120ms;
}

.footer button:hover { color: var(--parchment); background: rgba(242, 232, 216, 0.08); }
.footer b { color: var(--parchment); font-weight: 600; }
.footer .rule { width: 1px; height: 18px; margin: 0 8px 0 6px; background: rgba(242, 232, 216, 0.2); }
.footer [data-power] { width: 40px; padding: 0; justify-content: center; }
.footer i[data-icon] { width: 24px; height: 24px; }
</style>
</head>
<body>
<div class="stage" data-stage>
    <div class="wall"></div>

    <div class="columns">
        <div class="column time" data-clock="cjk-time" data-vertical></div>
        <div class="column date" data-clock="cjk-date-weekday" data-vertical></div>
    </div>
    <div class="latin"><b class="tabular" data-clock="time"></b> · <span data-clock="long"></span></div>

    <form data-login>
        <div class="who">
            <span class="seal" data-user-initial></span>
            <button type="button" class="name" data-action="switch-user" title="Switch user"><span data-user-name></span><i data-icon="system-switch-user"></i></button>
        </div>
        <div class="entry">
            <label class="field">
                <input data-field="password" type="password" placeholder="Password">
                <button type="button" class="reveal" data-action="reveal" title="Show password"><i data-icon="view-visible"></i></button>
            </label>
            <button class="go" type="submit" title="Log in"><i data-icon="go-next"></i></button>
        </div>
        <div class="notes">
            <span class="message" data-message></span>
            <span class="capslock" data-capslock>Caps Lock is on</span>
        </div>
    </form>

    <div class="footer">
        <button class="session" data-action="session">Session&nbsp;<b data-session-name></b></button>
        <span class="rule"></span>
        <button data-power="suspend" title="Sleep"><i data-icon="system-suspend"></i></button>
        <button data-power="reboot" title="Restart"><i data-icon="system-reboot"></i></button>
        <button data-power="shutdown" title="Shut Down"><i data-icon="system-shutdown"></i></button>
    </div>
</div>
<div class="demo-hint">password <b>lintel</b> · <b>Ctrl+Alt</b> + <b>↑↓</b> state · <b>←→</b> design · <b>W</b> wallpaper <span data-wallpaper-name></span> · <b>S</b> session · <b>U</b> user · <b>V</b> show password · <b>Z</b> sleep · <b>B</b> restart · <b>Q</b> power off · <a href="index.html">all</a></div>
<script src="shared/icons.js"></script>
<script src="shared/wallpapers.js"></script>
<script src="shared/demo.js"></script>
</body>
</html>
